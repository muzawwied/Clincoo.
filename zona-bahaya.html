<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona Bahaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body.dark-mode { background-color: #000000; color: #e0e0e0; }
    body.dark-mode .text-gray-900, body.dark-mode .text-gray-800 { color: #f0f0f0; }
    body.dark-mode .text-gray-700 { color: #b0b0b0; }
    body.dark-mode .text-gray-500, body.dark-mode .text-gray-600 { color: #888888; }
    body.dark-mode .text-gray-400 { color: #666666; }
    body.dark-mode .bg-white { background-color: #0a0a0a !important; }
    body.dark-mode header button[onclick="history.back()"], body.dark-mode header button[aria-label="Kembali"] { background-color: #000000 !important; border: 1.5px solid rgba(255,255,255,0.4) !important; color: #ffffff !important; }
    body.dark-mode header button[onclick="history.back()"] svg, body.dark-mode header button[aria-label="Kembali"] svg { color: #ffffff !important; stroke: #ffffff !important; }
    body.dark-mode header button[onclick="history.back()"]:hover, body.dark-mode header button[aria-label="Kembali"]:hover { background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important; }
    body.dark-mode .bg-gray-50 { background-color: #222222 !important; }
    body.dark-mode .bg-gray-100 { background-color: #222222 !important; }
    body.dark-mode .border-gray-200, body.dark-mode .border-gray-100 { border-color: #222222 !important; }
    body.dark-mode .hover\:bg-gray-100:hover { background-color: #222222 !important; }
    body.dark-mode .hover\:bg-gray-200:hover { background-color: #222222 !important; }
    body.dark-mode input, body.dark-mode select, body.dark-mode textarea { background-color: #0a0a0a; color: #ffffff; border-color: #222222; }
    body.dark-mode input:focus, body.dark-mode select:focus, body.dark-mode textarea:focus { border-color: #222222; outline: none; }
    body.dark-mode .bg-\[#f7f7f9\] { background-color: #000000 !important; }
    body.dark-mode header { background-color: #000000 !important; }
  </style>
  <script>(function(){var t=localStorage.getItem('clincoo_theme')||'Sistem (Default)';var isDark=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(isDark)document.documentElement.classList.add('dark-mode');})();</script>
</head>
<body class="text-gray-900 antialiased h-screen w-full overflow-hidden relative bg-[#f7f7f9]">
  <script>(function(){var t=localStorage.getItem("clincoo_theme")||"Sistem (Default)";var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>
  <div class="w-full h-full overflow-y-auto hide-scrollbar flex flex-col items-center">
    <header class="w-full max-w-5xl z-30 p-4 sm:px-6 flex items-center gap-3 flex-shrink-0 border-b border-gray-200/60 dark:border-slate-800">
      <button onclick="history.back()" class="p-2 -ml-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-800 transition-colors flex items-center justify-center text-gray-800 dark:text-gray-100" aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold text-gray-800 dark:text-white tracking-tight">Zona Bahaya</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Tindakan berisiko yang tidak dapat dibatalkan</p>
      </div>
    </header>
    <main class="w-full max-w-5xl px-4 sm:px-6 py-4 pb-24">
      <div class="w-full flex flex-col divide-y divide-red-200 dark:divide-red-900/30">
        <div class="py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <h4 class="text-base font-semibold text-red-600 dark:text-red-400">Transfer Kepemilikan</h4>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Pindahkan kepemilikan proyek ke akun lain</p>
          </div>
          <div class="w-full sm:w-80">
            <input type="email" value="" class="w-full px-3.5 py-2 text-sm rounded-lg border border-red-200 dark:border-red-900/50 focus:outline-none" placeholder="email akun baru">
          </div>
        </div>
        <div class="py-5 flex items-center justify-between gap-4">
          <div class="min-w-0 flex-1">
            <h4 class="text-base font-semibold text-red-600 dark:text-red-400">Hapus Semua Data</h4>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Hapus semua file, variabel, dan konfigurasi proyek</p>
          </div>
          <button type="button" class="flex-shrink-0 px-4 py-2 text-sm font-medium text-red-600 border border-red-200 dark:border-red-900/50 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition-colors cursor-pointer">Hapus Data...</button>
        </div>
        <div class="py-5 flex items-center justify-between gap-4">
          <div class="min-w-0 flex-1">
            <h4 class="text-base font-semibold text-red-600 dark:text-red-400">Hapus Proyek</h4>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Menghapus proyek secara permanen beserta semua data terkait</p>
          </div>
          <button type="button" class="flex-shrink-0 px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors cursor-pointer">Hapus Proyek...</button>
        </div>
      </div>

    </main>
  </div>
  <script>
    let isEdited=false;function showActionButtons(){if(!isEdited){isEdited=true;const c=document.getElementById('action-buttons');c.classList.remove('hidden');c.classList.add('flex');void c.offsetWidth;c.classList.remove('opacity-0');c.classList.add('opacity-100');}}function cancelChanges(){window.location.reload();}function saveChanges(){const btn=document.querySelector('#action-buttons button.bg-blue-600');if(!btn)return;btn.innerText='Menyimpan...';btn.disabled=true;btn.classList.add('opacity-80','cursor-not-allowed');setTimeout(()=>{btn.innerText='Tersimpan!';btn.classList.replace('bg-blue-600','bg-emerald-500');btn.classList.replace('hover:bg-blue-700','hover:bg-emerald-600');setTimeout(()=>window.location.reload(),800);},800);}document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('input,textarea,select').forEach(input=>{input.addEventListener('input',showActionButtons);input.addEventListener('change',showActionButtons);});});function toggleSwitch(idPrefix){showActionButtons();const bg=document.getElementById(idPrefix+'-bg');const knob=document.getElementById(idPrefix+'-knob');if(bg.classList.contains('bg-blue-500')){bg.classList.replace('bg-blue-500','bg-gray-200');bg.classList.add('dark:bg-slate-700');knob.classList.remove('translate-x-5');}else{bg.classList.remove('bg-gray-200','dark:bg-slate-700');bg.classList.add('bg-blue-500');knob.classList.add('translate-x-5');}}
  </script>
</body>
</html>
