    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; transition: background-color 0.3s ease, color 0.3s ease; }
        :root { --accent-color: #000000; --accent-hover: #1f2937; --accent-text: #ffffff; }
        .bg-accent { background-color: var(--accent-color) !important; }
        .text-accent { color: var(--accent-color) !important; }
        .hover\:bg-accent-hover:hover { background-color: var(--accent-hover) !important; }
        body.dark-mode { background-color: #000000; color: #ffffff; }
        body.dark-mode .bg-white { background-color: #0a0a0a !important; }
        body.dark-mode .text-gray-900, body.dark-mode .text-gray-800 { color: #ffffff !important; }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600 { color: #b0b0b0 !important; }
        body.dark-mode .text-gray-500 { color: #888888 !important; }
        body.dark-mode .text-gray-400 { color: #666666 !important; }
        body.dark-mode .border-gray-200, body.dark-mode .border-gray-100, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
        body.dark-mode .bg-gray-50 { background-color: #111111 !important; }
        body.dark-mode .bg-gray-100 { background-color: #1a1a1a !important; }
        body.dark-mode header { background-color: #000000 !important; border-color: #222222 !important; }
        body.dark-mode header h1, body.dark-mode header .text-gray-900 { color: #ffffff !important; }
        body.dark-mode header button:hover { background-color: #1a1a1a !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

</head>
<body class="min-h-screen">
    <script>try{var t=localStorage.getItem("clincoo_theme")||"Sistem (Default)";var d=(t==="Gelap")||((t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.body.classList.add("dark-mode");var a=localStorage.getItem("clincoo_accent")||"Hitam (Default)";var am={"Hitam (Default)":{m:"#000000",h:"#1f2937"},Biru:{m:"#2563eb",h:"#1d4ed8"},Hijau:{m:"#059669",h:"#047857"},Ungu:{m:"#9333ea",h:"#7e22ce"},Merah:{m:"#dc2626",h:"#b91c1c"}};var c=am[a]||am["Hitam (Default)"];document.documentElement.style.setProperty("--accent-color",c.m);document.documentElement.style.setProperty("--accent-hover",c.h);}catch(e){}</script>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-100">
        <div class="max-w-3xl mx-auto flex items-center justify-between px-5 h-14">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i>
                </button>
                <h1 class="text-base font-bold text-gray-900">Notifikasi</h1>
            </div>
            <button onclick="markAllNotifsRead()" class="text-xs font-semibold text-gray-500 hover:text-gray-900 transition-colors flex items-center gap-1">
                <i data-lucide="check-check" class="w-4 h-4"></i>
                Tandai dibaca
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-3xl mx-auto px-5 pt-6 pb-10">
        <div class="mb-4">
            <h2 class="text-lg font-bold text-gray-900 tracking-tight">Semua notifikasi</h2>
            <p class="text-sm text-gray-500">Riwayat notifikasi real-time dari sistem</p>
        </div>
        <div id="notif-full-list">
            <div class="text-center py-12">
                <p class="text-[15px] text-gray-500">Memuat notifikasi...</p>
            </div>
        </div>
    </main>

    <script src="../js/notifications.js"></script>
    <script src="../js/path-router.js"></script>
    <script>lucide.createIcons();</script>

</html>
