name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-clincoo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Bersihkan artefak repo (tidak ikut di-publish)
        run: rm -rf .git .github tests node_modules .wrangler package.json package-lock.json .gitignore

      - name: Pasang wrangler
        run: npm install -g wrangler

      - name: Deploy ke Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=clincoo --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
