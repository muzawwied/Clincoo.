<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Langganan</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    body.dark-mode { background-color: #000000; color: #e0e0e0; }
    body.dark-mode .text-gray-900, body.dark-mode .text-gray-800 { color: #f0f0f0; }
    body.dark-mode .text-gray-700 { color: #b0b0b0; }
    body.dark-mode .text-gray-500, body.dark-mode .text-gray-600 { color: #888888; }
    body.dark-mode .text-gray-400 { color: #666666; }
    body.dark-mode .bg-white { background-color: #0a0a0a !important; }
    body.dark-mode header { background-color: transparent !important; }

    body.dark-mode .bg-gray-50 { background-color: #222222 !important; }
    body.dark-mode .bg-gray-100 { background-color: #222222 !important; }
    body.dark-mode .border-gray-200, body.dark-mode .border-gray-100 { border-color: #222222 !important; }
    body.dark-mode .hover\:bg-gray-100:hover { background-color: #222222 !important; }
    body.dark-mode .hover\:bg-gray-200:hover { background-color: #333333 !important; }
    body.dark-mode input, body.dark-mode select, body.dark-mode textarea { background-color: #0a0a0a; color: #ffffff; border-color: #222222; }
    body.dark-mode .bg-\[#f7f7f9\] { background-color: #000000 !important; }
    body.dark-mode .border-gray-300 { border-color: #333333 !important; }
    body.dark-mode .border-gray-200\/50,
    body.dark-mode .border-gray-200\/60,
    body.dark-mode .border-gray-200\/70 { border-color: #222222 !important; }
    body.dark-mode .bg-emerald-50 { background-color: #0d2618 !important; }
    body.dark-mode .text-emerald-700 { color: #34d399 !important; }
    body.dark-mode .bg-red-50 { background-color: #2a1414 !important; }
    body.dark-mode .border-red-100,
    body.dark-mode .border-red-200 { border-color: #4a2020 !important; }
    body.dark-mode .text-red-700 { color: #f87171 !important; }
    body.dark-mode .hover\:bg-gray-50:hover { background-color: #1a1a1a !important; }
  </style>
  <script>
    (function(){
      var t=localStorage.getItem('clincoo_theme')||'Sistem (Default)';
      var isDark=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      if(isDark) document.documentElement.classList.add('dark-mode');
    })();
  </script>
<!-- no-flash-v1 -->
<script>(function(){try{var t=localStorage.getItem('clincoo_theme')||'Sistem (Default)';var d=(t==='Gelap')||((t==='Sistem (Default)'||!t)&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.style.background='#000000';document.documentElement.style.colorScheme='dark';}}catch(e){}})();</script>
<style>
.clincoo-shimmer{position:relative;overflow:hidden;display:inline-block;min-width:4.5rem;min-height:1.4em;color:transparent!important;background:#e5e7eb;border-radius:8px;-webkit-user-select:none;user-select:none;vertical-align:middle}
.clincoo-shimmer::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:clincoo-shimmer 1.3s infinite}
@keyframes clincoo-shimmer{100%{transform:translateX(100%)}}
.dark-mode .clincoo-shimmer{background:#1e293b}
.dark-mode .clincoo-shimmer::after{background:linear-gradient(90deg,transparent,rgba(148,163,184,.3),transparent)}
</style>
</head>
<body class="text-gray-900 antialiased h-screen w-full overflow-hidden relative bg-[#f7f7f9]">
  <script>
    if(document.documentElement.classList.contains('dark-mode')) {
        document.body.classList.add("dark-mode");
    }
  </script>

  <header class="bg-transparent flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40">
    <button onclick="history.back()" aria-label="Kembali" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-all cursor-pointer text-gray-700 dark:text-white">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
  </header>

  <div class="w-full h-full overflow-y-auto hide-scrollbar flex flex-col items-center pt-16">

    <div class="w-full max-w-md px-4 sm:px-6 pt-2">
      <h1 class="text-xl font-bold text-gray-900 dark:text-white">Konfirmasi Langganan</h1>
      <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Periksa pesanan Anda sebelum melanjutkan</p>
    </div>

    <main class="w-full max-w-md px-4 sm:px-6 py-4 pb-24 flex flex-col gap-4">

      <div id="card-order" class="bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-200/60 rounded-2xl p-5">
        <div class="flex items-center justify-between">
          <p class="text-xs text-gray-500 dark:text-gray-400">Paket dipilih</p>
          <span id="order-plan-badge" class="clincoo-shimmer inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400">-</span>
        </div>
        <div class="mt-4 flex flex-col gap-3 text-sm">
          <div class="flex items-center justify-between">
            <span class="text-gray-500 dark:text-gray-400">Siklus tagihan</span>
            <span id="order-billing" class="clincoo-shimmer font-medium text-gray-900 dark:text-white">-</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-500 dark:text-gray-400">Harga per siklus</span>
            <span id="order-price" class="clincoo-shimmer font-medium text-gray-900 dark:text-white">-</span>
          </div>
          <div class="border-t border-gray-100 dark:border-gray-200/60 pt-3 flex items-center justify-between">
            <span class="text-gray-500 dark:text-gray-400">Total pembayaran</span>
            <span id="order-total" class="clincoo-shimmer text-lg font-extrabold text-gray-900 dark:text-white">-</span>
          </div>
        </div>
      </div>

      <div id="card-wallet" class="bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-200/60 rounded-2xl p-5">
        <p class="text-xs text-gray-500 dark:text-gray-400">Metode pembayaran</p>
        <div class="mt-2 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-emerald-50 dark:bg-emerald-50 flex items-center justify-center">
              <i data-lucide="wallet" class="w-4 h-4 text-emerald-700 dark:text-emerald-700"></i>
            </div>
            <span class="text-sm font-medium text-gray-900 dark:text-white">Saldo Dompet</span>
          </div>
          <span id="wallet-balance" class="clincoo-shimmer text-sm font-semibold text-gray-900 dark:text-white">-</span>
        </div>
        <div class="mt-3 flex items-center justify-between">
          <span class="text-xs text-gray-500 dark:text-gray-400">Sisa saldo setelah pembayaran</span>
          <span id="wallet-after" class="clincoo-shimmer text-xs font-medium text-gray-700 dark:text-gray-700">-</span>
        </div>
      </div>

      <div id="pay-error" class="hidden bg-red-50 border border-red-100 dark:border-red-100 rounded-xl px-4 py-3 text-xs text-red-700 dark:text-red-700 flex flex-col gap-2">
        <span id="pay-error-text"></span>
        <button onclick="window.location.href='dompet.html'" class="self-start font-semibold underline underline-offset-2 cursor-pointer">Isi saldo dompet</button>
      </div>

      <div id="pay-success" class="hidden bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-3 text-xs text-emerald-700 dark:text-emerald-700 font-medium"></div>

      <div class="flex flex-col gap-2 mt-1">
        <button id="btn-pay" onclick="pay()" class="w-full py-3.5 bg-accent text-white hover:bg-accent-hover rounded-xl font-semibold text-sm transition-all shadow-md active:scale-95 cursor-pointer">Bayar &amp; Aktifkan Sekarang</button>
        <button onclick="history.back()" class="w-full py-3 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors cursor-pointer">Batal</button>
      </div>

      <p class="text-center text-[11px] text-gray-400">Pembayaran dipotong langsung dari Saldo Dompet Anda.</p>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const SUB_API = 'https://clincoo.pages.dev/api/subscription';
    const WALLET_API = 'https://clincoo.pages.dev/api/wallet';
    const PRICES = { 'Starter': 0, 'Pro': 49000, 'Bisnis': 129000 };
    const fmtID = function(n){ return 'Rp ' + Number(n).toLocaleString('id-ID'); };

    const params = new URLSearchParams(window.location.search);
    const PLAN = params.get('plan') || 'Starter';
    const BILLING = params.get('billing') === 'Tahunan' ? 'Tahunan' : 'Bulanan';

    let totalPrice = 0;
    let alreadyActive = false;

    function planBadgeClass(plan){
      if(plan === 'Pro') return 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400';
      if(plan === 'Bisnis') return 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400';
      return 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400';
    }

    function setVal(id, text){
      const el = document.getElementById(id);
      if(!el) return;
      el.textContent = text;
      el.classList.remove('clincoo-shimmer');
    }

    async function load(){
      if(!PRICES.hasOwnProperty(PLAN)){
        document.getElementById('order-plan-badge').textContent = PLAN + ' tidak dikenal';
        const payBtn0 = document.getElementById('btn-pay');
        payBtn0.innerText = 'Paket tidak valid';
        payBtn0.disabled = true;
        return;
      }
      totalPrice = BILLING === 'Tahunan' ? PRICES[PLAN] * 12 : PRICES[PLAN];

      let sub = null, wallet = null;
      try { const r = await fetch(SUB_API); sub = await r.json(); } catch(e) {}
      try { const r = await fetch(WALLET_API); wallet = await r.json(); } catch(e) {}

      const badge = document.getElementById('order-plan-badge');
      badge.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ' + planBadgeClass(PLAN);
      setVal('order-plan-badge', PLAN);
      setVal('order-billing', BILLING);
      setVal('order-price', PRICES[PLAN] === 0 ? 'Gratis' : fmtID(PRICES[PLAN]) + '/bulan');
      setVal('order-total', totalPrice === 0 ? 'Gratis' : fmtID(totalPrice));

      const balance = (wallet && typeof wallet.balance === 'number') ? wallet.balance : 0;
      setVal('wallet-balance', fmtID(balance));
      setVal('wallet-after', totalPrice === 0 ? fmtID(balance) : fmtID(balance - totalPrice));

      const payBtn = document.getElementById('btn-pay');

      if(totalPrice > 0 && balance < totalPrice){
        document.getElementById('pay-error-text').textContent = 'Saldo dompet tidak cukup. Butuh ' + fmtID(totalPrice) + ', saldo Anda ' + fmtID(balance) + '.';
        document.getElementById('pay-error').classList.remove('hidden');
        payBtn.innerText = 'Saldo Tidak Cukup';
        payBtn.disabled = true;
        payBtn.classList.add('opacity-60','cursor-not-allowed');
        return;
      }

      if(sub && sub.plan === PLAN){
        alreadyActive = true;
        document.getElementById('pay-success').textContent = 'Paket ' + PLAN + ' sudah aktif di akun Anda.';
        document.getElementById('pay-success').classList.remove('hidden');
        payBtn.innerText = 'Kembali ke Langganan';
        payBtn.onclick = function(){ window.location.href = 'langganan.html'; };
        return;
      }

      payBtn.innerText = totalPrice === 0 ? 'Aktifkan Paket Gratis' : 'Bayar & Aktifkan Sekarang';
    }

    async function pay(){
      if(alreadyActive){ window.location.href = 'langganan.html'; return; }
      const btn = document.getElementById('btn-pay');
      btn.disabled = true;
      btn.classList.add('opacity-80','cursor-not-allowed');
      btn.innerText = 'Memproses...';
      try {
        const res = await fetch(SUB_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan: PLAN, billingCycle: BILLING })
        });
        const data = await res.json();
        if(res.ok && data.success){
          document.getElementById('pay-success').textContent = 'Berhasil! Paket ' + PLAN + ' (' + BILLING + ') sekarang aktif.';
          document.getElementById('pay-success').classList.remove('hidden');
          document.getElementById('pay-error').classList.add('hidden');
          btn.innerText = 'Berhasil';
          setTimeout(function(){ window.location.href = 'langganan.html'; }, 900);
        } else if(res.status === 402){
          document.getElementById('pay-error-text').textContent = 'Saldo dompet tidak cukup. Butuh ' + fmtID(data.required || totalPrice) + ', saldo Anda ' + fmtID(data.balance || 0) + '.';
          document.getElementById('pay-error').classList.remove('hidden');
          btn.innerText = 'Saldo Tidak Cukup';
        } else {
          document.getElementById('pay-error-text').textContent = 'Gagal memproses: ' + ((data && data.error) || 'coba lagi nanti');
          document.getElementById('pay-error').classList.remove('hidden');
          btn.innerText = 'Coba Lagi';
          btn.disabled = false;
          btn.classList.remove('opacity-80','cursor-not-allowed');
        }
      } catch(e) {
        document.getElementById('pay-error-text').textContent = 'Koneksi bermasalah, coba lagi.';
        document.getElementById('pay-error').classList.remove('hidden');
        btn.innerText = 'Coba Lagi';
        btn.disabled = false;
        btn.classList.remove('opacity-80','cursor-not-allowed');
      }
    }

    load();
  </script>
</body>
</html>
