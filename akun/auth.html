<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clincoo - Masuk</title>
<script>
// Halaman auth kini dilayani bersih di /auth/ (auth/index.html tanpa ".html").
// Alamat lama ini dipertahankan hanya sebagai pengalih (query OAuth ?code/?state/?next tetap terbawa).
(function () {
  var base = '/Clincoo./auth/';
  var target = base + location.search + location.hash;
  location.replace(target);
})();
</script>
</head>
<body style="background:#fff;"></body>
</html>
