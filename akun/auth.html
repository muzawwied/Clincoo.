    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #ffffff; 
            transition: background-color 0.3s ease, color 0.3s ease; 
        }
        
        /* Tema Gelap Dasar */
        body.dark-mode { 
            background-color: #050505; 
            color: #e0e0e0; 
        }
        
        /* Menghilangkan panah pada input number & auto-fill styling */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        body.dark-mode input:-webkit-autofill {
            -webkit-text-fill-color: #fff !important;
        }

        /* Animasi */
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Loader */
        .loader {
            border: 2.5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 2.5px solid #fff;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        body.dark-mode .loader {
            border: 2.5px solid rgba(0,0,0,0.2);
            border-top: 2.5px solid #000;
        }
        .loader-lg {
            border: 3px solid rgba(0,0,0,0.15);
            border-radius: 50%;
            border-top: 3px solid #000;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        body.dark-mode .loader-lg {
            border: 3px solid rgba(255,255,255,0.25);
            border-top: 3px solid #fff;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 selection:bg-gray-900 selection:text-white dark:selection:bg-white dark:selection:text-black">

                    <button type="button" class="flex items-center justify-center gap-2.5 py-3 px-5 bg-gray-50/80 hover:bg-gray-100 border border-gray-200 text-gray-700 rounded-full font-semibold text-sm transition-all active:scale-[0.97] dark:bg-white/[0.02] dark:border-white/10 dark:text-gray-300 dark:hover:bg-white/[0.06]" onclick="startOAuth('github')">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                        </svg>
                        GitHub
                    </button>
                </div>

                <!-- Navigasi Bawah -->
                <div class="text-center pb-2">
                    <p class="text-sm text-gray-500 dark:text-gray-400">Sudah punya akun? <button type="button" onclick="switchView('login')" class="font-bold text-gray-900 dark:text-white hover:text-gray-600 dark:hover:text-gray-300 transition-colors cursor-pointer">Masuk sekarang</button></p>
                </div>
            </div>

        </div>

        <!-- Footer Teks Abu-abu -->
        <div class="px-2 sm:px-8 py-2 text-center text-xs text-gray-400 dark:text-gray-600 border-t border-gray-100 dark:border-white/5 flex items-center justify-center gap-2">
            <a href="#" class="hover:text-gray-600 dark:hover:text-gray-400 transition-colors">Syarat & Ketentuan</a>
            <span>|</span>
            <a href="#" class="hover:text-gray-600 dark:hover:text-gray-400 transition-colors">Privacy Policy</a>
        </div>
    </div>

    <!-- Sistem Modal -->
    <div id="system-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/40 dark:bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white dark:bg-[#111111] rounded-2xl p-6 w-full max-w-sm relative z-10 shadow-2xl border border-gray-100 dark:border-white/10 animate-fade-in text-center">
            <div id="modal-icon-wrap" class="w-12 h-12 rounded-full bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mb-4 mx-auto">
                <i data-lucide="check-circle" class="w-6 h-6"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-gray-900 dark:text-white mb-2"></h3>
            <p id="modal-message" class="text-sm text-gray-500 dark:text-gray-400 mb-7 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-gray-900 dark:bg-white text-white dark:text-black rounded-xl font-bold text-sm hover:bg-gray-800 dark:hover:bg-gray-100 transition-all shadow-sm active:scale-[0.98]">Tutup</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try { lucide.createIcons(); } catch (e) {}
        });

        // Fungsi Toggle Password
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            try { lucide.createIcons(); } catch (e) {}
        }

        // Logika untuk pindah tampilan Masuk / Daftar
        function switchView(view) {
            const viewLogin = document.getElementById('view-login');
            const viewRegister = document.getElementById('view-register');
            const pageTitle = document.getElementById('page-title');
            const pageDesc = document.getElementById('page-desc');
            
            if (view === 'login') {
                pageTitle.textContent = "Masuk ke Clincoo";
                pageDesc.textContent = "Masuk untuk mengakses akun Anda";
                
                viewRegister.classList.add('hidden');
                viewRegister.classList.remove('animate-fade-in');
                
                viewLogin.classList.remove('hidden');
                void viewLogin.offsetWidth; // Force reflow
                viewLogin.classList.add('animate-fade-in');
            } else {
                pageTitle.textContent = "Bergabung ke Clincoo";
                pageDesc.textContent = "Buat akun Clincoo baru";

                viewLogin.classList.add('hidden');
                viewLogin.classList.remove('animate-fade-in');
                
                viewRegister.classList.remove('hidden');
                void viewRegister.offsetWidth; // Force reflow
                viewRegister.classList.add('animate-fade-in');
            }
        }

        // ==== KONFIG AUTH ====
        const API_BASE = 'https://clincoo-be2.pages.dev/api/auth';
        const TOKEN_KEY = 'clincoo_auth_token';
        const GITHUB_CLIENT_ID = 'Ov23ctIBGjQBolR5PS2C';

        function saveSession(data) {
            try {
                localStorage.setItem(TOKEN_KEY, data.token);
                // simpan user lebih dulu -> data profil di bawah otomatis masuk namespace akun
                localStorage.setItem('clincoo_auth_user', JSON.stringify(data.user || {}));
                localStorage.setItem('clincoo_fullname', data.user.name || '');
                localStorage.setItem('clincoo_email', data.user.email || '');
                if (data.user.avatar_url) localStorage.setItem('clincoo_profile_pic', data.user.avatar_url);
            } catch (e) {}
        }

        // Handle aksi login & register (nyambung ke backend Clincoo)
        async function handleAuth(event, action) {
            event.preventDefault();

            // Validasi khusus register
            if (action === 'register') {
                const pass = document.getElementById('reg-pass').value;
                const passConfirm = document.getElementById('reg-pass-confirm').value;

                if (pass !== passConfirm) {
                    showModal('Pendaftaran Gagal', 'Kata sandi dan konfirmasi kata sandi tidak cocok.', 'error');
                    return;
                }
            }

            const btn = action === 'login' ? document.getElementById('btn-login') : document.getElementById('btn-register');
            const btnText = btn.querySelector('.btn-text');
            const originalText = btnText.innerText;

            btn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span>';

            try {
                const body = action === 'login'
                    ? { email: document.getElementById('login-email').value, password: document.getElementById('login-pass').value }
                    : { name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value, password: document.getElementById('reg-pass').value };

                const res = await fetch(API_BASE + (action === 'login' ? '/login' : '/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok || !data.token) throw new Error(data.error || 'Terjadi kesalahan, coba lagi.');

                saveSession(data);
                setTimeout(() => { window.location.href = '../index.html'; }, 400);
            } catch (err) {
                showModal(action === 'login' ? 'Login Gagal' : 'Pendaftaran Gagal', err.message, 'error');
                btn.disabled = false;
                btnText.innerText = originalText;
            }
        }

        // Helper cookie untuk state OAuth (lebih tahan redirect lintas-domain daripada
        // localStorage/sessionStorage di beberapa browser dengan anti bounce-tracking).
        function setOauthStateCookie(val, provider) {
            const payload = encodeURIComponent(JSON.stringify({ v: val, t: Date.now(), p: provider }));
            document.cookie = 'clincoo_oauth_state=' + payload + '; Max-Age=900; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }
        function getOauthStateCookie() {
            const m = document.cookie.match(/(?:^|;\s*)clincoo_oauth_state=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }
        function clearOauthStateCookie() {
            document.cookie = 'clincoo_oauth_state=; Max-Age=0; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }

        // ==== LOGIN SOSIAL (OAuth) ====
        function startOAuth(provider) {
            const redirectUri = window.location.origin + window.location.pathname;
            // State acak per sesi — cegah serangan login-CSRF (callback jahat memaksa
            // korban login ke akun penyerang). Callback harus mengembalikan state ini.
            const st = (crypto.randomUUID ? crypto.randomUUID() : ('s' + Date.now() + Math.random())).replace(/-/g, '');
            // Cookie (bukan localStorage/sessionStorage) — beberapa browser (Samsung
            // Internet, Firefox, Brave) punya fitur anti "bounce tracking" yang otomatis
            // MENGHAPUS localStorage yang baru ditulis persis sebelum redirect ke domain
            // lain (github.com/accounts.google.com), jadi state selalu hilang saat kembali.
            // Cookie SameSite=Lax dikecualikan dari itu karena memang untuk alur ini.
            // Payload menyimpan provider (p) juga -> deteksi provider saat callback,
            // karena state sekarang acak, bukan literal 'github'/'google'.
            setOauthStateCookie(st, provider);
            if (provider === 'github') {
                window.location.href = 'https://github.com/login/oauth/authorize?client_id=' + GITHUB_CLIENT_ID +
                    '&scope=read:user%20user:email%20repo&state=' + st + '&redirect_uri=' + encodeURIComponent(redirectUri);
            } else {
                fetch(API_BASE + '/google')
                    .then(r => r.json())
                    .then(data => {
                        if (!data.client_id) throw new Error(data.error || 'Client ID Google tidak tersedia.');
                        window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + data.client_id +
                            '&redirect_uri=' + encodeURIComponent(redirectUri) +
                            '&response_type=code&scope=openid%20email%20profile&state=' + st + '&prompt=select_account';
                    })
                    .catch(err => showModal('Gagal Memulai Login Google', err.message, 'error'));
            }
        }

        async function handleOAuthCallback(code, provider) {
            const redirectUri = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, window.location.pathname);
            try {
                const res = await fetch(API_BASE + '/' + provider, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, redirect_uri: redirectUri })
                });
                const data = await res.json();
                if (!res.ok || !data.token) throw new Error(data.error || 'Login ' + provider + ' gagal.');
                saveSession(data);
                setTimeout(() => { window.location.href = '../index.html'; }, 400);
            } catch (err) {
                document.getElementById('oauth-loading').classList.add('hidden');
                showModal('Login ' + (provider === 'github' ? 'GitHub' : 'Google') + ' Gagal', err.message, 'error');
            }
        }

        // Handle callback OAuth & sesi aktif saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const oauthError = params.get('error');
            if (code) {
                // Deteksi provider dari state tersimpan (cookie). Tanpa validasi blokir:
                // selalu lanjut login, tanpa popup pemblokir.
                const savedRaw = getOauthStateCookie();
                let savedProvider = 'github';
                try {
                    const parsed = JSON.parse(savedRaw || 'null');
                    if (parsed && parsed.p === 'google') savedProvider = 'google';
                } catch (e) {}
                clearOauthStateCookie();
                document.getElementById('oauth-loading').classList.remove('hidden');
                handleOAuthCallback(code, savedProvider);
            } else if (oauthError) {
                showModal('Login Dibatalkan', 'Proses login dibatalkan atau gagal. Silakan coba lagi.', 'error');
            }

            // Kalau sesi masih aktif, langsung ke beranda
            (async () => {
                try {
                    const token = localStorage.getItem(TOKEN_KEY);
                    if (!token) return;
                    const res = await fetch(API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (res.ok) {
                        const d = await res.json();
                        if (d.authenticated) window.location.replace('../index.html');
                    } else {
                        localStorage.removeItem(TOKEN_KEY);
                    }
                } catch (e) {}
            })();
        });

        // Fungsi Modal
        function showModal(title, message, type = 'success') {
            var iconWrap = document.getElementById('modal-icon-wrap');
            var iconName = 'check-circle';
            var bgClass = 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400';
            
            var tLower = (title || '').toLowerCase();
            if (tLower.includes('gagal') || tLower.includes('tidak valid') || type === 'error') {
                iconName = 'alert-circle';
                bgClass = 'bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400';
            }
            
            if (iconWrap) {
                iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto ' + bgClass;
                iconWrap.innerHTML = '<i data-lucide="' + iconName + '" class="w-6 h-6"></i>';
            }

            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            var modal = document.getElementById('system-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            try { lucide.createIcons(); } catch (e) {}
        }

        function closeModal() {
            var modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
