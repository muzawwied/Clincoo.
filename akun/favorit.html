    <script>
        function toggleOption(btn, event) {
            event.preventDefault();
            event.stopPropagation();
            document.querySelectorAll('.option-popup').forEach(popup => {
                if (popup !== btn.nextElementSibling) {
                    popup.classList.remove('opacity-100', 'visible', 'translate-y-0');
                    popup.classList.add('opacity-0', 'invisible', 'translate-y-2');
                }
            });
            const popup = btn.nextElementSibling;
            if (popup.classList.contains('opacity-100')) {
                popup.classList.remove('opacity-100', 'visible', 'translate-y-0');
                popup.classList.add('opacity-0', 'invisible', 'translate-y-2');
            } else {
                popup.classList.remove('opacity-0', 'invisible', 'translate-y-2');
                popup.classList.add('opacity-100', 'visible', 'translate-y-0');
            }
        }
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.option-popup') && !e.target.closest('button[onclick^="toggleOption"]')) {
                document.querySelectorAll('.option-popup').forEach(popup => {
                    popup.classList.remove('opacity-100', 'visible', 'translate-y-0');
                    popup.classList.add('opacity-0', 'invisible', 'translate-y-2');
                });
            }
        });

        function refreshFavoriteList() {
            const list = document.getElementById('favorit-list');
            const emptyState = document.getElementById('empty-state');
            if (!list) return;
            const favs = ClincooTemplates.getFavorites();
            list.innerHTML = '';
            favs.forEach(key => {
                const t = ClincooTemplates.list[key];
                if (!t) return;
                const card = document.createElement('div');
                card.className = 'w-full border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-300 cursor-pointer group flex flex-col gap-4 relative opacity-0 translate-y-2 transition-all';
                card.innerHTML = `
                    <div class="w-full aspect-video bg-[#F9FAFB] rounded-xl border border-gray-100 group-hover:border-gray-200 transition-colors overflow-hidden p-4">
                        <img src="../assets/templates/${key}.png" alt="Pratinjau ${t.name}" class="w-full h-full object-cover rounded-lg group-hover:scale-[1.02] transition-transform duration-300">
                    </div>
                    <div class="flex justify-between items-end gap-3 w-full">
                        <div class="flex flex-col flex-1 overflow-hidden">
                            <h3 class="font-semibold text-gray-900 text-base group-hover:text-black truncate">${t.name}</h3>
                            <p class="text-sm text-gray-500 mt-1 leading-relaxed line-clamp-2">${t.desc}</p>
                        </div>
                        <div class="relative shrink-0">
                            <button class="p-1.5 text-gray-400 hover:text-black hover:bg-gray-50 rounded-lg transition-colors" onclick="toggleOption(this, event)" aria-label="Opsi template">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
                            </button>
                            <div class="option-popup absolute bottom-full right-0 mb-2 w-44 bg-white border border-gray-100 rounded-xl shadow-[0_4px_20px_rgb(0,0,0,0.08)] py-2 opacity-0 invisible translate-y-2 transition-all duration-200 z-20 origin-bottom-right">
                                <button onclick="useTemplate('${key}', event)" class="w-full text-left px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">Gunakan Template</button>
                                <button onclick="previewTemplate('${key}', event)" class="w-full text-left px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">Lihat Preview</button>
                                <button onclick="ClincooTemplates.unfavorite('${key}', event)" class="w-full text-left px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">Hapus dari Favorit</button>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
                setTimeout(() => card.classList.remove('opacity-0', 'translate-y-2'), 50);
            });
            if (emptyState) emptyState.style.display = favs.length ? 'none' : 'flex';
            lucide.createIcons();
        }
        document.addEventListener('DOMContentLoaded', refreshFavoriteList);
    </script>
<script>
(function(){
  var path=window.location.pathname.split('/').pop()||'aktivitas.html';
  var links=document.querySelectorAll('.sidebar-nav-link');
  links.forEach(function(link){
    var href=link.getAttribute('href');
    if(href===path){
      link.classList.add('bg-gray-50','text-gray-900');
      link.classList.remove('hover:bg-gray-50','text-gray-700');
      var icon=link.querySelector('i');
      if(icon){
        icon.className=icon.className.replace('ph ph-','ph-fill ph-');
        icon.classList.remove('text-gray-500');
        icon.classList.add('text-gray-900');
      }
      var svg=link.querySelector('svg');
      if(svg){
        svg.classList.remove('text-gray-500');
        svg.classList.add('text-gray-900');
      }
    }
  });
})();
</script>
