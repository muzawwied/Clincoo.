<!DOCTYPE html>
<html lang="id">
<head>
  <script src="../js/auth-client.js"></script>
    <script src="../js/accent-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lupa Kata Sandi</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
    <script src="https://unpkg.com/lucide@1.41.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; transition: background-color 0.3s ease, color 0.3s ease; }
        :root { --accent-color: #000000; --accent-hover: #1f2937; --accent-text: #ffffff; }
        .bg-accent { background-color: var(--accent-color) !important; }
        .text-accent { color: var(--accent-color) !important; }
        .border-accent { border-color: var(--accent-color) !important; }
        body.dark-mode { background-color: #000000; color: #ffffff; }
        body.dark-mode .bg-white { background-color: #0a0a0a !important; }
        body.dark-mode .text-\[\#222222\] { color: #ffffff !important; }
        body.dark-mode button[onclick="history.back()"], body.dark-mode header button[onclick] {
            background-color: #000000 !important; border: 1.5px solid rgba(255,255,255,0.4) !important; color: #ffffff !important;
        }
        body.dark-mode button[onclick="history.back()"] svg, body.dark-mode header button[onclick] svg { color: #ffffff !important; stroke: #ffffff !important; }
        body.dark-mode button[onclick="history.back()"]:hover, body.dark-mode header button[onclick]:hover {
            background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important;
        }
        body.dark-mode .text-gray-900, body.dark-mode .text-gray-800, body.dark-mode .text-black { color: #ffffff !important; }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600, body.dark-mode .text-gray-500 { color: #888888 !important; }
        body.dark-mode .border-gray-100, body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
        body.dark-mode .hover\:bg-gray-50:hover, body.dark-mode .hover\:bg-gray-100:hover { background-color: #0a0a0a !important; }
        body.dark-mode .bg-gray-50, body.dark-mode .bg-gray-100 { background-color: #0a0a0a !important; }
        body.dark-mode input[type="email"] { background-color: #0a0a0a; color: #ffffff; border-color: #222222; }
        body.dark-mode input[type="email"]:focus { border-color: #444444; outline: none; }
        body.dark-mode header { background-color: #000000 !important; border-color: #222222 !important; }
        body.dark-mode .text-gray-400 { color: #666666 !important; }
        body.dark-mode .bg-black { background-color: #ffffff !important; color: #000000 !important; }
        body.dark-mode .bg-black.text-white { color: #000000 !important; }
        body.dark-mode .hover\:bg-gray-800:hover { background-color: #e5e5e5 !important; }
        body.dark-mode .bg-accent { background-color: #ffffff !important; color: #000000 !important; }
        body.dark-mode .text-accent { color: #ffffff !important; }
        body.dark-mode .border-accent { border-color: #ffffff !important; }
    </style>
</head>

<body class="min-h-screen flex flex-col text-gray-900 pt-16 bg-[#ffffff]">
    <script>(function(){var t=localStorage.getItem("clincoo_theme");var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>

    <header class="bg-white flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40 transition-colors">
        <button onclick="history.back()" class="top-2 left-5 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <h1 class="font-extrabold text-lg text-gray-900 tracking-tight">Lupa Kata Sandi</h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto px-6 py-8 flex flex-col">
        <!-- FORM -->
        <div id="form-view">
            <h2 class="font-extrabold text-2xl text-gray-900 tracking-tight font-['Space_Grotesk']">Atur ulang kata sandi</h2>
            <p class="text-sm text-gray-500 mt-2.5">Masukkan email akun Clincoo Anda. Kami akan mengirim tautan untuk mengatur kata sandi baru.</p>

            <div class="mt-8">
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 pl-2">Email</label>
                <input type="email" id="reset-email" required placeholder="nama@email.com" class="w-full px-5 py-3.5 bg-gray-50/50 border border-gray-200 text-gray-900 rounded-full text-sm placeholder-gray-400 focus:outline-none focus:bg-white focus:border-gray-400 transition-all duration-200">
            </div>

            <div class="mt-6">
                <button type="button" onclick="sendResetLink()" id="send-btn" class="w-full flex items-center justify-center gap-2 py-3.5 bg-gray-900 text-white rounded-full font-bold text-sm hover:bg-gray-800 transition-all shadow-md hover:shadow-lg active:scale-[0.98]">
                    <span class="btn-text">Kirim Tautan</span>
                </button>
            </div>
        </div>

        <!-- SUKSES -->
        <div id="success-view" class="hidden flex-col items-center text-center py-10">
            <i data-lucide="mail-check" class="w-14 h-14 text-gray-300 mb-5"></i>
            <h2 class="font-extrabold text-xl text-gray-900 tracking-tight font-['Space_Grotesk']">Cek email Anda</h2>
            <p class="text-sm text-gray-500 mt-3 max-w-xs" id="success-desc">Jika email tersebut terdaftar di Clincoo, tautan untuk mengatur ulang kata sandi sudah dikirim. Tautan berlaku 1 jam.</p>
            <a href="auth.html" class="mt-8 inline-flex items-center gap-2 px-6 py-3 bg-gray-900 text-white rounded-full font-bold text-sm hover:bg-gray-800 transition-all shadow-md active:scale-[0.98]">
                Kembali ke Halaman Masuk
            </a>
        </div>
    </main>

    <script>
        const API_BASE = location.hostname.indexOf('github.io') !== -1 ? 'https://clincoo-be2.pages.dev' : '';

        async function sendResetLink() {
            const email = document.getElementById('reset-email').value.trim();
            if (!email || email.indexOf('@') < 0) { alert('Masukkan email yang valid.'); return; }
            const btn = document.getElementById('send-btn');
            btn.querySelector('.btn-text').textContent = 'Mengirim...';
            btn.style.opacity = '0.7'; btn.disabled = true;
            try {
                const res = await fetch(API_BASE + '/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                document.getElementById('form-view').classList.add('hidden');
                const sv = document.getElementById('success-view');
                sv.classList.remove('hidden'); sv.classList.add('flex');
            } catch (err) {
                btn.querySelector('.btn-text').textContent = 'Kirim Tautan';
                btn.style.opacity = '1'; btn.disabled = false;
                alert('Gagal mengirim tautan: ' + (err && err.message ? err.message : 'kesalahan jaringan'));
            }
        }

        document.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendResetLink(); });
    </script>
</body>
</html>
