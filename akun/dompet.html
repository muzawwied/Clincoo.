    <script>
        // State Keys
        const BALANCE_KEY = 'clincoo_wallet_balance';
        const TRANSACTIONS_KEY = 'clincoo_wallet_transactions';

        let selectedNominalAmount = 50000;
        let activeFilter = 'all';

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initSampleDataIfEmpty();
            renderBalance();
            renderTransactions();
        });

        // Seed initial balance & demo transactions if clean slate
        function initSampleDataIfEmpty() {
            if (!localStorage.getItem(BALANCE_KEY)) {
                localStorage.setItem(BALANCE_KEY, '150000');
            }
            if (!localStorage.getItem(TRANSACTIONS_KEY)) {
                const sampleTransactions = [
                    {
                        id: 'TX-' + Math.floor(100000 + Math.random() * 900000),
                        title: 'Top Up Saldo via QRIS',
                        amount: 150000,
                        type: 'in',
                        date: getFormattedDate(new Date(Date.now() - 3600000 * 2)),
                        method: 'QRIS Instant'
                    }
                ];
                localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(sampleTransactions));
            }
        }

        // Helper: Format Number without "Rp"
        function formatNumberOnly(num) {
            return Number(num).toLocaleString('id-ID');
        }

        // Helper: Get Formatted Date
        function getFormattedDate(d = new Date()) {
            const time = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const date = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            return `${date}, ${time} WIB`;
        }

        // Render Balance Display
        function renderBalance() {
            const balance = parseInt(localStorage.getItem(BALANCE_KEY) || '0', 10);
            document.getElementById('display-balance').textContent = formatNumberOnly(balance);
        }

        // Get Transactions array safely
        function getTransactions() {
            try { 
                return JSON.parse(localStorage.getItem(TRANSACTIONS_KEY) || '[]'); 
            } catch(e) { 
                return []; 
            }
        }

        // Save Transactions array
        function saveTransactions(txs) {
            localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(txs));
        }

        // Filter Transactions View
        function filterTransactions(filter) {
            activeFilter = filter;
            
            const filters = [
                { id: 'filter-all', key: 'all' },
                { id: 'filter-in', key: 'in' },
                { id: 'filter-out', key: 'out' }
            ];

            filters.forEach(item => {
                const btn = document.getElementById(item.id);
                if (btn) {
                    if (item.key === filter) {
                        btn.className = 'px-4 py-2 text-xs font-semibold rounded-xl bg-gray-900 text-white dark:bg-white dark:text-black shadow-sm transition-all shrink-0 whitespace-nowrap';
                    } else {
                        btn.className = 'px-4 py-2 text-xs font-semibold rounded-xl bg-gray-100 text-gray-600 hover:text-gray-900 dark:bg-gray-900 dark:text-gray-400 dark:hover:text-white transition-all shrink-0 whitespace-nowrap';
                    }
                }
            });

            renderTransactions();
        }

        function renderTransactions() {
            const container = document.getElementById('transaction-list');
            const emptyState = document.getElementById('empty-history');
            const allTxs = getTransactions();

            const filtered = allTxs.filter(tx => {
                if (activeFilter === 'in') return tx.type === 'in';
                if (activeFilter === 'out') return tx.type === 'out';
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            container.innerHTML = filtered.map(tx => {
                const isIn = tx.type === 'in';
                const sign = isIn ? '+' : '-';
                const amountClass = isIn ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-900 dark:text-white';

                return `
                    <div class="py-4 px-5 w-full flex items-center justify-between border-b border-gray-50 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors active:bg-gray-100 dark:active:bg-gray-800 cursor-pointer">
                        <div class="flex-1 min-w-0 pr-4">
                            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">${tx.title}</p>
                            <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1 truncate">${tx.date} • ${tx.method || 'Saldo Clincoo'}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-extrabold tracking-tight ${amountClass}">${sign} ${formatNumberOnly(tx.amount)}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Halaman TopUp & Navigation
        function openTopUpPage() {
            const pageDompet = document.getElementById('page-dompet');
            const pageTopup = document.getElementById('page-topup');
            
            pageDompet.classList.add('hidden');
            pageDompet.classList.remove('flex');
            
            pageTopup.classList.remove('hidden');
            pageTopup.classList.add('flex');
            
            // Scroll to top of topup page
            pageTopup.scrollTop = 0;
        }

        function closeTopUpPage() {
            const pageDompet = document.getElementById('page-dompet');
            const pageTopup = document.getElementById('page-topup');
            
            pageTopup.classList.add('hidden');
            pageTopup.classList.remove('flex');
            
            pageDompet.classList.remove('hidden');
            pageDompet.classList.add('flex');
        }

        function selectNominal(amt) {
            selectedNominalAmount = amt;
            document.getElementById('custom-nominal').value = '';
            
            document.querySelectorAll('.nominal-btn').forEach(btn => {
                const btnAmt = parseInt(btn.getAttribute('data-amount'), 10);
                if (btnAmt === amt) {
                    btn.className = 'nominal-btn border-2 border-gray-900 dark:border-white rounded-xl py-3 text-sm font-semibold transition-all text-center bg-gray-50 dark:bg-gray-800';
                } else {
                    btn.className = 'nominal-btn border border-gray-200 dark:border-gray-800 rounded-xl py-3 text-sm font-semibold hover:border-gray-900 transition-all text-center';
                }
            });
        }

        function onCustomNominalChange(input) {
            const val = parseInt(input.value, 10);
            if (!isNaN(val) && val > 0) {
                selectedNominalAmount = val;
                document.querySelectorAll('.nominal-btn').forEach(btn => {
                    btn.className = 'nominal-btn border border-gray-200 dark:border-gray-800 rounded-xl py-3 text-sm font-semibold hover:border-gray-900 transition-all text-center';
                });
            }
        }

        // Process Top Up — Real Payment via Midtrans Snap (verified server-side, real-time)
        let topupPollTimer = null;
        let snapScriptLoaded = false;

        function loadSnapScript(clientKey, isProduction, cb) {
            if (snapScriptLoaded && window.snap) { cb(); return; }
            const s = document.createElement('script');
            s.src = (isProduction ? 'https://app.midtrans.com/snap/snap.js' : 'https://app.sandbox.midtrans.com/snap/snap.js');
            s.setAttribute('data-client-key', clientKey);
            s.onload = () => { snapScriptLoaded = true; cb(); };
            s.onerror = () => showModal('Gagal Memuat Pembayaran', 'Tidak dapat memuat Midtrans Snap. Periksa koneksi internet Anda.');
            document.body.appendChild(s);
        }

        function processTopUp() {
            if (!selectedNominalAmount || selectedNominalAmount < 10000) {
                showModal('Nominal Tidak Valid', 'Minimal isi saldo adalah 10.000');
                return;
            }

            const methodEl = document.querySelector('input[name="payment-method"]:checked');
            const method = methodEl ? methodEl.value : 'QRIS Instant';

            // 1. Create real payment transaction on backend
            fetch('/api/topup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'create', amount: selectedNominalAmount, method: method })
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    const msg = (data.error === 'payment_not_configured')
                        ? 'Payment gateway belum dikonfigurasi. Silakan hubungi administrator Clincoo.'
                        : (data.message || data.error || 'Gagal membuat transaksi');
                    showModal('Top Up Gagal', msg);
                    return;
                }

                // 2. Open Midtrans Snap payment popup
                loadSnapScript(data.client_key, data.is_production, () => {
                    window.snap.pay(data.token, {
                        onSuccess: function() { pollTopUpStatus(data.order_id); },
                        onPending: function() { pollTopUpStatus(data.order_id); },
                        onError: function() { showModal('Pembayaran Gagal', 'Transaksi tidak dapat diproses. Silakan coba lagi.'); },
                        onClose: function() { stopTopUpPoll(); showModal('Pembayaran Dibatalkan', 'Anda menutup halaman pembayaran sebelum menyelesaikan transaksi.'); }
                    });
                });
            })
            .catch(() => showModal('Koneksi Gagal', 'Tidak dapat terhubung ke server pembayaran. Periksa koneksi internet Anda.'));
        }

        // Poll backend until payment verified by webhook (real-time)
        function pollTopUpStatus(orderId) {
            stopTopUpPoll();
            let attempts = 0;
            topupPollTimer = setInterval(async () => {
                attempts++;
                try {
                    const r = await fetch('/api/topup?action=status&order_id=' + encodeURIComponent(orderId));
                    const data = await r.json();
                    if (data.status === 'paid') {
                        stopTopUpPoll();
                        applyVerifiedTopUp(data.amount, data.method || 'QRIS');
                        return;
                    }
                    if (data.status === 'failed') {
                        stopTopUpPoll();
                        showModal('Pembayaran Gagal', 'Transaksi tidak selesai atau dibatalkan.');
                        return;
                    }
                } catch (e) { /* keep polling */ }
                if (attempts > 90) stopTopUpPoll(); // ~3 min max
            }, 2000);
        }

        function stopTopUpPoll() {
            if (topupPollTimer) { clearInterval(topupPollTimer); topupPollTimer = null; }
        }

        // Payment verified by server — apply to wallet UI
        function applyVerifiedTopUp(amount, method) {
            const currentBalance = parseInt(localStorage.getItem(BALANCE_KEY) || '0', 10);
            localStorage.setItem(BALANCE_KEY, (currentBalance + amount).toString());

            const txs = getTransactions();
            txs.unshift({
                id: 'TX-' + Math.floor(100000 + Math.random() * 900000),
                title: 'Isi Saldo via ' + method,
                amount: amount,
                type: 'in',
                date: getFormattedDate(),
                method: method
            });
            saveTransactions(txs);

            renderBalance();
            renderTransactions();
            closeTopUpPage();
            showModal('Pengisian Saldo Berhasil', 'Pembayaran terverifikasi. Saldo sebesar ' + formatNumberOnly(amount) + ' telah ditambahkan ke akun Clincoo Anda via ' + method + '.');
        }

        // Generic System Modal Functions
        function showModal(title, message) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            const modal = document.getElementById('system-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
