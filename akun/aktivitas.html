<body class="min-h-screen flex flex-col text-gray-900 pt-16">
    <script>(function(){var t=localStorage.getItem("clincoo_theme");var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>
    <header class="bg-white flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40 transition-colors">
        <button onclick="history.back()" class="top-2 left-5 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <h1 class="font-extrabold text-lg text-gray-900 tracking-tight">Aktivitas</h1>
        <div class="w-10"></div>
    </header>
    <main class="flex-1 w-full max-w-2xl mx-auto px-6 pt-2 flex flex-col">

        <div id="activity-list" class="flex flex-col divide-y divide-gray-100">
            <div id="empty-state" style="display:none" class="flex flex-col items-center justify-center py-16 text-center">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="history" class="w-10 h-10 text-gray-400"></i>
                </div>
                <h3 class="text-sm font-bold text-gray-900">Belum ada aktivitas</h3>
                <p class="text-xs text-gray-500 mt-1 max-w-[250px]">Aktivitas sistem dan log pengguna pada sesi ini akan muncul di sini.</p>
            </div>
        </div>
    </main>

    <div id="system-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm relative z-10 shadow-2xl border border-gray-100">
            <h3 id="modal-title" class="text-lg font-bold text-gray-900 mb-2"></h3>
            <p id="modal-message" class="text-sm text-gray-500 mb-6 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-black text-white rounded-xl font-medium text-sm hover:bg-gray-800 transition-colors">Tutup</button>
        </div>
    </div>

    <script src="../js/api.js"></script>
<script>
        lucide.createIcons();
        showActivitySkeleton();
        loadActivitiesFromD1();

        // Shared Notification System
        const NOTIF_KEY = 'clincoo_notifications';
        function getNotifications() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch(e) { return []; } }
        function saveNotifications(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }
        function addNotification(source, message) {
          const n = getNotifications();
          n.unshift({ id: Date.now(), source, message, timestamp: new Date().toISOString(), read: false });
          if (n.length > 50) n.length = 50;
          saveNotifications(n);
        }
        function markNotifRead(id) {
          const n = getNotifications();
          const item = n.find(x => x.id === id);
          if (item) item.read = true;
          saveNotifications(n);
        }

        // Skeleton shimmer saat data masih dimuat
        function showActivitySkeleton() {
          const list = document.getElementById('activity-list');
          const emptyState = document.getElementById('empty-state');
          if (emptyState) emptyState.style.display = 'none';
          list.innerHTML = '';
          const skel = document.createElement('div');
          skel.id = 'activity-skeleton';
          for (let i = 0; i < 6; i++) {
            skel.innerHTML += `
              <div class="py-4 flex items-start gap-4 px-2">
                <div class="skel-dot w-10 h-10 rounded-full bg-gray-50 border border-gray-100 shrink-0"></div>
                <div class="flex-1 space-y-2 pt-1">
                  <span class="shimmer-bar shimmer-bar-md"></span>
                  <span class="shimmer-bar shimmer-bar-sm" style="width:170px;"></span>
                </div>
                <span class="shimmer-bar shimmer-bar-sm shrink-0"></span>
              </div>`;
          }
          list.appendChild(skel);
        }
        function clearActivitySkeleton() {
          const skel = document.getElementById('activity-skeleton');
          if (skel) skel.remove();
        }

        // Load activities from D1 database (real backend)
        async function loadActivitiesFromD1() {
          try {
            const data = await ClincooAPI.getActivity(50);
            const activities = data.activities || [];
            clearActivitySkeleton();
            if (activities.length === 0) {
              document.getElementById('empty-state').style.display = 'flex';
              return;
            }
            const iconMap = {
              'login': 'log-in',
              'login_detected': 'log-in',
              'delete_project': 'folder-minus',
              'wallet_transaction': 'wallet',
              'topup': 'wallet',
              'topup_created': 'receipt',
              'topup_paid': 'badge-check',
              'subscription': 'crown',
              'subscribe': 'crown',
            };
            for (let a of activities) {
              const icon = iconMap[a.action] || 'activity';
              const time = a.created_at ? new Date(a.created_at.replace(' ', 'T') + 'Z').toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
              const date = a.created_at ? new Date(a.created_at.replace(' ', 'T') + 'Z').toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) : '';
              addActivity(a.action.replace(/_/g, ' '), (a.details || '') + ' \u00b7 ' + date + ', ' + time + ' WIB', icon, time);
            }
          } catch (e) {
            console.error('Failed to load activities:', e);
            clearActivitySkeleton();
            document.getElementById('empty-state').style.display = 'flex';
          }
        }


        function addActivity(title, desc, iconName, timeStr) {
            const list = document.getElementById('activity-list');
            const emptyState = document.getElementById('empty-state');
            
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            timeStr = timeStr || new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const item = document.createElement('div');
            
            item.className = 'py-4 flex items-start gap-4 transition-colors hover:bg-gray-50/50 px-2 rounded-xl opacity-0 translate-y-2 transition-all duration-300';
            item.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center shrink-0 text-gray-700">
                    <i data-lucide="${iconName}" class="w-5 h-5"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">${title}</p>
                        <span class="text-xs font-medium text-gray-400">${timeStr}</span>
                    </div>
                    <p class="text-xs text-gray-500 mt-0.5 leading-relaxed">${desc}</p>
                </div>
            `;
            
            list.insertBefore(item, list.firstChild);
            lucide.createIcons();
            
            setTimeout(() => {
                item.classList.remove('opacity-0', 'translate-y-2');
            }, 50);
        }

        function showModal(title, message) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            const modal = document.getElementById('system-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
<script>
(function(){
  var path=window.location.pathname.split('/').pop()||'aktivitas.html';
  var links=document.querySelectorAll('.sidebar-nav-link');
  links.forEach(function(link){
    var href=link.getAttribute('href');
    if(href===path){
      link.classList.add('bg-gray-50','text-gray-900');
      link.classList.remove('hover:bg-gray-50','text-gray-700');
      var icon=link.querySelector('i');
      if(icon){
        icon.className=icon.className.replace('ph ph-','ph-fill ph-');
        icon.classList.remove('text-gray-500');
        icon.classList.add('text-gray-900');
      }
      var svg=link.querySelector('svg');
      if(svg){
        svg.classList.remove('text-gray-500');
        svg.classList.add('text-gray-900');
      }
    }
  });
})();
</script>
