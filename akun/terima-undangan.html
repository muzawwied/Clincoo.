<!DOCTYPE html>
<html lang="id">
<head>
  <script src="../js/auth-client.js"></script>
    <script src="../js/accent-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clincoo - Undangan Kolaborasi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2216%22%20fill%3D%22%23ffffff%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23000000%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M12.6%2012C12.9%209.2%2012.2%207%2011.1%207C9.8%207%208.5%209.2%208.8%2012Z%22%2F%3E%3Cpath%20d%3D%22M11.9%209.1C11.2%2010.1%2011.4%2011.1%2011.9%2011.6C12.4%2011.1%2012.7%2010.1%2011.9%209.1Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M19.4%2012C19.1%209.2%2019.8%207%2020.9%207C22.2%207%2023.5%209.2%2023.2%2012Z%22%2F%3E%3Cpath%20d%3D%22M20.1%209.1C20.8%2010.1%2020.6%2011.1%2020.1%2011.6C19.6%2011.1%2019.3%2010.1%2020.1%209.1Z%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M16%2027C24%2027%2028%2022.5%2028%2017C28%2012.5%2021%2011.5%2016%2011.5C11%2011.5%204%2012.5%204%2017C4%2022.5%208%2027%2016%2027Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%2217%22%20r%3D%221.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.6%22%2F%3E%3Cpolygon%20points%3D%2216%2C20%2015%2C18.5%2017%2C18.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%0A%3C%2Fsvg%3E" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
    <script src="https://unpkg.com/lucide@1.41.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark-mode {
            background-color: #000000;
            color: #ffffff;
        }
        body.dark-mode .text-gray-900, body.dark-mode .text-gray-800 { color: #ffffff !important; }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600 { color: #888888 !important; }
        body.dark-mode .text-gray-500 { color: #666666 !important; }
        body.dark-mode .bg-gray-50, body.dark-mode .bg-gray-100 { background-color: #111111 !important; }
        body.dark-mode input { background-color: #000000; color: #ffffff; }
        body.dark-mode input:focus { border-color: #444444; outline: none; }
        .fade-in { animation: fadeIn 0.35s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-900 bg-white dark:bg-black transition-colors duration-300">
    <script>(function(){var t=localStorage.getItem("clincoo_theme");var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>

    <main id="page" class="flex-1 w-full max-w-md mx-auto px-6 flex flex-col items-center justify-center text-center py-12">
        <!-- Konten dirender oleh JS sesuai status undangan -->
    </main>

    <footer class="pb-8 text-center">
        <span class="text-[11px] text-gray-400 dark:text-gray-600">&copy; 2026 Clincoo</span>
    </footer>

    <script>
    var COLLAB_API = (location.hostname.indexOf('github.io') !== -1) ? 'https://clincoo-be2.pages.dev/api/collab' : '/api/collab';

    // Header auth wajib untuk semua aksi kolaborasi (Bearer token login)
    function authHeaders() {
        var t = '';
        try { t = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) {}
        return t ? { Authorization: 'Bearer ' + t } : {};
    }
    var activeInvite = null;

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    function render(html) {
        var page = document.getElementById('page');
        page.innerHTML = '<div class="w-full fade-in">' + html + '</div>';
        if (window.lucide) try { lucide.createIcons(); } catch (e) {}
    }

    function showLoading() {
        render(
            '<div class="flex flex-col items-center py-16">' +
                '<i data-lucide="loader-2" class="w-6 h-6 text-gray-400 animate-spin"></i>' +
                '<p class="text-sm text-gray-500 dark:text-gray-400 mt-4">Memuat undangan...</p>' +
            '</div>'
        );
    }

    function showPending(invite) {
        render(
            '<div class="flex justify-center mb-8">' +
                '<span class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Clincoo</span>' +
            '</div>' +
            '<div class="flex justify-center mb-6">' +
                '<div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-[#111] flex items-center justify-center">' +
                    '<i data-lucide="user-plus" class="w-7 h-7 text-gray-600 dark:text-gray-300"></i>' +
                '</div>' +
            '</div>' +
            '<h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">Anda diundang<br>berkolaborasi</h1>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-10">' +
                esc(invite.invited_by) + ' mengundang Anda ke proyek<br>' +
                '<span class="font-semibold text-gray-900 dark:text-white">' + esc(invite.project) + '</span> sebagai ' +
                '<span class="font-semibold text-gray-900 dark:text-white">' + esc(invite.role) + '</span>.' +
            '</p>' +
            '<div id="session-email" class="text-xs text-gray-400 dark:text-gray-500 mt-4"></div>' +
            '<div id="accept-error" class="hidden text-xs text-red-500 mt-2.5"></div>' +
            '<button onclick="acceptInvite()" class="w-full py-3.5 mt-8 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl text-sm font-semibold hover:bg-black dark:hover:bg-gray-100 transition-colors focus:outline-none">Terima Undangan</button>' +
            '<button onclick="declineInvite()" class="w-full py-3 mt-3 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors focus:outline-none">Tolak Undangan</button>'
        );
        var ses = document.getElementById('session-email');
        if (ses) {
            try {
                var u = JSON.parse(localStorage.getItem('clincoo_auth_user') || 'null');
                if (u && u.email) ses.innerText = 'Diterima sebagai ' + u.email;
            } catch (e) {}
        }
    }

    function showAccepted(invite) {
        render(
            '<div class="flex justify-center mb-8">' +
                '<span class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Clincoo</span>' +
            '</div>' +
            '<div class="flex justify-center mb-6">' +
                '<div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-[#111] flex items-center justify-center">' +
                    '<i data-lucide="check" class="w-7 h-7 text-emerald-500"></i>' +
                '</div>' +
            '</div>' +
            '<h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">Undangan diterima</h1>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-10">Selamat bergabung di proyek<br><span class="font-semibold text-gray-900 dark:text-white">' + esc(invite.project) + '</span>!</p>' +
            '<a href="kolaborasi.html" class="block w-full py-3.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl text-sm font-semibold hover:bg-black dark:hover:bg-gray-100 transition-colors">Buka Halaman Kolaborasi</a>'
        );
    }

    function showDeclined(invite) {
        render(
            '<div class="flex justify-center mb-8">' +
                '<span class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Clincoo</span>' +
            '</div>' +
            '<div class="flex justify-center mb-6">' +
                '<div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-[#111] flex items-center justify-center">' +
                    '<i data-lucide="clock" class="w-7 h-7 text-gray-400"></i>' +
                '</div>' +
            '</div>' +
            '<h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">Undangan ditolak</h1>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-10">Anda menolak undangan ke proyek<br><span class="font-semibold text-gray-900 dark:text-white">' + esc(invite.project) + '</span>. Bila berubah pikiran, minta ' + esc(invite.invited_by) + ' mengirim undangan baru.</p>'
        );
    }

    // Undangan kedaluwarsa setelah 1 hari (24 jam) sejak dibuat
    var INVITE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
    function isInviteExpired(inv) {
        var raw = inv && inv.created_date ? String(inv.created_date).replace(' ', 'T') : '';
        if (!raw) return false;
        if (raw.charAt(raw.length - 1) !== 'Z') raw += 'Z';
        var d = new Date(raw);
        if (isNaN(d.getTime())) return false;
        return (Date.now() - d.getTime()) > INVITE_MAX_AGE_MS;
    }

    function showExpired(invite) {
        render(
            '<div class="flex justify-center mb-8">' +
                '<span class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Clincoo</span>' +
            '</div>' +
            '<div class="flex justify-center mb-6">' +
                '<div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-[#111] flex items-center justify-center">' +
                    '<i data-lucide="clock" class="w-7 h-7 text-gray-400"></i>' +
                '</div>' +
            '</div>' +
            '<h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">Undangan kedaluwarsa</h1>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-10">Undangan ini sudah tidak berlaku karena melewati 1 hari. Minta ' + esc(invite.invited_by) + ' mengirim undangan baru.</p>' +
            '<a href="kolaborasi.html" class="block w-full py-3.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl text-sm font-semibold hover:bg-black dark:hover:bg-gray-100 transition-colors">Ke Halaman Kolaborasi</a>'
        );
    }

    function showInactive(invite, customMsg) {
        render(
            '<div class="flex justify-center mb-8">' +
                '<span class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Clincoo</span>' +
            '</div>' +
            '<div class="flex justify-center mb-6">' +
                '<div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-[#111] flex items-center justify-center">' +
                    '<i data-lucide="clock" class="w-7 h-7 text-gray-400"></i>' +
                '</div>' +
            '</div>' +
            '<h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">Undangan tidak aktif</h1>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-10">' + (customMsg ? esc(customMsg) : 'Undangan ini sudah ' + esc(invite.status) + '.<br>Minta ' + esc(invite.invited_by) + ' mengirim undangan baru.') + '</p>'
        );
    }

    function showNotFound() {
        render(
            '<div class="flex justify-center mb-8">' +
                '<span class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white">Clincoo</span>' +
            '</div>' +
            '<div class="flex justify-center mb-6">' +
                '<div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-[#111] flex items-center justify-center">' +
                    '<i data-lucide="alert-circle" class="w-7 h-7 text-gray-400"></i>' +
                '</div>' +
            '</div>' +
            '<h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight mb-3">Undangan tidak ditemukan</h1>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-10">Link undangan tidak valid atau sudah kedaluwarsa.</p>' +
            '<a href="kolaborasi.html" class="block w-full py-3.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl text-sm font-semibold hover:bg-black dark:hover:bg-gray-100 transition-colors">Ke Halaman Kolaborasi</a>'
        );
    }

    function acceptInvite() {
        showLoading();
        fetch(COLLAB_API, {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ action: 'accept', token: activeInvite.token })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.success) {
                activeInvite.status = 'accepted';
                showAccepted(activeInvite);
            } else if (res.error === 'email_mismatch') {
                activeInvite.status = 'mismatch';
                showInactive(activeInvite, res.message || 'Undangan ini ditujukan untuk alamat email lain.');
            } else {
                showInactive(activeInvite, res.error === 'Undangan sudah expired' ? null : 'Undangan sudah tidak dapat diterima.');
            }
        })
        .catch(function() {
            showPending(activeInvite);
            var errEl2 = document.getElementById('accept-error');
            if (errEl2) { errEl2.innerText = 'Tidak dapat terhubung ke server. Coba lagi.'; errEl2.classList.remove('hidden'); }
        });
    }

    function declineInvite() {
        showLoading();
        fetch(COLLAB_API, {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ action: 'decline', token: activeInvite.token })
        })
        .then(function() {
            activeInvite.status = 'declined';
            showDeclined(activeInvite);
        })
        .catch(function() { showPending(activeInvite); });
    }

    (function() {
        var params = new URLSearchParams(window.location.search);
        var inviteId = params.get('invite');
        showLoading();
        if (!inviteId) { showNotFound(); return; }
        fetch(COLLAB_API + '?token=' + encodeURIComponent(inviteId))
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.success && res.invite) {
                activeInvite = res.invite;
                activeInvite.token = inviteId;
                if (res.invite.status === 'pending') showPending(res.invite);
                else if (res.invite.status === 'accepted') showAccepted(res.invite);
                else if (res.invite.status === 'declined') showDeclined(res.invite);
                else if (res.invite.status === 'expired') showExpired(res.invite);
                else showInactive(res.invite);
            } else {
                showNotFound();
            }
        })
        .catch(function() { showNotFound(); });
    })();
    </script>
</body>
</html>
