    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark-mode {
            background-color: #000000;
            color: #ffffff;
        }
        /* Mode Gelap Kustom */
        body.dark-mode .bg-white { background-color: #0a0a0a !important; }
        body.dark-mode .text-gray-900, body.dark-mode .text-gray-800 { color: #ffffff !important; }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600 { color: #888888 !important; }
        body.dark-mode .text-gray-500 { color: #666666 !important; }
        body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
        body.dark-mode .border-gray-100 { border-color: #1a1a1a !important; }
        body.dark-mode .bg-gray-50, body.dark-mode .bg-gray-100 { background-color: #111111 !important; }
        body.dark-mode .hover\:bg-gray-50:hover { background-color: #1a1a1a !important; }
        body.dark-mode input, body.dark-mode select {
            background-color: #000000; color: #ffffff; border-color: #222222;
        }
        body.dark-mode input:focus, body.dark-mode select:focus { border-color: #444444; outline: none; }

        /* Tombol arrow-left header: perbaikan artefak putih di dark mode (pola aktivitas.html) */
        body.dark-mode header button[onclick="history.back()"] {
            background-color: #000000 !important;
            border: 1.5px solid rgba(255,255,255,0.4) !important;
            color: #ffffff !important;
        }
        body.dark-mode header button[onclick="history.back()"] svg { color: #ffffff !important; stroke: #ffffff !important; }
        body.dark-mode header button[onclick="history.back()"]:hover {
            background-color: #1a1a1a !important;
            border-color: rgba(255,255,255,0.7) !important;
        }
        body.dark-mode header { background-color: #000000 !important; border-color: #222222 !important; }

        /* Utility Scroll Samping Tanpa Scrollbar Visual */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .shimmer-bar {
        display: inline-block;
        height: 1em;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 6px;
        width: 60px;
        vertical-align: middle;
    }
    .shimmer-bar-sm { height: 0.75em; width: 40px; }
    .shimmer-bar-md { height: 0.875em; width: 120px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    body.dark-mode .shimmer-bar {
        background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
        background-size: 200% 100%;
    }
    body.dark-mode .skel-dot { background-color: #141414 !important; border-color: #222222 !important; }
    </style>

    <script>
    let activePopoverId = null;
    let activePopoverButton = null;
    let activeTextTarget = null;
    let memberToRemove = null;
    let activeShareMenu = null;

    try { lucide.createIcons(); } catch (e) {}

    /* ========================================================
       API & Data
       ======================================================== */
    var API_BASE = (location.hostname.indexOf('github.io') !== -1) ? 'https://clincoo-be2.pages.dev/api' : '/api';
    const COLLAB_API = API_BASE + '/collab';
    const PROJECTS_API = API_BASE + '/projects';

    var projects = [];          // daftar proyek real-time
    var collabCache = {};       // data anggota/undangan per project_id

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    function showToast(message) {
        let el = document.getElementById('collab-toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'collab-toast';
            el.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] px-5 py-2.5 bg-gray-900 dark:bg-white text-white dark:text-black text-sm font-semibold rounded-full shadow-lg transition-all duration-300 opacity-0 translate-y-3 pointer-events-none';
            document.body.appendChild(el);
        }
        el.innerText = message;
        el.classList.remove('opacity-0', 'translate-y-3');
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.add('opacity-0', 'translate-y-3'); }, 2200);
    }

    /* ========================================================
       Undangan instan per proyek
       ======================================================== */
    async function createInvite(channel, role, projectId) {
        if (!projectId) return null;
        try {
            const res = await fetch(COLLAB_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'invite', project_id: projectId, channel: channel, role: role || 'Viewer' })
            });
            const data = await res.json();
            if (data && data.success && data.invite_url) return data.invite_url;
        } catch (e) {}
        return null;
    }

    async function copyDirectLink(btn) {
        const projectId = btn.getAttribute('data-project-id');
        const link = await createInvite('link', 'Viewer', projectId);
        closeShareDropdown();
        if (!link) { alert('Gagal membuat tautan undangan. Periksa koneksi Anda dan coba lagi — bila masih gagal, server kolaborasi sedang tidak dapat dihubungi.'); return; }
        let copied = false;
        // 1) Clipboard API modern (HTTPS)
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(link);
                copied = true;
            }
        } catch (e) {}
        // 2) Fallback execCommand
        if (!copied) {
            try {
                const tempInput = document.createElement("input");
                tempInput.value = link;
                tempInput.style.position = 'fixed';
                tempInput.style.opacity = '0';
                document.body.appendChild(tempInput);
                tempInput.select();
                tempInput.setSelectionRange(0, link.length);
                copied = document.execCommand("copy");
                document.body.removeChild(tempInput);
            } catch (e) {}
        }
        if (copied) {
            showToast('Tautan undangan tersalin');
            loadCollabFor(projectId);
        } else {
            // 3) Upaya terakhir: tampilkan tautan agar bisa disalin manual
            window.prompt('Salin tautan undangan ini:', link);
        }
    }

    async function shareDirect(btn, platform) {
        closeShareDropdown();
        const projectId = btn.getAttribute('data-project-id');
        const link = await createInvite(platform, 'Viewer', projectId);
        if (!link) { alert('Gagal membuat undangan. Periksa koneksi Anda dan coba lagi.'); return; }
        let url = '';
        if (platform === 'whatsapp') {
            const text = encodeURIComponent(`Bergabung ke proyek Clincoo:\n${link}`);
            url = `https://api.whatsapp.com/send?text=${text}`;
        } else if (platform === 'telegram') {
            url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Bergabung ke proyek Clincoo.')}`;
        }
        if (url) window.open(url, '_blank');
        loadCollabFor(projectId);
    }

    function inviteViaEmail(btn) {
        const projectId = btn.getAttribute('data-project-id');
        const projectName = btn.getAttribute('data-project-name') || 'Proyek Clincoo';
        closeShareDropdown();
        window.location.href = 'undang-email.html?project=' + encodeURIComponent(projectId) + '&project_name=' + encodeURIComponent(projectName);
    }

    /* ========================================================
       Dropdown share per proyek
       ======================================================== */
    function toggleShareDropdown(btn) {
        const menu = btn.parentElement.querySelector('.share-menu');
        if (!menu) return;
        if (menu === activeShareMenu) { closeShareDropdown(); return; }
        closeShareDropdown();
        menu.classList.remove('hidden');
        activeShareMenu = menu;
    }

    function closeShareDropdown() {
        if (activeShareMenu) {
            activeShareMenu.classList.add('hidden');
            activeShareMenu = null;
        }
    }

    /* ========================================================
       Render daftar proyek + anggota (real-time)
       ======================================================== */
    function memberCard(m) {
        return '' +
        '<div class="member-item group flex items-center justify-between p-3.5 rounded-2xl bg-gray-50/80 dark:bg-[#111] border border-gray-100 dark:border-[#222] transition-all hover:border-gray-200 dark:hover:border-[#333]" data-member-id="' + esc(m.id) + '" data-role="' + esc(m.role) + '">' +
            '<div class="flex items-center gap-3 min-w-0">' +
                '<div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-[#222] flex items-center justify-center text-[13px] font-bold text-gray-600 dark:text-gray-300 shrink-0">' + esc(m.initials) + '</div>' +
                '<div class="min-w-0">' +
                    '<div class="text-sm font-semibold text-gray-900 dark:text-white truncate">' + esc(m.name) + '</div>' +
                    (m.email ? '<div class="text-xs text-gray-500 dark:text-gray-400 truncate">' + esc(m.email) + '</div>' : '') +
                '</div>' +
            '</div>' +
            (m.role === 'Owner'
                ? '<span class="text-xs font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#333] rounded-full px-3 py-1.5 shrink-0">' + esc(m.role) + '</span>'
                : '<button type="button" onclick="toggleRoleDropdown(\'' + esc(m.id) + '\', this)" class="flex items-center gap-1.5 pl-2.5 pr-3 py-1.5 text-xs font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#333] rounded-full hover:bg-gray-50 dark:hover:bg-[#222] transition-colors cursor-pointer focus:outline-none shrink-0">' +
                    '<i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-60"></i>' +
                    '<span class="role-text-label">' + esc(m.role) + '</span>' +
                '</button>') +
        '</div>';
    }

    function pendingCard(p) {
        var label = p.email ? esc(p.email) : 'Tautan Undangan';
        var icon = p.channel === 'email' ? 'mail' : 'link';
        return '' +
        '<div class="flex items-center justify-between p-3 rounded-xl bg-amber-50/70 dark:bg-amber-500/5 border border-amber-100 dark:border-amber-500/10">' +
            '<div class="flex items-center gap-2.5 min-w-0">' +
                '<i data-lucide="' + icon + '" class="w-4 h-4 text-amber-500 shrink-0"></i>' +
                '<div class="min-w-0">' +
                    '<div class="text-[13px] font-medium text-gray-900 dark:text-white truncate">' + label + '</div>' +
                    '<div class="text-[11px] text-gray-500 dark:text-gray-400 truncate">Diundang sebagai ' + esc(p.role) + '</div>' +
                '</div>' +
            '</div>' +
            '<span class="text-[11px] font-medium text-amber-600 dark:text-amber-400 shrink-0 pl-2">Menunggu</span>' +
        '</div>';
    }

    function projectSection(p) {

        var ptitle = esc(p.title || 'Proyek tanpa nama');
        return '' +
        '<section class="proj-section mb-8" data-project-id="' + pid + '" data-project-name="' + ptitle + '">' +

                    '<div class="min-w-0">' +

                        '<span class="text-[11px] text-gray-400 proj-count">memuat…</span>' +
                    '</div>' +
                '</div>' +
                '<div class="relative shrink-0">' +
                    '<button type="button" onclick="toggleShareDropdown(this)" class="px-4 py-1.5 text-sm font-medium text-gray-900 dark:text-white bg-transparent border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-[#111] rounded-full transition-all cursor-pointer flex items-center gap-1.5 focus:outline-none">' +
                        '<span>Tambah anggota</span>' +
                        '<i data-lucide="chevron-down" class="h-4 w-4 opacity-70"></i>' +
                    '</button>' +
                    '<div class="share-menu hidden absolute right-0 mt-2 w-56 bg-white dark:bg-[#1a1a1a] rounded-xl shadow-xl border border-gray-100 dark:border-[#222] py-1.5 z-50">' +
                        '<button type="button" data-project-id="' + pid + '" data-project-name="' + ptitle + '" onclick="inviteViaEmail(this)" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-[#222] flex items-center gap-3 transition-colors">' +
                            '<i data-lucide="mail" class="w-4 h-4 flex-shrink-0"></i>' +
                            '<span>Undang via Email</span>' +
                        '</button>' +
                        '<button type="button" data-project-id="' + pid + '" onclick="shareDirect(this, \'whatsapp\')" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-[#222] flex items-center gap-3 transition-colors">' +
                            '<svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12.011 0C5.384 0 0 5.383 0 12.011c0 2.116.551 4.177 1.598 5.986L.057 24l6.182-1.621a11.96 11.96 0 0 0 5.772 1.482h.005c6.625 0 12.01-5.384 12.01-12.012A11.942 11.942 0 0 0 20.5 3.513 11.94 11.94 0 0 0 12.011 0zm0 21.921h-.004a9.904 9.904 0 0 1-5.048-1.383l-.362-.215-3.754.985 1.002-3.661-.236-.375a9.897 9.897 0 0 1-1.515-5.281c0-5.47 4.452-9.92 9.921-9.92 2.65 0 5.14 1.033 7.012 2.906a9.862 9.862 0 0 1 2.903 7.018c0 5.471-4.451 9.923-9.92 9.923zm5.438-7.43c-.298-.149-1.764-.87-2.037-.97-.272-.099-.47-.148-.669.15-.198.297-.768.97-.942 1.163-.173.198-.347.223-.644.074-.297-.149-1.258-.464-2.397-1.48-.886-.79-1.484-1.767-1.658-2.064-.173-.298-.018-.46.13-.607.135-.133.298-.347.447-.521.148-.173.198-.297.297-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347z"/></svg>' +
                            '<span>Undang via WhatsApp</span>' +

                        '</button>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="proj-pending space-y-2.5 mb-3"></div>' +
            '<div class="proj-members space-y-2.5"></div>' +
        '</section>';
    }

    function renderProjects(list) {
        var root = document.getElementById('projects-root');
        if (!root) return;
        if (!list.length) {
            root.innerHTML =
                '<div class="flex flex-col items-center text-center py-16 px-4">' +
                    '<i data-lucide="folder-open" class="w-12 h-12 text-gray-300 dark:text-gray-600 mb-4"></i>' +
                    '<h3 class="text-[15px] font-medium text-gray-900 dark:text-white mb-1.5">Belum ada proyek</h3>' +
                    '<p class="text-sm text-gray-500 dark:text-gray-400 max-w-xs">Buat proyek terlebih dahulu di halaman Proyek, lalu kembali ke sini untuk mengundang rekan tim.</p>' +
                '</div>';
            if (window.lucide) try { lucide.createIcons(); } catch (e) {}
            return;
        }
        // ?project= di URL didahulukan
        var params = new URLSearchParams(window.location.search);
        var fromUrl = params.get('project');
        var ordered = list.slice();
        if (fromUrl) {
            var idx = ordered.findIndex(function(p) { return String(p.id) === String(fromUrl); });
            if (idx > 0) { var moved = ordered.splice(idx, 1)[0]; ordered.unshift(moved); }
        }
        root.innerHTML = ordered.map(projectSection).join('');
        if (window.lucide) try { lucide.createIcons(); } catch (e) {}
        if (fromUrl) {
            var sec = root.querySelector('.proj-section[data-project-id="' + fromUrl + '"]');
            if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    // Undangan kedaluwarsa setelah 1 hari (24 jam) sejak dibuat
    var INVITE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
    function isInviteExpired(inv) {
        var raw = inv && inv.created_date ? String(inv.created_date).replace(' ', 'T') : '';
        if (!raw) return false;
        if (raw.charAt(raw.length - 1) !== 'Z') raw += 'Z';
        var d = new Date(raw);
        if (isNaN(d.getTime())) return false;
        return (Date.now() - d.getTime()) > INVITE_MAX_AGE_MS;
    }

    function renderProjectCollab(p) {
        var sec = document.querySelector('.proj-section[data-project-id="' + p.id + '"]');
        if (!sec) return;
        var data = collabCache[p.id] || { members: [], pending: [] };
        var members = data.members || [];
        var pending = (data.pending || []).filter(function(inv) { return !isInviteExpired(inv); });
        var titleEl = sec.querySelector('.proj-title');
        if (titleEl && p.title) titleEl.innerText = p.title;
        var countEl = sec.querySelector('.proj-count');
        if (countEl) countEl.innerText = members.length + ' anggota' + (pending.length ? ' · ' + pending.length + ' undangan menunggu' : '');
        var pendEl = sec.querySelector('.proj-pending');
        if (pendEl) pendEl.innerHTML = pending.map(pendingCard).join('');
        var memEl = sec.querySelector('.proj-members');
        if (memEl) {
            memEl.innerHTML = members.length
                ? members.map(memberCard).join('')
                : '<div class="flex items-center gap-3 p-3.5 rounded-2xl border border-dashed border-gray-200 dark:border-[#333]">' +
                    '<i data-lucide="user-plus" class="w-4 h-4 text-gray-400 dark:text-gray-500 shrink-0"></i>' +
                    '<span class="text-sm text-gray-500 dark:text-gray-400">Belum ada anggota tim — undang rekan lewat "Tambah anggota".</span>' +
                  '</div>';
        }
        if (window.lucide) try { lucide.createIcons(); } catch (e) {}
    }

    function loadCollabFor(projectId) {
        return fetch(COLLAB_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'list', project_id: projectId })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res && res.success) {
                collabCache[projectId] = { members: res.members || [], pending: res.pending || [] };
                var p = projects.find(function(x) { return String(x.id) === String(projectId); });
                if (p && res.project && res.project.title) p.title = res.project.title;
                renderProjectCollab({ id: projectId, title: (p && p.title) || '' });
            } else {
                collabCache[projectId] = { members: [], pending: [], error: true };
                renderProjectCollab({ id: projectId, title: '' });
            }
        })
        .catch(function() {
            collabCache[projectId] = { members: [], pending: [], error: true };
            renderProjectCollab({ id: projectId, title: '' });
        });
    }

    function loadProjectsRealtime() {
        return fetch(PROJECTS_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'list' })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            var list = (res && res.projects) || [];
            var prevIds = projects.map(function(p) { return String(p.id); });
            projects = list;
            var newIds = list.map(function(p) { return String(p.id); });
            var changed = prevIds.length !== newIds.length || prevIds.some(function(id, i) { return id !== newIds[i]; });
            if (changed) renderProjects(list);
            list.forEach(function(p) { loadCollabFor(p.id); });
        })
        .catch(function() {
            var root = document.getElementById('projects-root');
            if (root && !root.querySelector('.proj-section')) {
                root.innerHTML =
                    '<div class="flex flex-col items-center text-center py-16 px-4">' +
                        '<i data-lucide="cloud-off" class="w-12 h-12 text-gray-300 dark:text-gray-600 mb-4"></i>' +
                        '<h3 class="text-[15px] font-medium text-gray-900 dark:text-white mb-1.5">Gagal memuat data</h3>' +
                        '<p class="text-sm text-gray-500 dark:text-gray-400 max-w-xs mb-5">Periksa koneksi Anda, lalu coba lagi.</p>' +
                        '<button type="button" onclick="retryLoad()" class="px-5 py-2.5 text-sm font-semibold text-white bg-gray-900 dark:bg-white dark:text-black rounded-full hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors">Coba lagi</button>' +
                    '</div>';
                if (window.lucide) try { lucide.createIcons(); } catch (e) {}
            }
        });
    }

    function retryLoad() {
        document.getElementById('projects-root').innerHTML = '<div class="flex flex-col gap-8"><div><div class="flex items-center gap-3 mb-3"><span class="shimmer-bar shimmer-bar-md"></span></div><div class="member-item flex items-center justify-between p-3.5 rounded-2xl bg-gray-50/80 dark:bg-[#111] border border-gray-100 dark:border-[#222]"><div class="flex items-center gap-3 min-w-0"><div class="skel-dot w-10 h-10 rounded-full bg-gray-200 dark:bg-[#222] shrink-0"></div><div class="space-y-2 min-w-0"><span class="shimmer-bar shimmer-bar-md"></span><span class="shimmer-bar shimmer-bar-sm" style="width:140px;"></span></div></div></div></div></div>';
        loadProjectsRealtime();
    }

    /* ========================================================
       Popover Peran Anggota
       ======================================================== */
    function toggleRoleDropdown(id, buttonEl) {
        const popover = document.getElementById('role-popover');
        
        if (activePopoverButton === buttonEl && !popover.classList.contains('hidden')) {
            closePopover();
            return;
        }

        activePopoverId = id;
        activePopoverButton = buttonEl;
        activeTextTarget = buttonEl.querySelector('.role-text-label');

        const rect = buttonEl.getBoundingClientRect();
        popover.classList.remove('hidden');
        
        let topPos = rect.bottom + window.scrollY + 5;
        let leftPos = rect.right + window.scrollX - popover.offsetWidth;
        
        if (topPos + popover.offsetHeight > window.innerHeight + window.scrollY) {
            topPos = rect.top + window.scrollY - popover.offsetHeight - 5;
            popover.style.transformOrigin = 'bottom right';
        } else {
            popover.style.transformOrigin = 'top right';
        }

        if (leftPos < 10) leftPos = 10; 
        
        popover.style.top = `${topPos}px`;
        popover.style.left = `${leftPos}px`;

        const currentRole = activeTextTarget ? activeTextTarget.innerText : '';
        document.querySelectorAll('#role-popover .check-icon').forEach(icon => {
            if (icon.dataset.role === currentRole) {
                icon.classList.remove('hidden');
            } else {
                icon.classList.add('hidden');
            }
        });

        setTimeout(() => {
            popover.classList.remove('opacity-0', 'scale-95');
            popover.classList.add('opacity-100', 'scale-100');
        }, 10);
    }

    function selectRole(role) {
        if (activeTextTarget && activeTextTarget.innerText !== role) {
            activeTextTarget.innerText = role;
            const parentMember = activePopoverButton.closest('.member-item');
            if (parentMember) {
                parentMember.setAttribute('data-role', role);
            }
            if (activePopoverId) {
                const sec = activePopoverButton.closest('.proj-section');
                const pid = sec ? sec.getAttribute('data-project-id') : null;
                fetch(COLLAB_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'setRole', member_id: activePopoverId, role: role })
                }).then(function() { if (pid) loadCollabFor(pid); }).catch(function() {});
            }
        }
        closePopover();
    }

    function closePopover() {
        const popover = document.getElementById('role-popover');
        if(!popover) return;
        popover.classList.remove('opacity-100', 'scale-100');
        popover.classList.add('opacity-0', 'scale-95');
        setTimeout(() => {
            popover.classList.add('hidden');
        }, 200);
        activePopoverButton = null;
    }

    function confirmRemoveMember() {
        if (activePopoverButton) {
            memberToRemove = activePopoverButton.closest('.group');
            closePopover();
            
            const modal = document.getElementById('confirm-modal');
            const backdrop = document.getElementById('confirm-backdrop');
            const dialog = document.getElementById('confirm-dialog');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                dialog.classList.remove('opacity-0', 'scale-95');
                dialog.classList.add('opacity-100', 'scale-100');
            }, 10);
        }
    }

    function closeConfirmModal() {
        const modal = document.getElementById('confirm-modal');
        const backdrop = document.getElementById('confirm-backdrop');
        const dialog = document.getElementById('confirm-dialog');
        
        backdrop.classList.remove('opacity-100');
        backdrop.classList.add('opacity-0');
        dialog.classList.remove('opacity-100', 'scale-100');
        dialog.classList.add('opacity-0', 'scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            memberToRemove = null;
        }, 300);
    }

    function executeRemoveMember() {
        if (memberToRemove) {
            const removedId = memberToRemove.getAttribute('data-member-id');
            const sec = memberToRemove.closest('.proj-section');
            const pid = sec ? sec.getAttribute('data-project-id') : null;
            memberToRemove.style.transition = 'all 0.3s ease';
            memberToRemove.style.opacity = '0';
            memberToRemove.style.transform = 'translateX(-10px)';
            
            setTimeout(() => {
                memberToRemove.style.display = 'none';
            }, 300);
            if (removedId) {
                fetch(COLLAB_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'remove', member_id: removedId })
                }).then(function() { if (pid) loadCollabFor(pid); }).catch(function() {});
            }
        }
        closeConfirmModal();
    }

    /* ==========================================================
       Global Event Listener (Tutup dropdown & popover di luar)
       ========================================================== */
    document.addEventListener('click', (e) => {
        // Dropdown share: tutup bila klik di luar tombol/menu aktif
        if (activeShareMenu) {
            const container = activeShareMenu.parentElement;
            if (container && !container.contains(e.target)) closeShareDropdown();
        }

        // Popover Role Utama
        const popover = document.getElementById('role-popover');
        if (popover && !popover.classList.contains('hidden') && 
            activePopoverButton && 
            !activePopoverButton.contains(e.target) && 
            !popover.contains(e.target)) {
            closePopover();
        }
    });

    /* ==========================================================
       Init
       ========================================================== */
    (function() {
        loadProjectsRealtime();
        // Real-time: muat ulang data diam-diam tiap 30 detik (saat tab aktif)
        setInterval(function() {
            if (document.visibilityState === 'visible') loadProjectsRealtime();
        }, 30000);
        // Link lama ?invite= diredirect ke halaman undangan terpisah
        var params = new URLSearchParams(window.location.search);
        var inviteId = params.get('invite');
        if (inviteId) {
            var dir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            window.location.replace(window.location.origin + dir + 'terima-undangan.html' + window.location.search);
        }
    })();
    </script>
