<!DOCTYPE html>
<html lang="id">
<head>
  <script src="../js/auth-client.js"></script>
    <script src="../js/accent-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Tambah Tugas Terjadwal</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
    <script src="https://unpkg.com/lucide@1.41.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        :root {
            --accent-color: #000000;
            --accent-hover: #1f2937;
            --accent-text: #ffffff;
        }

        .bg-accent { background-color: var(--accent-color) !important; }
        .text-accent { color: var(--accent-color) !important; }
        .border-accent { border-color: var(--accent-color) !important; }

        body.dark-mode {
            background-color: #000000;
            color: #ffffff;
        }
        body.dark-mode .bg-white {
            background-color: #0a0a0a !important;
        }
        body.dark-mode .text-\[\#222222\] { color: #ffffff !important; }
        body.dark-mode button[onclick="history.back()"],
        body.dark-mode header button[onclick] {
            background-color: #000000 !important;
            border: 1.5px solid rgba(255,255,255,0.4) !important;
            color: #ffffff !important;
        }
        body.dark-mode button[onclick="history.back()"] svg,
        body.dark-mode header button[onclick] svg {
            color: #ffffff !important;
            stroke: #ffffff !important;
        }
        body.dark-mode button[onclick="history.back()"]:hover,
        body.dark-mode header button[onclick]:hover {
            background-color: #1a1a1a !important;
            border-color: rgba(255,255,255,0.7) !important;
        }
        body.dark-mode .text-gray-900, body.dark-mode .text-gray-800, body.dark-mode .text-black {
            color: #ffffff !important;
        }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600, body.dark-mode .text-gray-500 {
            color: #888888 !important;
        }
        body.dark-mode .border-gray-100, body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 {
            border-color: #222222 !important;
        }
        body.dark-mode .hover\:bg-gray-50:hover, body.dark-mode .hover\:bg-gray-100:hover {
            background-color: #0a0a0a !important;
        }
        body.dark-mode .bg-gray-50, body.dark-mode .bg-gray-100 {
            background-color: #0a0a0a !important;
        }
        body.dark-mode select, body.dark-mode textarea, body.dark-mode input[type="text"], body.dark-mode input[type="time"], body.dark-mode input[type="number"] {
            background-color: #0a0a0a;
            color: #ffffff;
            border-color: #222222;
        }
        body.dark-mode select:focus, body.dark-mode textarea:focus, body.dark-mode input:focus {
            border-color: #444444;
            outline: none;
        }
        body.dark-mode header { background-color: #000000 !important; border-color: #222222 !important; }
        body.dark-mode .divide-gray-100 > *, body.dark-mode .divide-gray-200 > * { border-color: #222222 !important; }
        body.dark-mode .text-gray-400 { color: #666666 !important; }
        body.dark-mode .bg-black { background-color: #ffffff !important; color: #000000 !important; }
        body.dark-mode .bg-black.text-white { color: #000000 !important; }
        body.dark-mode .hover\:bg-gray-800:hover { background-color: #e5e5e5 !important; }
        body.dark-mode .bg-accent { background-color: #ffffff !important; color: #000000 !important; }
        body.dark-mode .bg-accent.text-white { color: #000000 !important; }
        body.dark-mode .text-accent { color: #ffffff !important; }
        body.dark-mode .border-accent { border-color: #ffffff !important; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-900 pt-16 bg-[#ffffff]">
    <script>(function(){var t=localStorage.getItem("clincoo_theme");var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>

    <header id="main-header" class="bg-white flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40 transition-colors">
        <button onclick="history.back()" class="top-2 left-5 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <h1 class="font-extrabold text-lg text-gray-900 tracking-tight">Tugas Baru</h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-4 flex flex-col relative min-h-[80vh]">
        <div class="w-full flex flex-col divide-y divide-gray-100">
            <div class="py-5">
                <h4 class="text-base font-semibold text-gray-900 mb-2">Nama Tugas</h4>
                <input type="text" id="task-name" placeholder="Contoh: Rangkuman berita teknologi pagi" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-gray-200 focus:border-gray-400 focus:outline-none transition-colors bg-white">
            </div>

            <div class="py-5">
                <h4 class="text-base font-semibold text-gray-900 mb-2">Jadwal</h4>
                <div class="flex gap-2 mb-3">
                    <button type="button" id="type-daily" onclick="selectType('daily')" class="flex-1 px-3 py-2.5 text-sm font-medium rounded-xl border-2 border-black text-black bg-gray-50 transition-colors cursor-pointer">Harian</button>
                    <button type="button" id="type-interval" onclick="selectType('interval_minutes')" class="flex-1 px-3 py-2.5 text-sm font-medium rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors cursor-pointer">Interval</button>
                </div>
                <div id="daily-input" class="flex items-center gap-3">
                    <span class="text-sm text-gray-600">Setiap hari pukul</span>
                    <input type="time" id="task-time" value="09:00" class="px-3 py-2 text-sm rounded-xl border border-gray-200 focus:border-gray-400 focus:outline-none bg-white">
                    <span class="text-sm text-gray-600">WIB</span>
                </div>
                <div id="interval-input" class="hidden items-center gap-3">
                    <span class="text-sm text-gray-600">Setiap</span>
                    <input type="number" id="task-interval" value="30" min="5" max="1440" class="w-24 px-3 py-2 text-sm rounded-xl border border-gray-200 focus:border-gray-400 focus:outline-none bg-white">
                    <span class="text-sm text-gray-600">menit</span>
                </div>
            </div>

            <div class="py-5">
                <h4 class="text-base font-semibold text-gray-900 mb-2">Instruksi untuk AI <span class="text-red-500">*</span></h4>
                <p class="text-xs sm:text-sm text-gray-500 mb-3">Apa yang harus AI kerjakan setiap kali tugas berjalan?</p>
                <textarea id="task-prompt" rows="4" class="w-full px-3.5 py-3 text-sm rounded-xl border border-gray-200 focus:border-gray-400 focus:outline-none resize-none transition-colors bg-white" placeholder="Contoh: Rangkum 3 berita teknologi terpenting hari ini dalam poin singkat."></textarea>
            </div>

            <div class="py-5 flex items-center justify-between gap-3">
                <div>
                    <h4 class="text-base font-semibold text-gray-900">Kirim hasil ke email</h4>
                    <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Selain notifikasi dalam aplikasi</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer shrink-0">
                    <input type="checkbox" id="task-notify-email" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer transition-colors peer-checked:bg-black"></div>
                    <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
                </label>
            </div>
        </div>

        <div class="mt-6 flex justify-end gap-3">
            <button type="button" onclick="history.back()" class="px-5 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-200 hover:bg-gray-50 rounded-xl transition-all cursor-pointer shadow-sm">Batal</button>
            <button type="button" onclick="createTask()" id="create-btn" class="px-5 py-2.5 text-sm font-semibold text-white bg-black hover:bg-gray-800 rounded-xl transition-all cursor-pointer shadow-sm flex items-center justify-center min-w-[140px]">Simpan Tugas</button>
        </div>
    </main>

    <script>
        const API_BASE = location.hostname.indexOf('github.io') !== -1 ? 'https://clincoo-be2.pages.dev' : '';

        let scheduleType = 'daily';

        function selectType(t) {
            scheduleType = t;
            const daily = document.getElementById('daily-input'), interval = document.getElementById('interval-input');
            const bd = document.getElementById('type-daily'), bi = document.getElementById('type-interval');
            if (t === 'daily') {
                daily.classList.remove('hidden'); interval.classList.add('hidden');
                bd.className = 'flex-1 px-3 py-2.5 text-sm font-medium rounded-xl border-2 border-black text-black bg-gray-50 transition-colors cursor-pointer';
                bi.className = 'flex-1 px-3 py-2.5 text-sm font-medium rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors cursor-pointer';
            } else {
                daily.classList.add('hidden'); interval.classList.remove('hidden');
                bi.className = 'flex-1 px-3 py-2.5 text-sm font-medium rounded-xl border-2 border-black text-black bg-gray-50 transition-colors cursor-pointer';
                bd.className = 'flex-1 px-3 py-2.5 text-sm font-medium rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors cursor-pointer';
            }
        }

        async function createTask() {
            const btn = document.getElementById('create-btn');
            const prompt = document.getElementById('task-prompt').value.trim();
            if (!prompt) { alert('Instruksi untuk AI wajib diisi.'); return; }
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i> Menyimpan...';
            try { lucide.createIcons(); } catch (e) {}
            btn.disabled = true; btn.classList.add('opacity-80', 'cursor-not-allowed');
            try {
                const res = await fetch(API_BASE + '/api/scheduled-tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'create',
                        name: document.getElementById('task-name').value.trim(),
                        schedule_type: scheduleType,
                        time_wib: document.getElementById('task-time').value,
                        interval_minutes: parseInt(document.getElementById('task-interval').value) || 30,
                        prompt: prompt,
                        notify_email: document.getElementById('task-notify-email').checked
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                location.href = 'tugas-terjadwal.html';
            } catch (err) {
                btn.innerHTML = 'Simpan Tugas'; btn.disabled = false; btn.classList.remove('opacity-80', 'cursor-not-allowed');
                alert('Gagal menyimpan tugas: ' + (err && err.message ? err.message : 'kesalahan jaringan'));
            }
        }

        try { lucide.createIcons(); } catch (e) {}
    </script>
</body>
</html>
