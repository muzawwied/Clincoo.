        <button type="button" onclick="saveChanges()" class="px-5 py-2 text-sm font-medium text-white bg-black hover:bg-gray-800 rounded-lg shadow-sm transition-colors focus:outline-none cursor-pointer">Simpan Perubahan</button>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        let isEdited = false;
        let activePopover = null;

        function showActionButtons() {
            if (!isEdited) {
                isEdited = true;
                const c = document.getElementById('action-buttons');
                if (c) {
                    c.classList.remove('hidden');
                    c.classList.add('flex');
                    void c.offsetWidth;
                    c.classList.remove('opacity-0');
                    c.classList.add('opacity-100');
                }
            }
        }

        function cancelChanges() {
            window.location.reload();
        }


        // ===== SINKRONISASI D1: data profile & personal terhubung ke backend =====
        const PROFILE_API = 'https://clincoo.pages.dev/api/account-profile';
        function syncProfileToD1() {
            try {
                const payload = {};
                const name = localStorage.getItem('clincoo_fullname');
                const email = localStorage.getItem('clincoo_email');
                const pic = localStorage.getItem('clincoo_profile_pic');
                if (name) payload.name = name;
                if (email) payload.email = email;
                if (pic && pic.length < 700000) payload.avatar = pic;
                const lang = document.getElementById('lang-text');
                const tz = document.getElementById('tz-text');
                if (lang && lang.textContent) payload.language = lang.textContent.trim();
                if (tz && tz.textContent) payload.timezone = tz.textContent.trim();
                if (Object.keys(payload).length > 0) {
                    fetch(PROFILE_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(function(){});
                }
            } catch(e) {}
        }
        function syncProfileFromD1() {
            try {
                fetch(PROFILE_API).then(function(r){ return r.json(); }).then(function(d) {
                    if (!d || d.error) return;
                    let changed = false;
                    if (d.name && !localStorage.getItem('clincoo_fullname')) { localStorage.setItem('clincoo_fullname', d.name); changed = true; }
                    if (d.email && !localStorage.getItem('clincoo_email')) { localStorage.setItem('clincoo_email', d.email); changed = true; }
                    if (d.avatar && !localStorage.getItem('clincoo_profile_pic')) {
                        try { localStorage.setItem('clincoo_profile_pic', d.avatar); changed = true; } catch(e) {}
                    }
                    if (!changed) return;
                    const nameInput = document.getElementById('input-fullname');
                    const emailInput = document.getElementById('input-email');
                    const displayName = document.getElementById('user-display-name');
                    const displayEmail = document.getElementById('user-display-email');
                    const avatarContainer = document.getElementById('avatar-container');
                    const avatarInitial = document.getElementById('avatar-initial');
                    const nm = localStorage.getItem('clincoo_fullname');
                    const em = localStorage.getItem('clincoo_email');
                    const pc = localStorage.getItem('clincoo_profile_pic');
                    if (nm && nameInput) nameInput.value = nm;
                    if (nm && displayName) displayName.innerText = nm;
                    if (nm && avatarInitial && !pc) avatarInitial.innerText = nm.charAt(0).toUpperCase();
                    if (em && emailInput) emailInput.value = em;
                    if (em && displayEmail) displayEmail.innerText = em;
                    if (pc && avatarContainer) {
                        avatarContainer.style.backgroundImage = 'url(' + pc + ')';
                        avatarContainer.classList.remove('bg-gradient-to-br', 'from-blue-500', 'to-purple-600');
                        if (avatarInitial) avatarInitial.style.display = 'none';
                    }
                }).catch(function(){});
            } catch(e) {}
        }

        function saveChanges() {
            const btn = document.querySelector('#action-buttons button.bg-black');
            if (!btn) return;
            
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Update display name if input changed
            const nameInput = document.getElementById('input-fullname');
            const displayName = document.getElementById('user-display-name');
            if (nameInput && displayName) {
                displayName.innerText = nameInput.value;
                try { localStorage.setItem('clincoo_fullname', nameInput.value); } catch(e) {}
            }
            syncProfileToD1(); // sinkron ke D1

            setTimeout(() => {
                btn.innerText = 'Tersimpan!';
                btn.classList.replace('bg-black', 'bg-emerald-500');
                btn.classList.replace('hover:bg-gray-800', 'hover:bg-emerald-600');
                setTimeout(() => window.location.reload(), 800);
            }, 800);
        }

        // Photo Upload Handling
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    const avatarContainer = document.getElementById('avatar-container');
                    const avatarInitial = document.getElementById('avatar-initial');
                    
                    if (avatarContainer) {
                        avatarContainer.style.backgroundImage = `url(${base64})`;
                        avatarContainer.classList.remove('bg-gradient-to-br', 'from-blue-500', 'to-purple-600');
                    }
                    if (avatarInitial) {
                        avatarInitial.style.display = 'none';
                    }
                    
                    try { localStorage.setItem('clincoo_profile_pic', base64); } catch(err) {}
                    
                    syncProfileToD1(); // sinkron avatar ke D1
                    showActionButtons();
                };
                reader.readAsDataURL(file);
            }
        }

        // Popover Logic
        function togglePopover(id) {
            const popover = document.getElementById(id);
            if (!popover) return;
            
            // Close other active popover
            if (activePopover && activePopover !== id) {
                const otherPopover = document.getElementById(activePopover);
                if (otherPopover) otherPopover.classList.add('hidden');
            }

            if (popover.classList.contains('hidden')) {
                popover.classList.remove('hidden');
                activePopover = id;
            } else {
                popover.classList.add('hidden');
                activePopover = null;
            }
        }

        function selectOption(type, text, value, event) {
            const textElem = document.getElementById(`${type}-text`);
            if (textElem) textElem.innerText = text;
            
            // Reset checkmarks for this group
            const checkmarks = document.querySelectorAll(`.${type}-check`);
            checkmarks.forEach(icon => {
                icon.classList.remove('opacity-100');
                icon.classList.add('opacity-0');
            });
            
            // Highlight checkmark on selected option
            if (event && event.currentTarget) {
                const checkmark = event.currentTarget.querySelector(`.${type}-check`);
                if (checkmark) {
                    checkmark.classList.remove('opacity-0');
                    checkmark.classList.add('opacity-100');
                }
            }

            // Close popover
            const popover = document.getElementById(`${type}-popover`);
            if (popover) popover.classList.add('hidden');
            activePopover = null;

            showActionButtons();
        }

        // Toggle switch handler
        function toggleSwitch(idPrefix) {
            showActionButtons();
            const bg = document.getElementById(idPrefix + '-bg');
            const knob = document.getElementById(idPrefix + '-knob');
            if (!bg || !knob) return;

            if (bg.classList.contains('bg-blue-500')) {
                bg.classList.replace('bg-blue-500', 'bg-gray-200');
                knob.classList.remove('translate-x-5');
            } else {
                bg.classList.add('bg-blue-500');
                bg.classList.remove('bg-gray-200');
                knob.classList.add('translate-x-5');
            }
        }

        // Close popovers on click outside
        document.addEventListener('click', function(event) {
            if (activePopover) {
                const btnId = activePopover.replace('popover', 'btn');
                const popover = document.getElementById(activePopover);
                const btn = document.getElementById(btnId);
                
                if (popover && btn && !popover.contains(event.target) && !btn.contains(event.target)) {
                    popover.classList.add('hidden');
                    activePopover = null;
                }
            }
        });

        // Event listener for inputs to show action buttons
        document.addEventListener('DOMContentLoaded', () => {
            syncProfileFromD1();
            // Load Data from LocalStorage
            try {
                const savedName = localStorage.getItem('clincoo_fullname');
                const savedEmail = localStorage.getItem('clincoo_email');
                const savedPic = localStorage.getItem('clincoo_profile_pic');

                const nameInput = document.getElementById('input-fullname');
                const emailInput = document.getElementById('input-email');
                const displayName = document.getElementById('user-display-name');
                const displayEmail = document.getElementById('user-display-email');
                const avatarContainer = document.getElementById('avatar-container');
                const avatarInitial = document.getElementById('avatar-initial');

                if (savedName) {
                    if (nameInput) nameInput.value = savedName;
                    if (displayName) displayName.innerText = savedName;
                    if (avatarInitial) avatarInitial.innerText = savedName.charAt(0).toUpperCase();
                }
                
                if (savedEmail) {
                    if (emailInput) emailInput.value = savedEmail;
                    if (displayEmail) displayEmail.innerText = savedEmail;
                }

                if (savedPic && avatarContainer) {
                    avatarContainer.style.backgroundImage = `url(${savedPic})`;
                    avatarContainer.classList.remove('bg-gradient-to-br', 'from-blue-500', 'to-purple-600');
                    if (avatarInitial) avatarInitial.style.display = 'none';
                }
            } catch(e) {}

            document.querySelectorAll('input').forEach(input => {
                if (input.type !== 'file' && !input.readOnly && !input.disabled) {
                    input.addEventListener('input', showActionButtons);
                }
            });
        });
    </script>
</body>
</html>
