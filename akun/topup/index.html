                                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5 truncate">Virtual Account</p>
                                    </div>
                                </div>
                                <div class="radio-indicator shrink-0"></div>
                                <input type="radio" name="payment-method" value="BCA Virtual Account">
                            </label>
                            
                            <label class="pay-method-card flex items-center justify-between p-3.5 border border-gray-200 dark:border-gray-800 rounded-2xl w-full bg-white dark:bg-[#0a0a0a]" data-method="Mandiri Virtual Account" onclick="selectPaymentMethod(this)">
                                <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2">
                                    <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 overflow-hidden payment-logo-badge bg-white shadow-sm border border-gray-200 dark:border-gray-700">
                                        <img src="../assets/bank-logos/mandiri-wikimedia.svg" alt="Mandiri" class="w-full h-full object-contain">
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-gray-900 dark:text-white truncate">Mandiri</p>
                                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5 truncate">Virtual Account</p>
                                    </div>
                                </div>
                                <div class="radio-indicator shrink-0"></div>
                                <input type="radio" name="payment-method" value="Mandiri Virtual Account">
                            </label>
                            
                            <label class="pay-method-card flex items-center justify-between p-3.5 border border-gray-200 dark:border-gray-800 rounded-2xl w-full bg-white dark:bg-[#0a0a0a]" data-method="BRI Virtual Account" onclick="selectPaymentMethod(this)">
                                <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2">
                                    <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 overflow-hidden payment-logo-badge bg-white shadow-sm border border-gray-200 dark:border-gray-700">
                                        <img src="../assets/bank-logos/bri-logo.png" alt="BRI" class="w-full h-full object-contain">
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-gray-900 dark:text-white truncate">BRI</p>
                                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5 truncate">Virtual Account</p>
                                    </div>
                                </div>
                                <div class="radio-indicator shrink-0"></div>
                                <input type="radio" name="payment-method" value="BRI Virtual Account">
                            </label>
                            
                            <label class="pay-method-card flex items-center justify-between p-3.5 border border-gray-200 dark:border-gray-800 rounded-2xl w-full bg-white dark:bg-[#0a0a0a]" data-method="BNI Virtual Account" onclick="selectPaymentMethod(this)">
                                <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2">
                                    <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 overflow-hidden payment-logo-badge bg-white shadow-sm border border-gray-200 dark:border-gray-700">
                                        <img src="../assets/bank-logos/bni-wikimedia.svg" alt="BNI" class="w-full h-full object-contain">
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-gray-900 dark:text-white truncate">BNI</p>
                                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5 truncate">Virtual Account</p>
                                    </div>
                                </div>
                                <div class="radio-indicator shrink-0"></div>
                                <input type="radio" name="payment-method" value="BNI Virtual Account">
                            </label>
                        </div>

                                        </div>
                </div>
                <div class="pt-4 pb-8 w-full mt-auto">
                    <button onclick="goToStep2()" class="w-full py-4 bg-gray-900 dark:bg-white text-white dark:text-black rounded-xl font-bold text-sm hover:bg-gray-800 dark:hover:bg-gray-100 transition-all shadow-lg active:scale-[0.98]">Lanjut ke Nominal</button>
                </div>
            </main>
        </div>

        <!-- STEP 2: AMOUNT KEYPAD -->
        <div id="step-amount" class="hidden flex-col w-full min-h-screen overflow-y-auto">
            <header class="flex justify-start px-4 py-3 sticky top-0 w-full z-40 bg-white dark:bg-[#0a0a0a]">
                <button onclick="goToStep1()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-[#0a0a0a] border border-gray-100 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900 transition-all cursor-pointer text-gray-700 dark:text-gray-300 hover:text-black dark:hover:text-white shadow-sm">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
            </header>

            <main class="flex-1 w-full flex flex-col px-5 py-6">
                <div class="flex flex-col items-center mb-4 w-full mt-2">
                    <h2 class="text-xl font-extrabold text-gray-900 dark:text-white tracking-tight text-center">Nominal Top Up</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1.5 text-center">Tentukan jumlah saldo yang ingin diisi</p>
                </div>

                <!-- PIN Keypad Display -->
                <div class="flex flex-col items-center justify-center py-6 mb-4 w-full">
                    <p id="keypad-display" class="text-5xl font-extrabold text-gray-900 dark:text-white tracking-tighter">Rp 0</p>
                    <div class="mt-4 bg-gray-100 dark:bg-gray-800/80 px-4 py-1.5 rounded-full border border-gray-200 dark:border-gray-700">
                        <p class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Minimal pengisian Rp 10.000</p>
                    </div>
                </div>

                <!-- Custom Web Keypad -->
                <div class="grid grid-cols-3 gap-3 w-full max-w-md mx-auto select-none">
                    <button onclick="pressKey('1')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">1</button>
                    <button onclick="pressKey('2')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">2</button>
                    <button onclick="pressKey('3')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">3</button>
                    <button onclick="pressKey('4')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">4</button>
                    <button onclick="pressKey('5')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">5</button>
                    <button onclick="pressKey('6')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">6</button>
                    <button onclick="pressKey('7')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">7</button>
                    <button onclick="pressKey('8')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">8</button>
                    <button onclick="pressKey('9')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">9</button>
                    <button onclick="pressKey('000')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">000</button>
                    <button onclick="pressKey('0')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all active:scale-95">0</button>
                    <button onclick="pressKey('back')" class="w-full py-4 rounded-xl text-lg font-bold bg-white dark:bg-[#0a0a0a] border border-gray-200 dark:border-gray-800 hover:border-gray-900 dark:hover:border-white text-gray-900 dark:text-white transition-all flex items-center justify-center active:scale-95"><i data-lucide="delete" class="w-5 h-5 mx-auto"></i></button>
                </div>

                <div id="confirm-action-container" class="pt-4 pb-8 w-full mt-auto hidden animate-fade-in">
                    <button onclick="processTopUp()" class="w-full py-4 bg-gray-900 text-white rounded-xl font-bold text-sm hover:bg-gray-800 transition-all shadow-lg active:scale-[0.98]">Konfirmasi</button>
                </div>
            </main>
        </div>
    </div>

    <div id="system-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white dark:bg-[#121212] rounded-xl p-5 md:p-6 w-full max-w-sm relative z-10 shadow-xl border border-gray-100 dark:border-gray-800 animate-fade-in text-center">
            <div id="modal-icon-wrap" class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4 mx-auto">
                <i data-lucide="check-circle" class="w-6 h-6"></i>
            </div>
            <h3 id="modal-title" class="text-base md:text-lg font-bold text-gray-900 dark:text-white mb-2"></h3>
            <p id="modal-message" class="text-sm text-gray-500 dark:text-gray-400 mb-6 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-gray-900 dark:bg-white text-white dark:text-black rounded-lg font-semibold text-sm hover:bg-gray-800 dark:hover:bg-gray-100 transition-colors shadow-sm active:scale-95">Tutup</button>
        </div>

    <script>
        const API_BASE = location.hostname.indexOf('github.io') !== -1 ? 'https://clincoo-be2.pages.dev' : '';
        var TOPUP_API = API_BASE + '/api/topup';
        let selectedNominalAmount = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            try { lucide.createIcons(); } catch (e) {}
            resetKeypad();
            goToStep1();
        });

        
        
        function closeTopUpPage() { window.location.href = '../dompet/'; }

        
        function goToStep1() {
            var stepMethod = document.getElementById('step-method');
            var stepAmount = document.getElementById('step-amount');
            if (stepMethod) { stepMethod.classList.remove('hidden'); stepMethod.classList.add('flex'); }
            if (stepAmount) { stepAmount.classList.add('hidden'); stepAmount.classList.remove('flex'); }
        }

        function goToStep2() {
            var stepMethod = document.getElementById('step-method');
            var stepAmount = document.getElementById('step-amount');
            if (stepMethod) { stepMethod.classList.add('hidden'); stepMethod.classList.remove('flex'); }
            if (stepAmount) { stepAmount.classList.remove('hidden'); stepAmount.classList.add('flex'); }
            try { lucide.createIcons(); } catch (e) {}
        }

        var keypadAmount = '';

        function pressKey(k) {
            if (k === 'back') {
                keypadAmount = keypadAmount.slice(0, -1);
            } else {
                if (keypadAmount === '0') keypadAmount = '';
                if ((keypadAmount + k).replace(/^0+/, '').length <= 9) {
                    keypadAmount = (keypadAmount + k).replace(/^0+/, '');
                }
            }
            selectedNominalAmount = parseInt(keypadAmount || '0', 10);
            renderKeypadDisplay();
            toggleConfirmButton();
        }

        function renderKeypadDisplay() {
            var display = document.getElementById('keypad-display');
            if (display) display.textContent = 'Rp ' + formatNumberOnly(parseInt(keypadAmount || '0', 10));
        }

        function resetKeypad() {
            keypadAmount = '';
            selectedNominalAmount = 0;
            renderKeypadDisplay();
            toggleConfirmButton();
        }

        function toggleConfirmButton() {
            var btnContainer = document.getElementById('confirm-action-container');
            if (btnContainer) {
                if (selectedNominalAmount > 0) {
                    btnContainer.classList.remove('hidden');
                } else {
                    btnContainer.classList.add('hidden');
                }
            }
        }

        function selectPaymentMethod(labelEl) {
            document.querySelectorAll('.pay-method-card').forEach(function(card) {
                card.classList.remove('selected', 'border-2', 'border-gray-900', 'dark:border-white', 'bg-gray-50', 'dark:bg-[#1a1a1a]');
                card.classList.add('border', 'border-gray-200', 'dark:border-gray-800', 'bg-white', 'dark:bg-[#0a0a0a]');
            });
            labelEl.classList.add('selected', 'border-2', 'border-gray-900', 'dark:border-white', 'bg-gray-50', 'dark:bg-[#1a1a1a]');
            labelEl.classList.remove('border', 'border-gray-200', 'dark:border-gray-800', 'bg-white', 'dark:bg-[#0a0a0a]');
            var radio = labelEl.querySelector('input[type="radio"]');
            if (radio) radio.checked = true;
        }

        var XENDIT_METHOD_MAP = { 'QRIS Instant': 'qris', 'LinkAja': 'linkaja', 'GoPay': 'gopay', 'OVO': 'ovo', 'DANA': 'dana', 'ShopeePay': 'shopeepay', 'BCA Virtual Account': 'bca', 'Mandiri Virtual Account': 'mandiri', 'BRI Virtual Account': 'bri', 'BNI Virtual Account': 'bni' };
        var topupPollTimer = null;

        async function processTopUp() {
            if (!selectedNominalAmount || selectedNominalAmount < 10000) {
                showModal('Nominal Tidak Valid', 'Minimal isi saldo adalah Rp 10.000. Ketik jumlahnya di keyboard di atas.');
                return;
            }
            var methodEl = document.querySelector('input[name="payment-method"]:checked');
            var method = methodEl ? methodEl.value : 'QRIS Instant';
            var channel = XENDIT_METHOD_MAP[method] || 'qris';
            try {
                var payerEmail = ''; try { payerEmail = localStorage.getItem('clincoo_email') || ''; } catch(e) {}
                var payerToken = ''; try { payerToken = localStorage.getItem('clincoo_auth_token') || ''; } catch(e) {}
                var res = await fetch(TOPUP_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + payerToken },
                    body: JSON.stringify({ action: 'create', amount: selectedNominalAmount, method: channel })
                }).then(function(r) { return r.json(); });
                if (!res.success) {
                    var msg = (res.error === 'payment_not_configured')
                        ? 'Payment gateway belum dikonfigurasi. Setel XENDIT_SECRET_KEY di Cloudflare Pages > Settings > Environment variables.'
                        : (res.message || res.error || 'Gagal membuat transaksi.');
                    showModal('Top Up Gagal', msg);
                    return;
                }
                window.open(res.invoice_url, '_blank');
                pollTopUpStatus(res.order_id, channel);
            } catch(e) {
                showModal('Gagal', 'Tidak dapat terhubung ke server pembayaran.');
            }
        }

        function pollTopUpStatus(orderId, channel) {
            stopTopUpPoll();
            var attempts = 0;
            var checking = false; // cegah tick tumpang tindih (race condition) jika request sebelumnya belum selesai
            topupPollTimer = setInterval(async function() {
                if (checking) return;
                checking = true;
                attempts++;
                try {
                    var data = await fetch(TOPUP_API + '?action=status&order_id=' + encodeURIComponent(orderId), {
                        method: 'GET',
                        headers: { 'Authorization': 'Bearer ' + (function(){ try { return localStorage.getItem('clincoo_auth_token') || ''; } catch(e) { return ''; } })() }
                    }).then(function(r) { return r.json(); });
                    if (data.status === 'paid') {
                        stopTopUpPoll();
                        closeTopUpPage();
                        // Notifikasi top up sudah dikirim server (wallet.js add_transaction) saat saldo dikreditkan —
                        // jangan kirim lagi dari sini (dulu bikin notif dobel & saldo "NaN" karena field respons tidak lengkap).
                        return;
                    }
                    if (data.status === 'failed') {
                        stopTopUpPoll();
                        showModal('Pembayaran Tidak Selesai', 'Transaksi kedaluwarsa atau dibatalkan.');
                        return;
                    }
                } catch(err) {
                } finally {
                    checking = false;
                }
                if (attempts > 300) stopTopUpPoll();
            }, 3000);
        }

        function stopTopUpPoll() {
            if (topupPollTimer) { clearInterval(topupPollTimer); topupPollTimer = null; }
        }

        document.addEventListener('change', function(e) {
            if (e.target && e.target.name === 'payment-method') {
                var card = e.target.closest('.pay-method-card');
                if (card) selectPaymentMethod(card);
            }
        });

        function formatNumberOnly(num) { return Number(num).toLocaleString('id-ID'); }

        function showModal(title, message) {
            var iconWrap = document.getElementById('modal-icon-wrap');
            var iconName = 'check-circle';
            var bgClass = 'bg-emerald-50 text-emerald-600';
            
            var tLower = (title || '').toLowerCase();
            if (tLower.includes('gagal') || tLower.includes('tidak valid')) {
                iconName = 'alert-circle';
                bgClass = 'bg-red-50 text-red-600';
            } else if (tLower.includes('sandbox')) {
                iconName = 'info';
                bgClass = 'bg-amber-50 text-amber-600';
            }
            
            if (iconWrap) {
                iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto ' + bgClass;
                iconWrap.innerHTML = '<i data-lucide="' + iconName + '" class="w-6 h-6"></i>';
            }

            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            var modal = document.getElementById('system-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            try { lucide.createIcons(); } catch (e) {}
        }

        function closeModal() {
            var modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
