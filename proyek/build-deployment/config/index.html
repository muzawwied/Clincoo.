    <script>
        // Render Icons Awal
        lucide.createIcons();

        // ===================== DEPLOY ASLI (Cloudflare Pages) =====================
        const API = 'https://clincoo-be2.pages.dev/api'; // deploy engine (satu backend & satu D1 dgn auth/files)
        const pid = () => localStorage.getItem('clincoo_current_project_id') || '';
        let deployState = { pages_url: '', pollTimer: null, domainTimer: null, deploying: false };

        // ===================== SESI DEPLOY (klik deploy cukup sekali) =====================
        // Sesi per proyek tersimpan di localStorage: halaman langsung membuka dashboard
        // situs yang sudah dideploy tanpa harus menekan tombol Deploy lagi.
        const DEPLOY_SESSION_KEY = 'clincoo_deploy_session';
        function readDeploySession() {
            try {
                const ses = JSON.parse(localStorage.getItem(DEPLOY_SESSION_KEY) || 'null');
                return (ses && ses.project_id && ses.project_id === pid()) ? ses : null;
            } catch (e) { return null; }
        }
        function writeDeploySession(patch) {
            try {
                const cur = readDeploySession() || { project_id: pid() };
                localStorage.setItem(DEPLOY_SESSION_KEY, JSON.stringify(Object.assign(cur, patch)));
            } catch (e) {}
        }
        function clearDeploySession() {
            try { localStorage.removeItem(DEPLOY_SESSION_KEY); } catch (e) {}
        }

        // ===== Dropdown popover (Pilih Branch & Lingkungan) — dulu trigger memanggil
        // toggleDropdown tanpa definisi di halaman ini sehingga popover tidak pernah muncul. =====
        function toggleDropdown(element, targetId, optionsArray) {
            const wrapper = element.parentElement;
            const existingDropdown = wrapper.querySelector('.custom-dropdown-menu');
            closeAllDropdowns();
            if (existingDropdown) return;
            const labelEl = document.getElementById('label-' + targetId);
            const currentValue = labelEl ? labelEl.textContent.trim() : '';
            const dropdown = document.createElement('div');
            dropdown.className = 'custom-dropdown-menu absolute top-full left-0 w-full mt-1 z-50 bg-white dark:bg-[#111] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl overflow-hidden flex flex-col fade-in';
            let optionsHtml = '';
            optionsArray.forEach(option => {
                const isActive = option === currentValue;
                optionsHtml += `
                    <div class="w-full px-4 py-3 text-left text-sm font-medium transition-colors cursor-pointer flex items-center justify-between ${isActive ? 'bg-gray-50 text-black dark:bg-gray-800 dark:text-white' : 'text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800'}" onclick="selectOption(event, '${targetId}', '${option}')">
                        <span>${option}</span>
                        ${isActive ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                    </div>
                `;
            });
            dropdown.innerHTML = optionsHtml;
            wrapper.appendChild(dropdown);
            const chevron = element.querySelector('[data-lucide="chevron-down"]');
            if (chevron) chevron.classList.add('rotate-180');
            lucide.createIcons();
            setTimeout(() => { document.addEventListener('click', outsideClickListener); }, 10);
        }
        function closeAllDropdowns() {
            const openDropdowns = document.querySelectorAll('.custom-dropdown-menu');
            openDropdowns.forEach(dropdown => {
                const chevron = dropdown.parentElement.querySelector('.rotate-180');
                if (chevron) chevron.classList.remove('rotate-180');
                dropdown.remove();
            });
            document.removeEventListener('click', outsideClickListener);
        }
        function outsideClickListener(e) {
            if (!e.target.closest('.custom-select-trigger') && !e.target.closest('.custom-dropdown-menu')) {
                closeAllDropdowns();
            }
        }
        function selectOption(event, targetId, value) {
            event.stopPropagation();
            const label = document.getElementById('label-' + targetId);
            if (label) label.textContent = value;
            closeAllDropdowns();
        }

        async function apiFetch(path, opts = {}) {
            const token = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || '';
            const res = await fetch(API + path, {
                ...opts,
                headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        function timeAgoIso(iso) {
            if (!iso) return 'baru saja';
            const t = new Date(iso + (iso.endsWith('Z') ? '' : 'Z')).getTime();
            return timeAgo(t);
        }

        async function fetchStatus() {
            return apiFetch('/deploy?project_id=' + encodeURIComponent(pid()));
        }

        // Deploy ASLI: file workspace proyek -> Cloudflare Pages
        async function processDeploy() {
            const btn = document.getElementById('btn-process-deploy');
            if (!pid()) { console.warn('Proyek belum dipilih.'); return; }
            if (deployState.deploying) return; // klik hanya sekali per sesi
            // Feedback INSTAN begitu diklik — dulu tombol terasa mati selama pengecekan
            // nama aplikasi (round-trip jaringan) sebelum "Menyiapkan deploy..." muncul.
            const DEPLOY_BTN_IDLE = "flex-[2] py-4 bg-transparent border border-gray-300 text-gray-900 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2";
            const DEPLOY_BTN_BUSY = "flex-[2] py-4 bg-transparent border border-transparent text-gray-500 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2 cursor-not-allowed";
            const resetDeployBtn = () => {
                btn.innerHTML = `Jalankan Deploy`;
                btn.className = DEPLOY_BTN_IDLE;
                btn.disabled = false;
                lucide.createIcons();
            };
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span class="inline-block">Menyiapkan deploy...</span>`;
            btn.className = DEPLOY_BTN_BUSY;
            lucide.createIcons();
            // Subdomain: kosong -> backend buat otomatis dari nama proyek (AI);
            // diisi -> rename subdomain situs yang dipublikasikan.
            const subInput = document.getElementById('input-subdomain');
            const subdomain = subInput ? subInput.value.trim().toLowerCase() : '';
            deployState.deploying = true;
            writeDeploySession({ status: 'deploying', started_at: Date.now() });
            const phaseTimer = setInterval(async () => {
                try {
                    const st = await apiFetch('/deploy?project_id=' + encodeURIComponent(pid()));
                    const ph = st && st.deploy_phase;
                    if (ph) {
                        btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span class="inline-block">${ph}</span>`;
                        lucide.createIcons();
                    }
                } catch (e) {}
            }, 2000);
            try {
                const res = await apiFetch('/deploy', { method: 'POST', body: JSON.stringify({ project_id: pid(), ...(subdomain ? { subdomain } : {}) }) });
                clearInterval(phaseTimer);
                deployState.deploying = false;
                writeDeploySession({ status: 'done', pages_url: (res && res.pages_url) || deployState.pages_url || '', done_at: Date.now() });
                btn.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5"></i> <span class="inline-block">Berhasil Deploy!</span>`;
                lucide.createIcons();
                window.ClincooBack('../dashboard/?id=' + encodeURIComponent(pid()));
                setTimeout(() => {
                    btn.innerHTML = `Jalankan Deploy`;
                    btn.className = "flex-[2] py-4 bg-transparent border border-gray-300 text-gray-900 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2";
                    btn.disabled = false;
                }, 1000);
            } catch (err) {
                clearInterval(phaseTimer);
                deployState.deploying = false;
                writeDeploySession({ status: 'failed' });
                console.warn('Deploy gagal: ' + err.message);
                showDeployErrorModal(err);
                btn.innerHTML = `Jalankan Deploy`;
                btn.className = "flex-[2] py-4 bg-transparent border border-gray-300 text-gray-900 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2";
            }
        }

    </script>
<script>
    // Modal error deploy (termasuk kuota habis) — senada dgn halaman dashboard deployment
    function showDeployErrorModal(err) {
        var msg = (err && err.message) ? String(err.message) : '';
        if (document.getElementById('deploy-error-modal')) return;
        var m = document.createElement('div');
        m.id = 'deploy-error-modal';
        var isQuota = msg.indexOf('Kuota deploy') !== -1;
        var base = (location.pathname.indexOf('/Clincoo') !== -1) ? '/Clincoo.' : '';
        m.innerHTML =
            '<div class="fixed inset-0 z-[90] flex items-center justify-center p-4" style="background:rgba(0,0,0,0.45)">' +
            '<div class="bg-white rounded-2xl w-full max-w-xs px-5 pt-5 pb-4 text-center">' +
            '<h3 class="text-base font-semibold text-gray-900">' + (isQuota ? 'Kuota deploy habis' : 'Deploy gagal') + '</h3>' +
            '<p class="text-sm text-gray-500 mt-1.5 leading-snug px-1">' + (isQuota ? msg.replace('Upgrade paket di halaman Langganan untuk deploy lagi.', '').trim() : (msg || 'Terjadi kesalahan tak terduga. Coba lagi.')) + '</p>' +
            (isQuota ? '<a href="' + base + '/akun/langganan/upgrade/" class="mt-4 block w-full py-2.5 text-sm font-semibold text-white bg-gray-900 rounded-lg hover:bg-gray-800 transition-colors">Upgrade Paket</a>' : '') +
            '<button id="deploy-error-close" class="mt-2 w-full py-2 text-sm font-medium text-gray-500 hover:text-black transition-colors">' + (isQuota ? 'Nanti saja' : 'Tutup') + '</button>' +
            '</div></div>';
        document.body.appendChild(m);
        var btn = m.querySelector('#deploy-error-close');
        if (btn) btn.addEventListener('click', function () { m.remove(); });
    }

    // Subdomain saat ini (jika sudah ada) langsung terisi dari mode cepat backend —
    // tanpa popup/modal, nempel di halaman, style selaras dengan input lain.
    (async function () {
        try {
            const st = await apiFetch('/deploy?project_id=' + encodeURIComponent(pid()) + '&fast=1');
            const inp = document.getElementById('input-subdomain');
            if (st && st.pages_project && inp) inp.value = st.pages_project;
        } catch (e) {} // belum pernah deploy -> biarkan kosong (otomatis dari nama proyek)
    })();
</script>

    <script>/* clincoo-sw-register */
    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('../../../sw.js').catch(function () {}); }); }
    </script>
