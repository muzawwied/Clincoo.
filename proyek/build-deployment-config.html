    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f9;
            transition: background-color 0.3s ease, color 0.3s ease;

        /* Dark Mode Configuration */
        body.dark-mode { background-color: #000000; color: #ffffff; }
        body.dark-mode .bg-white { background-color: #0a0a0a !important; }
        
        /* Header Buttons Dark Mode */
        body.dark-mode button[onclick="history.back()"],

        body.dark-mode button[onclick="history.back()"] svg,
        body.dark-mode header button[onclick] svg { stroke: #ffffff !important; }
        body.dark-mode button[onclick="history.back()"]:hover,
        body.dark-mode header button[onclick]:hover { background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important; }
        
        /* Typography & Borders Dark Mode */

        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600, body.dark-mode .text-gray-500 { color: #888888 !important; }
        body.dark-mode .border-gray-100, body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
        body.dark-mode header { background-color: #000000 !important; border-color: #222222 !important; }

        body.dark-mode .bg-gray-100 { background-color: #111111 !important; }
        body.dark-mode .hover\:bg-gray-50:hover, body.dark-mode .hover\:bg-gray-100:hover { background-color: #1a1a1a !important; }
        
        /* Inputs & Buttons Custom Dark Mode */
        body.dark-mode input[type="text"], body.dark-mode .custom-select-trigger, body.dark-mode .dropdown-menu { background-color: #0a0a0a; color: #ffffff; border-color: #222222; }
        body.dark-mode input[type="text"]:focus { border-color: #222222; }
        body.dark-mode .bg-black.text-white { background-color: #ffffff !important; color: #000000 !important; }
        body.dark-mode .hover\:bg-gray-800:hover { background-color: #dddddd !important; }

        body.dark-mode .shimmer {

<body class="min-h-screen flex flex-col text-gray-900 pt-16 relative">
    <script>
        (function(){
            var t=localStorage.getItem("clincoo_theme");
            var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
            if(isDark){document.body.classList.add("dark-mode");}
        })();
    </script>
    
    <header class="bg-[#f7f7f9] flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40 transition-colors">
        <button onclick="history.back()" class="top-2 left-5 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <h1 class="font-extrabold text-lg text-gray-900 tracking-tight">Deployment</h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-8 pb-24 relative overflow-x-hidden">
                <!-- VIEW 2: Halaman Konfigurasi (Flat) -->
        <div id="view-config" class="flex flex-col gap-8 fade-in max-w-xl mx-auto w-full pt-4">
            <div class="mb-2">
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Pengaturan Deploy</h2>
                <p class="text-sm text-gray-500 mt-2">Tentukan sumber dan lingkungan tujuan untuk rilis ini.</p>
            </div>

            <div class="space-y-6">
                <!-- Dropdown: Branch -->
                <div class="relative w-full">
                    <label class="block text-sm font-semibold text-gray-900 mb-2">Pilih Branch</label>
                    <div class="custom-select-trigger flex items-center justify-between w-full px-4 py-3 text-sm rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition-colors cursor-pointer" onclick="toggleDropdown(this, 'branch', ['main', 'staging', 'development'])">
                        <div class="flex items-center gap-2">
                            <i data-lucide="git-branch" class="w-4 h-4 text-gray-500"></i>
                            <span id="label-branch" class="font-medium">main</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 transition-transform duration-200 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Dropdown: Environment -->
                <div class="relative w-full">
                    <label class="block text-sm font-semibold text-gray-900 mb-2">Lingkungan Tujuan</label>
                    <div class="custom-select-trigger flex items-center justify-between w-full px-4 py-3 text-sm rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition-colors cursor-pointer" onclick="toggleDropdown(this, 'env', ['Production Server', 'Preview / Staging'])">
                        <div class="flex items-center gap-2">
                            <i data-lucide="server" class="w-4 h-4 text-gray-500"></i>
                            <span id="label-env" class="font-medium">Production Server</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 transition-transform duration-200 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-4 pt-6 border-t border-gray-200">
                <button id="btn-process-deploy" onclick="processDeploy()" class="flex-[2] py-4 bg-transparent border border-gray-300 text-gray-900 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2">
                    Jalankan Deploy
                </button>
            </div>
        </div>
    </main>

    <script>
        // Render Icons Awal
        lucide.createIcons();

        // ===================== DEPLOY ASLI (Cloudflare Pages) =====================
        const API = 'https://clincoo-be2.pages.dev/api'; // deploy engine (satu backend & satu D1 dgn auth/files)
        const pid = () => localStorage.getItem('clincoo_current_project_id') || '';
        let deployState = { pages_url: '', pollTimer: null, domainTimer: null, deploying: false };

        // ===================== SESI DEPLOY (klik deploy cukup sekali) =====================
        // Sesi per proyek tersimpan di localStorage: halaman langsung membuka dashboard
        // situs yang sudah dideploy tanpa harus menekan tombol Deploy lagi.
        const DEPLOY_SESSION_KEY = 'clincoo_deploy_session';
        function readDeploySession() {
            try {
                const ses = JSON.parse(localStorage.getItem(DEPLOY_SESSION_KEY) || 'null');
                return (ses && ses.project_id && ses.project_id === pid()) ? ses : null;
            } catch (e) { return null; }
        }
        function writeDeploySession(patch) {
            try {
                const cur = readDeploySession() || { project_id: pid() };
                localStorage.setItem(DEPLOY_SESSION_KEY, JSON.stringify(Object.assign(cur, patch)));
            } catch (e) {}
        }
        function clearDeploySession() {
            try { localStorage.removeItem(DEPLOY_SESSION_KEY); } catch (e) {}
        }

        async function apiFetch(path, opts = {}) {
            const token = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || '';
            const res = await fetch(API + path, {
                ...opts,
                headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        function timeAgoIso(iso) {
            if (!iso) return 'baru saja';
            const t = new Date(iso + (iso.endsWith('Z') ? '' : 'Z')).getTime();
            return timeAgo(t);
        }

        async function fetchStatus() {
            return apiFetch('/deploy?project_id=' + encodeURIComponent(pid()));
        }

        // Deploy ASLI: file workspace proyek -> Cloudflare Pages
        async function processDeploy() {
            const btn = document.getElementById('btn-process-deploy');
            if (!pid()) { alert('Proyek belum dipilih.'); return; }
            if (deployState.deploying) return; // klik hanya sekali per sesi
            deployState.deploying = true;
            writeDeploySession({ status: 'deploying', started_at: Date.now() });
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span class="inline-block">Mengunggah file workspace...</span>`;
            btn.className = "flex-[2] py-4 bg-transparent border border-transparent text-gray-500 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2 cursor-not-allowed";
            lucide.createIcons();
            try {
                const res = await apiFetch('/deploy', { method: 'POST', body: JSON.stringify({ project_id: pid() }) });
                deployState.deploying = false;
                writeDeploySession({ status: 'done', pages_url: (res && res.pages_url) || deployState.pages_url || '', done_at: Date.now() });
                btn.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5"></i> <span class="inline-block">Berhasil Deploy!</span>`;
                lucide.createIcons();
                window.location.href = 'build-deployment-dashboard.html';
                setTimeout(() => {
                    btn.innerHTML = `Jalankan Deploy`;
                    btn.className = "flex-[2] py-4 bg-transparent border border-gray-300 text-gray-900 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2";
                    btn.disabled = false;
                }, 1000);
            } catch (err) {
                deployState.deploying = false;
                writeDeploySession({ status: 'failed' });
                alert('Deploy gagal: ' + err.message);
                btn.innerHTML = `Jalankan Deploy`;
                btn.className = "flex-[2] py-4 bg-transparent border border-gray-300 text-gray-900 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-all shadow-lg flex items-center justify-center gap-2";
            }
        }

    </script>
</body>
