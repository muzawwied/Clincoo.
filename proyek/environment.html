      <div class="px-3 py-4 flex flex-col gap-1" id="sidebar-nav">
          <a href="../index.html" data-page="app" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 text-gray-700 transition-colors">
              <svg class="w-5 h-5 text-gray-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
              <span class="font-medium text-[14px]">Beranda</span>
          </a>
          <a href="chat.html" data-page="chat" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 text-gray-700 transition-colors">
              <svg class="w-5 h-5 text-gray-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="8" rx="2"/><path d="M12 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 5v3"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M10 18h4"/></svg>
              <span class="font-medium text-[14px]">Agent</span>
          </a>
          <a href="workspace.html" data-page="workspace" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl bg-gray-50 text-gray-800 transition-colors">
              <svg class="w-5 h-5 text-gray-700 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>
              <span class="font-medium text-[14px]">Workspace</span>
          </a>
      </div>
  </aside>

  <script src="../js/api.js"></script>
<script>
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const sidebarPopup = document.getElementById('sidebar-popup');
    let isSidebarOpen = false;

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      if (isSidebarOpen) {
        sidebarOverlay.classList.remove('hidden');
        setTimeout(() => {
          sidebarOverlay.classList.remove('opacity-0');
          sidebarPopup.classList.remove('-translate-x-full');
        }, 10);
      } else {
        sidebarOverlay.classList.add('opacity-0');
        sidebarPopup.classList.add('-translate-x-full');
        setTimeout(() => {
          sidebarOverlay.classList.add('hidden');
        }, 300);
      }
    }

        function toggleNotifications(e) {
      e.stopPropagation();
      const notifDropdown = document.getElementById('notif-dropdown');
      const isHidden = notifDropdown.classList.contains('invisible');
      if (isHidden) {
        notifDropdown.classList.remove('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
        notifDropdown.classList.add('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        loadNotifications().then(markAllNotificationsRead);
      } else {
        notifDropdown.classList.remove('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        notifDropdown.classList.add('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
      }
    }

    const NOTIF_KEY = 'clincoo_notifications';
    const NOTIF_API = 'https://clincoo.pages.dev/api/notifications';
    function getNotifications() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch(e) { return []; } }
    function saveNotifications(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }
    function escapeNotifHtml(str) { return String(str || '').replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function updateNotifBadge(count) {
      const btn = document.querySelector('button[aria-label="Notifikasi"]');
      if (!btn) return;
      let badge = btn.querySelector('.notif-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'notif-badge absolute top-0.5 right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-semibold flex items-center justify-center';
        btn.appendChild(badge);
      }
      if (count > 0) { badge.textContent = count > 9 ? '9+' : String(count); badge.style.display = 'flex'; }
      else badge.style.display = 'none';
    }
    async function loadNotifications() {
      try {
        const res = await fetch(NOTIF_API);
        const data = await res.json();
        if (data && Array.isArray(data.notifications)) {
          saveNotifications(data.notifications);
          renderNotifications();
          updateNotifBadge(data.unreadCount || 0);
        }
      } catch(e) {}
    }
    function markAllNotificationsRead() {
      const n = getNotifications();
      let changed = false;
      for (let i of n) { if (!i.read) { i.read = 1; changed = true; } }
      if (changed) saveNotifications(n);
      updateNotifBadge(0);
      fetch(NOTIF_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark_all_read' }) }).catch(function() {});
    }
    function addNotification(source, message, link) {
      const n = getNotifications();
      n.unshift({ id: 'local-' + Date.now(), source: source, message: message, link: link || '', read: 0, created_at: new Date().toISOString() });
      if (n.length > 50) n.length = 50;
      saveNotifications(n); renderNotifications();
      fetch(NOTIF_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: source, message: message, link: link || '' }) }).catch(function() {});
    }
    function notifTime(ts) {
      if (!ts) return '';
      const s = String(ts);
      const d = new Date(s.indexOf('T') > -1 ? s : s.replace(' ', 'T') + 'Z');
      return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }
    function renderNotifications() {
      const notifs = getNotifications();
      const dd = document.getElementById('notif-dropdown');
      if (!dd) return;
      const contentArea = dd.querySelector('.text-xs.text-gray-500.text-center');
      if (!contentArea) return;
      const parent = contentArea.parentElement;
      if (notifs.length === 0) {
        contentArea.textContent = 'Belum ada notifikasi baru';
        contentArea.className = 'text-xs text-gray-500 text-center py-5';
        parent.innerHTML = '<div class="flex flex-col gap-2 mb-2"><div class="text-xs text-gray-500 text-center py-5">Belum ada notifikasi baru</div></div>';
        return;
      }
      parent.innerHTML = '<div class="space-y-1.5 max-h-48 overflow-y-auto"></div>';
      const listContainer = parent.querySelector('div');
      for (let n of notifs.slice(0, 5)) {
        const item = document.createElement('div');
        item.className = 'flex items-start gap-2 px-2 py-2 rounded-lg hover:bg-gray-50 cursor-pointer';
        if (n.link) item.onclick = function() { window.location.href = n.link; };
        const isUnread = !n.read;
        item.innerHTML = '<span class="text-xs font-semibold flex-shrink-0 ' + (isUnread ? 'text-gray-900' : 'text-gray-700') + '">' + escapeNotifHtml(n.source) + '</span><div class="flex-1 min-w-0"><p class="text-xs text-gray-600 ' + (isUnread ? 'font-medium' : '') + '">' + escapeNotifHtml(n.message) + '</p><p class="text-[10px] text-gray-400 mt-0.5">' + notifTime(n.created_at || n.timestamp) + '</p></div>';
        listContainer.appendChild(item);
      }
    }
    renderNotifications();
    loadNotifications();

        document.addEventListener('click', function(e) {
      const notifDropdown = document.getElementById('notif-dropdown');
      const notifBtn = e.target.closest('[onclick*="toggleNotifications"]');
      if (notifDropdown && !notifDropdown.contains(e.target) && !notifBtn) {
        notifDropdown.classList.remove('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        notifDropdown.classList.add('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
      }
    });

    let envVars = [];

    async function loadEnvVars() {
      try {
        const data = await ClincooAPI.getEnvVars();
        envVars = data.env_vars || [];
        renderEnvVars();
      } catch (e) {
        console.error('Failed to load env vars:', e);
      }
    }

    async function saveEnvVar() {
      const keyInput = document.getElementById('env-key');
      const valueInput = document.getElementById('env-value');
      const key = keyInput.value.trim();
      const value = valueInput.value.trim();

      if (key && value) {
        await ClincooAPI.addEnvVar(key, value, true);
        keyInput.value = '';
        valueInput.value = '';
        await loadEnvVars();
      }
    }

    async function deleteEnvVar(id) {
      await ClincooAPI.deleteEnvVar(id);
      await loadEnvVars();
    }

    function renderEnvVars() {
      const emptyState = document.getElementById('empty-state');
      const envList = document.getElementById('env-list');
      
      if (envVars.length === 0) {
        emptyState.style.display = 'flex';
        envList.innerHTML = '';
      } else {
        emptyState.style.display = 'none';
        envList.innerHTML = '';
        envVars.forEach((env) => {
          const row = document.createElement('div');
          row.className = 'flex items-center gap-3 animate-fade-in mb-3 min-w-0 w-full';
          
          row.innerHTML = `
            <div class="flex-1 min-w-0 px-4 py-2.5 bg-[#f7f7f9] border border-gray-200 rounded-full text-gray-700 text-[14px] font-mono overflow-hidden text-ellipsis whitespace-nowrap">
              ${env.key}
            </div>
            <div class="flex-1 min-w-0 px-4 py-2.5 bg-[#f7f7f9] border border-gray-200 rounded-full text-gray-700 text-[14px] font-mono overflow-hidden text-ellipsis whitespace-nowrap">
              ${env.value}
            </div>
            <button onclick="deleteEnvVar(${env.id})" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors focus:outline-none flex-shrink-0" aria-label="Hapus">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          `;
          envList.appendChild(row);
        });
      }
    }

    // Load env vars on page load
    loadEnvVars();
  </script>
<script>
(function(){
  var path=window.location.pathname.split('/').pop()||'environment.html';
  var links=document.querySelectorAll('.sidebar-nav-link');
  links.forEach(function(link){
    var href=link.getAttribute('href');
    if(href===path){
      link.classList.add('bg-gray-50','text-gray-900');
      link.classList.remove('hover:bg-gray-50','text-gray-700');
    }
  });
})();
</script>
</body></body>
