    let isEdited=false;function showActionButtons(){if(!isEdited){isEdited=true;const c=document.getElementById('action-buttons');c.classList.remove('hidden');c.classList.add('flex');void c.offsetWidth;c.classList.remove('opacity-0');c.classList.add('opacity-100');}}function cancelChanges(){window.location.reload();}function saveChanges(){const btn=document.querySelector('#action-buttons button.bg-blue-600');if(!btn)return;btn.innerText='Menyimpan...';btn.disabled=true;btn.classList.add('opacity-80','cursor-not-allowed');setTimeout(()=>{btn.innerText='Tersimpan!';btn.classList.replace('bg-blue-600','bg-emerald-500');btn.classList.replace('hover:bg-blue-700','hover:bg-emerald-600');setTimeout(()=>window.location.reload(),800);},800);}document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('input,textarea,select').forEach(input=>{input.addEventListener('input',showActionButtons);input.addEventListener('change',showActionButtons);});});function toggleSwitch(idPrefix){showActionButtons();const bg=document.getElementById(idPrefix+'-bg');const knob=document.getElementById(idPrefix+'-knob');if(bg.classList.contains('bg-blue-500')){bg.classList.replace('bg-blue-500','bg-gray-200');bg.classList.add('dark:bg-slate-700');knob.classList.remove('translate-x-5');}else{bg.classList.remove('bg-gray-200','dark:bg-slate-700');bg.classList.add('bg-blue-500');knob.classList.add('translate-x-5');}}

<script>
(function () {
  function apiRoot() { return (location.hostname.indexOf('github.io') !== -1) ? 'https://clincoo-be2.pages.dev/api' : '/api'; }
  function homeUrl() { return (location.hostname.indexOf('github.io') !== -1) ? '/Clincoo./' : '/'; }
  var confirmCb = null, statusCb = null, busy = false;
  function askConfirm(title, msg, okLabel, cb) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-ok').textContent = okLabel || 'Ya';
    confirmCb = cb;
    var m = document.getElementById('confirm-modal');
    m.classList.remove('hidden'); m.classList.add('flex');
  }
  function closeConfirm() { var m = document.getElementById('confirm-modal'); m.classList.add('hidden'); m.classList.remove('flex'); confirmCb = null; }
  function showStatus(title, msg, cb) {
      document.getElementById('status-title').textContent = title;
      document.getElementById('status-msg').textContent = msg;
      statusCb = (typeof cb === 'function') ? cb : null;
      var m = document.getElementById('status-modal');
      m.classList.remove('hidden'); m.classList.add('flex');
  }
  function goHome() {
      try {
          if (typeof window.ClincooBack === 'function') { window.ClincooBack(homeUrl()); return; }
      } catch (e) {}
      location.href = homeUrl();
  }
  async function postJSON(path, bodyObj) {
    var tok = localStorage.getItem('clincoo_auth_token') || '';
    var hdrs = { 'Content-Type': 'application/json' };
    if (tok) hdrs['Authorization'] = 'Bearer ' + tok;
    try {
      var res = await fetch(apiRoot() + path, { method: 'POST', headers: hdrs, body: JSON.stringify(bodyObj) });
      return await res.json();
    } catch (e) { return { error: 'Tidak dapat menghubungi server: ' + e.message }; }
  }
  function removeLocalData(id) {
    try {
      localStorage.removeItem('clincoo_ls_chat_' + id);
      localStorage.removeItem('clincoo_workspace_files_' + id);
    } catch (e) {}
  }
  document.addEventListener('DOMContentLoaded', function () {
    var pid = new URLSearchParams(location.search).get('id') || localStorage.getItem('clincoo_current_project_id') || '';
    var modal = document.getElementById('confirm-modal');
    modal.addEventListener('click', function (e) { if (e.target === modal && !busy) closeConfirm(); });
    document.getElementById('confirm-cancel').addEventListener('click', function () { if (!busy) closeConfirm(); });
    document.getElementById('confirm-ok').addEventListener('click', function () {
      if (busy || !confirmCb) return;
      var cb = confirmCb; confirmCb = null;
      var okBtn = document.getElementById('confirm-ok');
      var okLabel = okBtn.textContent;
      okBtn.textContent = 'Memproses...';
      busy = true;
      Promise.resolve(cb()).finally(function () { busy = false; closeConfirm(); okBtn.textContent = okLabel; });
    });
    document.getElementById('status-ok').addEventListener('click', function () {
      var m = document.getElementById('status-modal'); m.classList.add('hidden'); m.classList.remove('flex');
      if (statusCb) { var cb = statusCb; statusCb = null; cb(); }
    });

    // === Transfer kepemilikan ===
    var btnT = document.getElementById('btn-transfer');
    if (btnT) btnT.addEventListener('click', function () {
      var email = (document.getElementById('input-transfer-email').value || '').trim();
      if (!email) { showStatus('Email kosong', 'Masukkan email akun tujuan terlebih dahulu.'); return; }
      askConfirm('Transfer kepemilikan?', 'Proyek ini akan dipindahkan permanen ke akun ' + email + ' dan tidak lagi muncul di daftar proyek Anda.', 'Transfer', async function () {
        var r = await postJSON('/projects', { action: 'transfer', id: pid, email: email });
        if (r.error) { showStatus('Transfer gagal', r.error); return; }
        try {
          var list = JSON.parse(localStorage.getItem('clincoo_projects') || '[]');
          list = list.filter(function (x) { return x.id !== pid; });
          localStorage.setItem('clincoo_projects', JSON.stringify(list));
          if (localStorage.getItem('clincoo_current_project_id') === pid) localStorage.removeItem('clincoo_current_project_id');
        } catch (e) {}
        showStatus('Transfer berhasil', 'Proyek kini menjadi milik ' + email + '.', function () { goHome(); });
      });
    });

    // === Hapus semua data proyek (proyek & situs tetap ada) ===
    var btnW = document.getElementById('btn-hapus-data');
    if (btnW) btnW.addEventListener('click', function () {
      askConfirm('Hapus semua data proyek?', 'Semua file, chat, variabel lingkungan, dan konfigurasi proyek ini akan dihapus permanen. Proyek dan situs yang sudah dipublish tetap aman.', 'Hapus Data', async function () {
        var r = await postJSON('/projects', { action: 'wipe_data', id: pid });
        if (r.error) { showStatus('Gagal menghapus data', r.error); return; }
        removeLocalData(pid);
        showStatus('Data dihapus', 'Semua data proyek telah dihapus. Proyek dan situs publish-an tetap ada.');
      });
    });

    // === Hapus proyek (kaskade total) ===
    var btnD = document.getElementById('btn-hapus-proyek');
    if (btnD) btnD.addEventListener('click', function () {
      askConfirm('Hapus proyek ini?', 'Semua data proyek akan dihapus permanen, termasuk situs yang sudah dipublish dan link publiknya.', 'Hapus', async function () {
        var r1 = await postJSON('/deploy', { project_id: pid, action: 'unpublish' });
        var r2 = await postJSON('/projects', { action: 'delete', id: pid });
        if (r2.error) { showStatus('Gagal menghapus proyek', r2.error); return; }
        removeLocalData(pid);
        try {
          var list = JSON.parse(localStorage.getItem('clincoo_projects') || '[]');
          list = list.filter(function (x) { return x.id !== pid; });
          localStorage.setItem('clincoo_projects', JSON.stringify(list));
          if (localStorage.getItem('clincoo_current_project_id') === pid) localStorage.removeItem('clincoo_current_project_id');
        } catch (e) {}
        goHome();
      });
    });
  });
})();
</script>

    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('../../../sw.js').catch(function () {}); }); }
    </script>
