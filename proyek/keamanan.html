  <script>

    let isSidebarOpen = false;

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      if (isSidebarOpen) {
        sidebarOverlay.classList.remove('hidden');
        setTimeout(() => {
          sidebarOverlay.classList.remove('opacity-0');

        sidebarPopup.classList.add('-translate-x-full');
        setTimeout(() => {
          sidebarOverlay.classList.add('hidden');
        }, 300);
      }
    }

        function toggleNotifications(e) {
      e.stopPropagation();
      const notifDropdown = document.getElementById('notif-dropdown');
      const isHidden = notifDropdown.classList.contains('invisible');
      if (isHidden) {
        notifDropdown.classList.remove('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
        notifDropdown.classList.add('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        loadNotifications().then(markAllNotificationsRead);
      } else {
        notifDropdown.classList.remove('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        notifDropdown.classList.add('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
      }
    }

    // Shared Notification System
    const NOTIF_KEY = 'clincoo_notifications';
    const NOTIF_API = 'https://clincoo.pages.dev/api/notifications';
    const NOTIF_ALLOWED = ['GitHub', 'Workspace', 'Deploy', 'Akun', 'Dompet'];
    function isAllowedNotif(n) { return NOTIF_ALLOWED.indexOf(String((n && n.source) || '')) > -1; }
    (function(){ try { var _pn = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); var _pk = _pn.filter(isAllowedNotif); if (_pk.length !== _pn.length) { localStorage.setItem(NOTIF_KEY, JSON.stringify(_pk)); } } catch(e) {} })();
    function getNotifications() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]').filter(isAllowedNotif); } catch(e) { return []; } }
    function saveNotifications(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }

      const btn = document.querySelector('button[aria-label="Notifikasi"]');
      if (!btn) return;
      let badge = btn.querySelector('.notif-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'notif-badge absolute top-0.5 right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-semibold flex items-center justify-center';
        btn.appendChild(badge);
      }
      if (count > 0) { badge.textContent = count > 9 ? '9+' : String(count); badge.style.display = 'flex'; }
      else badge.style.display = 'none';
    }
    async function loadNotifications() {
      try {
        const res = await fetch(NOTIF_API);
        const data = await res.json();
        if (data && Array.isArray(data.notifications)) {
          const allowed = data.notifications.filter(isAllowedNotif);
          saveNotifications(allowed);
          renderNotifications();
          updateNotifBadge(allowed.filter(function(x) { return !x.read; }).length);
        }
      } catch(e) {}
    }
    function markAllNotificationsRead() {
      const n = getNotifications();
      let changed = false;
      for (let i of n) { if (!i.read) { i.read = 1; changed = true; } }
      if (changed) saveNotifications(n);
      updateNotifBadge(0);
      fetch(NOTIF_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark_all_read' }) }).catch(function() {});
    }
    function addNotification(source, message, link) {
      if (!isAllowedNotif({ source: source })) return;
      const n = getNotifications();
      n.unshift({ id: 'local-' + Date.now(), source: source, message: message, link: link || '', read: 0, created_at: new Date().toISOString() });
      if (n.length > 50) n.length = 50;
      saveNotifications(n); renderNotifications();
      fetch(NOTIF_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: source, message: message, link: link || '' }) }).catch(function() {});
    }
    function notifTime(ts) {
      if (!ts) return '';
      const s = String(ts);
      const d = new Date(s.indexOf('T') > -1 ? s : s.replace(' ', 'T') + 'Z');
      return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }
    function renderNotifications() {
      const notifs = getNotifications();
      const dd = document.getElementById('notif-dropdown');
      if (!dd) return;
      const contentArea = dd.querySelector('.text-xs.text-gray-500.text-center');
      if (!contentArea) return;
      const parent = contentArea.parentElement;
      if (notifs.length === 0) {
        parent.innerHTML = '<div class="flex flex-col gap-2 mb-2"><div class="text-xs text-gray-500 text-center py-5">Belum ada notifikasi baru</div></div>';
        return;
      }
      let html = '<div class="flex flex-col gap-1 max-h-72 overflow-y-auto">';
      for (let n of notifs.slice(0, 5)) {
        const isUnread = !n.read;
        const linkAttr = n.link ? ' onclick="window.location.href=\'' + escapeNotifHtml(n.link) + '\'"' : '';
        html += '<div class="notif-row flex items-start gap-2.5 px-2 py-2 rounded-lg hover:bg-gray-50 cursor-pointer"' + linkAttr + '>' +
          '<span class="w-1.5 h-1.5 rounded-full flex-shrink-0 mt-[7px] ' + (isUnread ? 'bg-red-500' : 'bg-transparent') + '"></span>' +
          '<div class="flex-1 min-w-0">' +
          '<div class="flex items-baseline gap-2"><span class="notif-src text-[11px] font-semibold text-gray-900 tracking-wide">' + escapeNotifHtml(n.source) + '</span>' +
          '<span class="notif-time text-[10px] text-gray-400 ml-auto flex-shrink-0">' + notifTime(n.created_at || n.timestamp) + '</span></div>' +
          '<p class="notif-msg text-xs text-gray-600 leading-snug break-words line-clamp-2 mt-0.5">' + escapeNotifHtml(n.message) + '</p>' +
          '</div></div>';
      }
      html += '</div>';
      parent.innerHTML = html;
    }
    renderNotifications();
    loadNotifications();

        document.addEventListener('click', function(e) {
      const notifDropdown = document.getElementById('notif-dropdown');
      const notifBtn = e.target.closest('[onclick*="toggleNotifications"]');
      if (notifDropdown && !notifDropdown.contains(e.target) && !notifBtn) {
        notifDropdown.classList.remove('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        notifDropdown.classList.add('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
      }
    });
    renderNotifications();
  </script>
<script>
// ===== Security Feed Real-time (situs proyek yang dideploy lewat Clincoo) =====
(function(){
  var SEC_API = 'https://clincoo.pages.dev/api/security-events';
  var POLL_MS = 10000;
  var pid = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('clincoo_current_project_id') || '';
  var seenKey = 'clincoo_sec_seen_' + pid;

  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function timeWib(iso){
    if(!iso) return '';
    var s = String(iso);
    var d = new Date(s.indexOf('T') > -1 ? s : s.replace(' ','T') + 'Z');
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' WIB';
  }
  function getSeen(){ try { return JSON.parse(localStorage.getItem(seenKey) || '[]'); } catch(e){ return []; } }
  function markSeen(ids){ try { localStorage.setItem(seenKey, JSON.stringify(ids.slice(0,100))); } catch(e){} }

  function render(data){
    var list = document.getElementById('sec-events-list');
    if (!list) return;
    var evs = data.events || [];

    // Kosong dulu — notifikasi muncul sendiri nanti dengan gaya seperti sebelumnya.
    if (!evs.length) {
      list.innerHTML = '<li class="flex items-center justify-center min-h-[240px] text-gray-500">Belum ada notifikasi keamanan.</li>';
      return;
    }

    var seen = getSeen();
    var html = '';
    evs.forEach(function(ev, i){
      var isNew = seen.indexOf(ev.id) === -1;
      var last = i === evs.length - 1;
      html += '<li class="py-4 flex items-start gap-4' + (last ? '' : ' border-b border-gray-200') + (isNew ? ' animate-fade-in' : '') + '">' +
        '<div>' +
        '<span class="font-medium text-gray-900 block">' + esc(ev.title) + '</span>' +
        '<span class="text-gray-500">' + esc(ev.detail) + '</span>' +
        '<div class="text-xs text-gray-400 mt-1.5">' + timeWib(ev.created_at) + (ev.ip ? ' · IP ' + esc(ev.ip) : '') + '</div>' +
        '</div></li>';
    });
    list.innerHTML = html;
    markSeen(evs.map(function(e){ return e.id; }));
  }

  function load(){
    if (!pid) { render({ events: [] }); return; }
    fetch(SEC_API + '?project_id=' + encodeURIComponent(pid))
      .then(function(r){ return r.json(); })
      .then(function(data){
        var li = document.getElementById('sec-loading');
        if (li) li.remove();
        render(data);
      })
      .catch(function(){});
  }
  load();
  setInterval(load, POLL_MS);
})();
</script>
