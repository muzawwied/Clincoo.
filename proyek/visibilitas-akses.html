<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){try{var __p=new URLSearchParams(location.search).get('id');if(__p){localStorage.setItem('clincoo_current_project_id',__p);}}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Visibilitas Akses</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: ["class", ".dark-mode"] };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    body.dark-mode { background-color: #000000; color: #e0e0e0; }
    body.dark-mode .text-gray-900, body.dark-mode .text-gray-800 { color: #f0f0f0 !important; }
    body.dark-mode .text-gray-700 { color: #b0b0b0 !important; }
    body.dark-mode .text-gray-500, body.dark-mode .text-gray-600 { color: #888888 !important; }
    body.dark-mode .text-gray-400 { color: #666666 !important; }
    body.dark-mode .bg-white { background-color: #0a0a0a !important; }
    
    body.dark-mode .custom-select-trigger, body.dark-mode .custom-dropdown-menu { background-color: #0a0a0a; color: #ffffff; border-color: #222222; }
    body.dark-mode input, body.dark-mode select, body.dark-mode textarea { background-color: #0a0a0a; color: #ffffff; border-color: #222222; }
    body.dark-mode input:focus, body.dark-mode select:focus, body.dark-mode textarea:focus { border-color: #444444; outline: none; }
    
    body.dark-mode header { background-color: #000000 !important; border-color: #222222 !important; }
    body.dark-mode button[onclick="history.back()"] { background-color: #000000 !important; border: 1.5px solid rgba(255,255,255,0.4) !important; color: #ffffff !important; }
    body.dark-mode button[onclick="history.back()"] svg { stroke: #ffffff !important; }
    body.dark-mode button[onclick="history.back()"]:hover { background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important; }
    
    body.dark-mode .bg-gray-50 { background-color: #111111 !important; }
    body.dark-mode .bg-gray-100 { background-color: #222222 !important; }
    body.dark-mode .border-gray-200, body.dark-mode .border-gray-100, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
    body.dark-mode .hover\:bg-gray-50:hover, body.dark-mode .hover\:bg-gray-100:hover { background-color: #1a1a1a !important; }

    .fade-in { animation: fadeIn 0.2s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Utility for smooth height transition */
    .expand-collapse { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, margin 0.3s ease-in-out, padding 0.3s ease-in-out; overflow: hidden; }
    .collapsed { max-height: 0 !important; opacity: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; border-top-width: 0 !important; }
  </style>
  <script>
    (function(){var t=localStorage.getItem('clincoo_theme')||'Sistem (Default)';var isDark=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(isDark)document.documentElement.classList.add('dark-mode');})();
  </script>
</head>
<body class="min-h-screen flex flex-col text-gray-900 bg-white pt-16 relative overflow-x-hidden antialiased">
  <script>
    (function(){var t=localStorage.getItem("clincoo_theme")||"Sistem (Default)";var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();
  </script>
  
  <header class="bg-white flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40 transition-colors border-b border-gray-200/60 dark:border-slate-800">
    <button onclick="history.back()" class="top-2 left-5 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="text-center">
        <h1 class="font-extrabold text-lg text-gray-900 tracking-tight">Visibilitas Akses</h1>
    </div>
    <div class="w-10"></div>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-4 pb-24 relative">
    <div class="w-full flex flex-col divide-y divide-gray-200 dark:divide-slate-700/60">
      
      <div class="py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="min-w-0 flex-1">
          <h4 class="text-base font-semibold text-gray-900 dark:text-white">Mode Visibilitas</h4>
          <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Siapa yang dapat mengakses situs ini</p>
        </div>
        <div class="relative w-full sm:w-80">
          <div class="custom-select-trigger flex items-center justify-between w-full px-4 py-3 text-sm rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition-colors cursor-pointer" onclick="toggleDropdown(this, 'visibility', ['Publik (Semua orang)', 'Privat (Hanya anggota)', 'Dilindungi Password'])">
            <span id="label-visibility" class="font-medium">Publik (Semua orang)</span>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 transition-transform duration-200 pointer-events-none"></i>
          </div>
        </div>
      </div>

      <!-- Added max-height for transition purposes and collapsed class by default -->
      <div id="password-section" class="expand-collapse collapsed py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3" style="max-height: 500px;">
        <div class="min-w-0 flex-1">
          <h4 class="text-base font-semibold text-gray-900 dark:text-white">Password Akses</h4>
          <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Atur kata sandi untuk melindungi situs Anda</p>
        </div>
        <div class="w-full sm:w-80">
            <input type="password" id="password-input" value="" class="w-full px-4 py-3 text-sm rounded-xl border border-gray-200 bg-white focus:outline-none transition-colors focus:ring-1 focus:ring-gray-300 dark:focus:ring-gray-600" placeholder="Masukkan password">
        </div>
      </div>

      <div class="py-5 flex items-center justify-between gap-4 border-t border-gray-200 dark:border-slate-700/60">
        <div class="min-w-0 flex-1">
          <h4 class="text-base font-semibold text-gray-900 dark:text-white">Indexasi Mesin Pencari</h4>
          <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Izinkan mesin pencari mengindeks situs</p>
        </div>
        <button type="button" onclick="toggleSwitch('indexSearch')" class="relative flex-shrink-0 cursor-pointer focus:outline-none">
          <div id="indexSearch-bg" class="w-11 h-6 bg-blue-500 rounded-full transition-colors duration-200 ease-in-out"></div>
          <div id="indexSearch-knob" class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full shadow transition-transform duration-200 ease-in-out translate-x-5"></div>
        </button>
      </div>

      <div class="py-5 flex items-center justify-between gap-4">
        <div class="min-w-0 flex-1">
          <h4 class="text-base font-semibold text-gray-900 dark:text-white">Proteksi DDoS</h4>
          <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Filter lalu lintas berbahaya secara otomatis</p>
        </div>
        <button type="button" onclick="toggleSwitch('ddos')" class="relative flex-shrink-0 cursor-pointer focus:outline-none">
          <div id="ddos-bg" class="w-11 h-6 bg-blue-500 rounded-full transition-colors duration-200 ease-in-out"></div>
          <div id="ddos-knob" class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full shadow transition-transform duration-200 ease-in-out translate-x-5"></div>
        </button>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    if (typeof window.ClincooAPI === 'undefined') {
      window.ClincooAPI = {
        getSecurity: async () => ({ settings: { ddos: '1', indexSearch: '1' } }),
        updateSecurity: async (key, value) => { console.log(`Mock updateSecurity: ${key} = ${value}`); }
      };
    }

    async function loadAccessSettings() {
      try {
        const data = await ClincooAPI.getSecurity();
        const settings = data.settings || {};
        if (settings.ddos === '0') {
          const ddosBg = document.getElementById('ddos-bg');
          if (ddosBg) { ddosBg.classList.replace('bg-blue-500', 'bg-gray-200'); ddosBg.classList.add('dark:bg-slate-700'); document.getElementById('ddos-knob').classList.remove('translate-x-5'); }
        }
        if (settings.indexSearch === '0') {
          const isBg = document.getElementById('indexSearch-bg');
          if (isBg) { isBg.classList.replace('bg-blue-500', 'bg-gray-200'); isBg.classList.add('dark:bg-slate-700'); document.getElementById('indexSearch-knob').classList.remove('translate-x-5'); }
        }
      } catch (e) { console.error('Access settings load failed:', e); }
    }
    loadAccessSettings();
  </script>

  <script>
    function toggleSwitch(idPrefix){
      const bg=document.getElementById(idPrefix+'-bg');
      const knob=document.getElementById(idPrefix+'-knob');
      if(bg.classList.contains('bg-blue-500')){
        bg.classList.replace('bg-blue-500','bg-gray-200');
        bg.classList.add('dark:bg-slate-700');
        knob.classList.remove('translate-x-5');
      }else{
        bg.classList.remove('bg-gray-200','dark:bg-slate-700');
        bg.classList.add('bg-blue-500');
        knob.classList.add('translate-x-5');
      }
      
      // Auto-save logic can be triggered here if needed
      // console.log(`${idPrefix} toggled`);
    }

    // Custom Dropdown Logic
    function toggleDropdown(element, targetId, optionsArray) {
        const wrapper = element.parentElement;
        const existingDropdown = wrapper.querySelector('.custom-dropdown-menu');
        
        closeAllDropdowns();

        if (existingDropdown) return; 

        const labelEl = document.getElementById('label-' + targetId);
        const currentValue = labelEl ? labelEl.textContent.trim() : '';
        
        const dropdown = document.createElement('div');
        dropdown.className = 'custom-dropdown-menu absolute top-full left-0 w-full mt-2 z-50 bg-white dark:bg-[#111] border border-gray-200 dark:border-[#222] rounded-xl shadow-xl overflow-hidden flex flex-col fade-in';
        
        let optionsHtml = '';
        optionsArray.forEach(option => {
            const isActive = option === currentValue;
            optionsHtml += `
                <div class="w-full px-4 py-3 text-left text-sm font-medium transition-colors cursor-pointer flex items-center justify-between ${isActive ? 'bg-gray-50 text-black dark:bg-gray-800 dark:text-white' : 'text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-800'}" onclick="selectOption(event, '${targetId}', '${option}')">
                    <span>${option}</span>
                    ${isActive ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                </div>
            `;
        });
        
        dropdown.innerHTML = optionsHtml;
        wrapper.appendChild(dropdown);
        
        const chevron = element.querySelector('[data-lucide="chevron-down"]');
        if(chevron) chevron.classList.add('rotate-180');
        
        lucide.createIcons();

        setTimeout(() => {
            document.addEventListener('click', outsideClickListener);
        }, 10);
    }

    function closeAllDropdowns() {
        const openDropdowns = document.querySelectorAll('.custom-dropdown-menu');
        openDropdowns.forEach(dropdown => {
            const chevron = dropdown.parentElement.querySelector('.rotate-180');
            if(chevron) chevron.classList.remove('rotate-180');
            dropdown.remove();
        });
        document.removeEventListener('click', outsideClickListener);
    }

    function outsideClickListener(e) {
        if (!e.target.closest('.custom-select-trigger') && !e.target.closest('.custom-dropdown-menu')) {
            closeAllDropdowns();
        }
    }

    function selectOption(event, targetId, value) {
        event.stopPropagation();
        
        const label = document.getElementById('label-' + targetId);
        if (label) {
            label.textContent = value;
            
            // Logic to show/hide password section based on selection
            if (targetId === 'visibility') {
                const passSection = document.getElementById('password-section');
                const passInput = document.getElementById('password-input');
                
                if (passSection && passInput) {
                    const isProtected = (value === 'Dilindungi Password');
                    
                    if (isProtected) {
                        passSection.classList.remove('collapsed');
                        // Optional: focus the input shortly after animation starts
                        setTimeout(() => passInput.focus(), 300);
                    } else {
                        passSection.classList.add('collapsed');
                        passInput.value = ''; // Clear value if hidden
                    }
                }
            }
        }
        closeAllDropdowns();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Initialize icons
      lucide.createIcons();
      
      // Ensure UI state matches default label on load
      const visibilityLabel = document.getElementById('label-visibility');
      if(visibilityLabel) {
         const initialVal = visibilityLabel.textContent.trim();
         const passSection = document.getElementById('password-section');
         if(initialVal !== 'Dilindungi Password' && passSection) {
             passSection.classList.add('collapsed');
         }
      }
    });
  </script>
</body>
</html>
