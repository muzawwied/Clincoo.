    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        html, body {
            height: 100dvh;
            height: -webkit-fill-available;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff; 
            color: #000000;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }

        .gradient-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(156,163,175,0.3) 50%, rgba(255,255,255,1) 100%);
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
            color: #9ca3af;
            margin-left: 2px;
        }
        
        .typing-cursor > p:last-child {
            display: inline;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .shiny-text {
            background: linear-gradient(110deg, #000000 35%, #9ca3af 50%, #000000 65%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }

        .shimmer-search {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: linear-gradient(90deg, #6b7280 0%, #d1d5db 50%, #6b7280 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 2s linear infinite;
            font-weight: 500;
            font-size: 0.95rem;
        }

        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .bouncing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .bouncing-dot {
            width: 5px;
            height: 5px;
            background-color: #374151;
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .bouncing-dot:nth-child(1) { animation-delay: 0s; }
        .bouncing-dot:nth-child(2) { animation-delay: 0.2s; }
        .bouncing-dot:nth-child(3) { animation-delay: 0.4s; }

        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }

        .hljs {
            background: transparent !important;
            padding: 0 !important;
        }
        
        .code-container::-webkit-scrollbar {
            height: 8px;
        }
        .code-container::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 0 0 20px 20px;
        }
        .code-container::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: #9ca3af;
        }

        .md-content h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #000; }
        .md-content h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #000; }
        .md-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #000; }
        .md-content h4, .md-content h5, .md-content h6 { font-size: 1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #000; }
        .md-content p { margin-bottom: 0.75rem; }
        .md-content p:last-child { margin-bottom: 0; }
        .md-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .md-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .md-content li { margin-bottom: 0.25rem; }
        .md-content { max-width: 100%; overflow-wrap: break-word; word-wrap: break-word; }

        .md-content code:not(.hljs) {

            border-radius: 0.25rem; 
            font-size: 0.875rem;

        .md-content pre { margin: 0; }
        .md-content blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; color: #4b5563; font-style: italic; margin-bottom: 1rem; }
        .md-content a { color: #2563eb; text-decoration: underline; }
        .md-content strong { font-weight: 700; }
        .md-content em { font-style: italic; }
        .md-content tbody td:first-child { font-weight: 600; background-color: #f9fafb; }

        .header-glass {
            background: linear-gradient(to bottom, rgba(247, 247, 249, 1) 0%, rgba(247, 247, 249, 0) 100%);
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);

        }
        body.dark-mode .header-glass {

        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;
            scrollbar-width: none;

        body.dark-mode { background: #000000 !important; color: #ffffff !important; }

                        <button id="upload-file-btn" class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50 rounded-xl transition-colors text-sm font-medium text-left cursor-pointer">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>

                <button id="submit-prompt-btn" class="w-10 h-10 bg-black text-white rounded-full hover:bg-gray-800 transition-all duration-200 active:scale-90 flex items-center justify-center cursor-pointer shadow-sm hover:shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <script>
        if (typeof window !== 'undefined') {
            window.process = window.process || { env: {} };
        }

        // Shared Notification System
        const NOTIF_KEY = 'clincoo_notifications';
        function getNotifications() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch(e) { return []; } }
        function saveNotifications(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }
        function addNotification(source, message) {
          const n = getNotifications();
          n.unshift({ id: Date.now(), source, message, timestamp: new Date().toISOString(), read: false });
          if (n.length > 50) n.length = 50;
          saveNotifications(n);
        }
        function markNotifRead(id) {
          const n = getNotifications();
          const item = n.find(x => x.id === id);
          if (item) item.read = true;
          saveNotifications(n);
        }

        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('main-prompt-input');
        const btnAction = document.getElementById('submit-prompt-btn');
        const btnPlus = document.getElementById('add-btn');
        const fileUpload = document.getElementById('real-file-input');
        const filePreviewContainer = document.getElementById('file-preview-container');
        const uploadMenu = document.getElementById('upload-menu');
        const uploadFileBtn = document.getElementById('upload-file-btn');
        
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarPopup = document.getElementById('sidebar-popup');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        sidebarToggle.addEventListener('click', () => {
            const isOpen = !sidebarPopup.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebarPopup.classList.add('-translate-x-full');
                sidebarOverlay.classList.remove('opacity-100');
                sidebarOverlay.classList.add('opacity-0');
                setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
            } else {
                sidebarOverlay.classList.remove('hidden');
                setTimeout(() => {
                    sidebarOverlay.classList.remove('opacity-0');
                    sidebarOverlay.classList.add('opacity-100');
                    sidebarPopup.classList.remove('-translate-x-full');
                }, 10);
            }
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebarPopup.classList.add('-translate-x-full');
            sidebarOverlay.classList.remove('opacity-100');
            sidebarOverlay.classList.add('opacity-0');
            setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
        });

        let currentAttachments = [];
        
        let isGenerating = false;
        let typingInterval = null;
        let currentAiMessageId = null;
        let currentStatusInterval = null;
        let abortController = null;
        let autoScrollActive = true;
        let isUserInteracting = false;
        let lastScrollTop = 0;
        let imageGenerationTimeout = null;
        
        let messages = [];
        let currentSessionId = null;
        let currentProjectId = null;

        const welcomeGreetings = [
            "Ada rencana apa hari ini, Clincoo?",
            "Halo! Ada yang bisa saya bantu hari ini?",
            "Siap mewujudkan ide hebatmu hari ini?",
            "Apa proyek seru kita selanjutnya?",
            "Mari selesaikan berbagai tugas bersamaku!"
        ];
        let currentGreeting = welcomeGreetings[Math.floor(Math.random() * welcomeGreetings.length)];

        function clearChat() {
            if (isGenerating) stopGeneration();
            if (currentSessionId) {
                try {
                    fetch(GEMINI_PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete_session', session_id: currentSessionId })
                    }).catch(function(e) {});
                } catch(e) {}
                currentSessionId = null;
            }
            messages = [];
            currentGreeting = welcomeGreetings[Math.floor(Math.random() * welcomeGreetings.length)];
            renderMessages();
            
            sidebarPopup.classList.add('-translate-x-full');
            sidebarOverlay.classList.remove('opacity-100');
            sidebarOverlay.classList.add('opacity-0');
            setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
        }

        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        function adjustInputHeight() {
            chatInput.style.height = 'auto';
            if (chatInput.value.trim() === '') {
                chatInput.classList.replace('overflow-y-auto', 'overflow-hidden');
                return;
            }
            let scrollHeight = chatInput.scrollHeight;
            if (scrollHeight > 45) { 
                const newHeight = Math.min(scrollHeight, 140);
                chatInput.style.height = newHeight + 'px';
                if (scrollHeight > 140) {
                    chatInput.classList.replace('overflow-hidden', 'overflow-y-auto');
                } else {
                    chatInput.classList.replace('overflow-y-auto', 'overflow-hidden');
                }
            } else {
                chatInput.classList.replace('overflow-y-auto', 'overflow-hidden');
            }
        }

        chatInput.addEventListener('input', adjustInputHeight);

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function balanceMarkdown(text) {
            if (!text) return text;
            let result = text;
            const codeBlocks = (result.match(/```/g) || []).length;
            if (codeBlocks % 2 !== 0) result += '\n```';

            let temp4 = result.replace(/```[\s\S]*?```/g, '');
            let backtickCount = (temp4.match(/`/g) || []).length;
            if (backtickCount % 2 !== 0) result += '`';
            return result;
        }

        if (window.marked) {
            marked.use({
                breaks: true,
                gfm: true,
                renderer: {
                    table(header, body) {
                        return `<div class="w-full overflow-x-auto custom-scrollbar my-4 rounded-xl border border-gray-300 shadow-sm bg-white pointer-events-auto" style="-webkit-overflow-scrolling: touch;">
                                    <table class="w-full min-w-max border-collapse text-sm text-left m-0">
                                        <thead class="bg-gray-100">
                                            ${header}
                                        </thead>
                                        <tbody>
                                            ${body}
                                        </tbody>
                                    </table>
                                </div>`;
                    },
                    tablerow(content) {
                        return `<tr class="hover:bg-gray-50 transition-colors">${content}</tr>`;
                    },
                    tablecell(content, flags) {
                        const type = flags.header ? 'th' : 'td';
                        const classes = flags.header 
                            ? 'p-3 font-bold text-gray-900 border border-gray-300 whitespace-nowrap' 
                            : 'p-3 text-gray-800 border border-gray-300 align-top';
                        return `<${type} class="${classes}">${content}</${type}>`;
                    },
                    code(code_or_token, lang_opt) {
                        let code = typeof code_or_token === 'string' ? code_or_token : code_or_token.text;
                        let lang = typeof code_or_token === 'string' ? lang_opt : (code_or_token.lang || '');
                        lang = (lang || '').trim();
                        let finalLang = lang;
                        let highlightedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        
                        if (window.hljs) {
                            try {
                                if (lang && hljs.getLanguage(lang)) {
                                    highlightedCode = hljs.highlight(code, { language: lang }).value;
                                } else {
                                    const autoResult = hljs.highlightAuto(code);
                                    highlightedCode = autoResult.value;
                                    finalLang = autoResult.language || 'text';
                                }
                            } catch(e) {}
                        }

                        const displayLang = finalLang ? (finalLang.charAt(0).toUpperCase() + finalLang.slice(1)) : 'Code / File';
                        const encodedRaw = encodeURIComponent(code);
                        const blockId = 'code-block-' + Math.random().toString(36).substr(2, 9);
                        const runnableLangs = ['python', 'javascript', 'js', 'java', 'c', 'cpp', 'php', 'ruby', 'go', 'rust', 'html'];
                        const isRunnable = runnableLangs.includes(finalLang.toLowerCase());
                        
                        let runButton = '';
                        if (isRunnable && finalLang.toLowerCase() !== 'html') {
                             runButton = `<button onclick="runCode(this, '${finalLang.toLowerCase()}', '${blockId}')" data-code="${encodedRaw}" data-view="code" class="relative text-gray-400 hover:text-white transition flex items-center justify-center rounded-lg p-1.5 hover:bg-gray-600 pointer-events-auto" title="Jalankan Kode">
                                <i class="ph-bold ph-play text-[18px]"></i>
                            </button>`;
                        } else if (finalLang.toLowerCase() === 'html') {
                            runButton = `<button onclick="previewHTML(this, '${blockId}')" data-code="${encodedRaw}" data-view="code" class="relative text-gray-400 hover:text-white transition flex items-center justify-center rounded-lg p-1.5 hover:bg-gray-600 pointer-events-auto" title="Preview UI / Animasi">
                                <i class="ph-bold ph-eye text-[18px]"></i>
                            </button>`;
                        }

                        return `
                            <div class="my-4 bg-[#1e1e1e] rounded-[16px] overflow-hidden shadow-[0_5px_15px_rgba(0,0,0,0.1)] w-full max-w-full border border-gray-800 pointer-events-auto">
                                <div class="flex items-center justify-between px-4 py-3 bg-[#2d2d2d] border-b border-gray-700">
                                    <span class="text-[13px] font-bold text-gray-300 uppercase tracking-wider">${displayLang}</span>
                                    <div class="flex items-center gap-2">
                                        ${runButton}
                                        <button onclick="downloadCode(this, '${finalLang || 'txt'}')" data-code="${encodedRaw}" class="text-gray-400 hover:text-white transition flex items-center justify-center rounded-lg p-1.5 hover:bg-gray-600 pointer-events-auto" title="Download File">
                                            <i class="ph ph-cloud-arrow-down text-[18px]"></i>
                                        </button>
                                        <button onclick="copyCodeBlock(this)" data-code="${encodedRaw}" class="relative text-gray-400 hover:text-white transition flex items-center justify-center rounded-lg p-1.5 hover:bg-gray-600 pointer-events-auto" title="Copy">
                                            <i class="ph ph-copy text-[18px]"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="${blockId}-code-container" class="p-4 overflow-x-auto bg-[#1e1e1e] code-container custom-scrollbar w-full pointer-events-auto" style="-webkit-overflow-scrolling: touch; max-width: 100%;">
                                    <pre style="margin:0; min-width: 100%; width: max-content;"><code class="hljs text-[13.5px] font-mono leading-relaxed bg-transparent p-0 text-gray-300" style="white-space: pre; display: block; padding-bottom: 0.25rem; min-width: 100%;">${highlightedCode}</code></pre>
                                </div>
                                <div id="${blockId}-output-container" class="hidden bg-[#121212] p-4 transition-all w-full pointer-events-auto">
                                    <div class="text-[11px] font-bold text-gray-400 mb-2 uppercase tracking-wider flex items-center gap-2">
                                        <i class="ph ph-terminal-window text-[14px]"></i> Output Eksekusi
                                    </div>
                                    <pre id="${blockId}-output" class="text-[13px] font-mono whitespace-pre-wrap break-words max-h-80 overflow-y-auto text-gray-200"></pre>
                                    <iframe id="${blockId}-iframe" class="hidden w-full h-80 bg-white rounded-md border-0"></iframe>
                                </div>
                            </div>
                        `;
                    }
                }
            });
        }

        function formatMarkdown(text) {
            if (!text) return '';
            try {
                return marked.parse(text);
            } catch (e) {
                return text;
            }
        }

        function showGlobalTooltip(element, text) {
            document.querySelectorAll('.global-tooltip').forEach(el => el.remove());
            const rect = element.getBoundingClientRect();
            const tooltip = document.createElement('div');
            tooltip.className = 'global-tooltip fixed bg-black text-white text-[11px] font-semibold px-2.5 py-1.5 rounded shadow-lg whitespace-nowrap pointer-events-none z-[9999] fade-in';
            tooltip.innerText = text;
            const arrow = document.createElement('div');
            arrow.className = 'absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-black';
            tooltip.appendChild(arrow);
            document.body.appendChild(tooltip);
            const tooltipRect = tooltip.getBoundingClientRect();
            tooltip.style.left = `${rect.left + (rect.width / 2) - (tooltipRect.width / 2)}px`;
            tooltip.style.top = `${rect.top - tooltipRect.height - 8}px`;
            setTimeout(() => {
                tooltip.style.opacity = '0';
                tooltip.style.transition = 'opacity 0.2s ease-out';
                setTimeout(() => tooltip.remove(), 200);
            }, 1200);
        }

        function copyCodeBlock(btnElement) {
            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showGlobalTooltip(btnElement, 'Disalin');
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function downloadCode(btnElement, lang) {
            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const extMap = {
                'python': 'py', 'javascript': 'js', 'html': 'html', 'css': 'css', 
                'java': 'java', 'cpp': 'cpp', 'c': 'c', 'php': 'php', 'ruby': 'rb',
                'json': 'json', 'typescript': 'ts', 'bash': 'sh', 'shell': 'sh',
                'go': 'go', 'rust': 'rs', 'csv': 'csv', 'sql': 'sql', 'xml': 'xml'
            };
            const ext = extMap[lang.toLowerCase()] || 'txt';
            const filename = `generated_file.${ext}`;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function toggleCodeOutputView(btnElement, blockId, showOutput, isHtml = false) {
            const codeContainer = document.getElementById(`${blockId}-code-container`);
            const outputContainer = document.getElementById(`${blockId}-output-container`);
            
            if (showOutput) {
                if (codeContainer) codeContainer.classList.add('hidden');
                if (outputContainer) outputContainer.classList.remove('hidden');
                btnElement.innerHTML = '<i class="ph-bold ph-code text-[18px]"></i>';
                btnElement.setAttribute('title', 'Lihat Kode');
                btnElement.dataset.view = 'output';
            } else {
                if (outputContainer) outputContainer.classList.add('hidden');
                if (codeContainer) codeContainer.classList.remove('hidden');
                if (isHtml) {
                    btnElement.innerHTML = '<i class="ph-bold ph-eye text-[18px]"></i>';
                    btnElement.setAttribute('title', 'Preview UI / Animasi');
                } else {
                    btnElement.innerHTML = '<i class="ph-bold ph-play text-[18px]"></i>';
                    btnElement.setAttribute('title', 'Jalankan Kode');
                }
                btnElement.dataset.view = 'code';
            }
        }

        function previewHTML(btnElement, blockId) {
            const currentView = btnElement.dataset.view || 'code';
            
            if (currentView === 'output') {
                toggleCodeOutputView(btnElement, blockId, false, true);
                return;
            }

            toggleCodeOutputView(btnElement, blockId, true, true);

            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const outputEl = document.getElementById(`${blockId}-output`);
            const iframeEl = document.getElementById(`${blockId}-iframe`);
            
            if (outputEl) outputEl.classList.add('hidden');
            if (iframeEl) {
                iframeEl.classList.remove('hidden');
                iframeEl.srcdoc = code;
            }
        }

        async function runCode(btnElement, lang, blockId) {
            const currentView = btnElement.dataset.view || 'code';
            
            if (currentView === 'output') {
                toggleCodeOutputView(btnElement, blockId, false, false);
                return;
            }

            toggleCodeOutputView(btnElement, blockId, true, false);

            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const outputEl = document.getElementById(`${blockId}-output`);
            const iframeEl = document.getElementById(`${blockId}-iframe`);
            
            if (outputEl) outputEl.classList.remove('hidden');
            if (iframeEl) iframeEl.classList.add('hidden');

            outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Memuat eksekusi...</span>';
            const targetLang = lang.toLowerCase();

            try {
                outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Menyiapkan E2B Sandbox (e2b.dev)...</span>';
                let CodeInterpreter;
                try {
                    const e2bModule = await import('https://esm.sh/@e2b/code-interpreter?bundle&target=es2022');
                    CodeInterpreter = e2bModule.CodeInterpreter || e2bModule.default?.CodeInterpreter;
                } catch (importErr) {
                    throw new Error("Gagal memuat modul E2B, beralih ke fallback.");
                }

                if (!CodeInterpreter) throw new Error("E2B CodeInterpreter tidak tersedia.");
                
                let e2bKey = '';
                try {
                    const keyRes = await fetch('https://clincoo.pages.dev/api/e2b');
                    if (keyRes.ok) { const kj = await keyRes.json(); e2bKey = kj.apiKey || ''; }
                } catch(e) {}
                if (!e2bKey) throw new Error("E2B API key tidak tersedia, beralih ke fallback.");
                const sandbox = await CodeInterpreter.create({ apiKey: e2bKey });
                
                outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Mengeksekusi kode dalam Sandbox...</span>';

                let outputText = "";
                let errorText = "";

                if (targetLang === 'python') {
                    const exec = await sandbox.notebook.execCell(code);
                    if (exec.text) outputText += exec.text + "\n";
                    if (exec.results) {
                        for (const res of exec.results) {
                            if (res.text) outputText += res.text + "\n";
                            if (res.error) errorText += res.error.value + "\n";
                        }
                    }
                    if (exec.logs) {
                        if (exec.logs.stdout) outputText += exec.logs.stdout.join('\n');
                        if (exec.logs.stderr) errorText += exec.logs.stderr.join('\n');
                    }
                    if (exec.error) {
                        errorText += `${exec.error.name}: ${exec.error.value}\n${exec.error.traceback}`;
                    }
                } else {
                    const e2bLangMap = {
                        'javascript': { filename: 'main.js', runCmd: 'node main.js' },
                        'js': { filename: 'main.js', runCmd: 'node main.js' },
                        'java': { filename: 'Main.java', runCmd: 'javac Main.java && java Main' },
                        'c': { filename: 'main.c', runCmd: 'gcc main.c -o main && ./main' },
                        'cpp': { filename: 'main.cpp', runCmd: 'g++ main.cpp -o main && ./main' },
                        'php': { filename: 'main.php', runCmd: 'php main.php' },
                        'ruby': { filename: 'main.rb', runCmd: 'ruby main.rb' },
                        'go': { filename: 'main.go', runCmd: 'go run main.go' },
                        'rust': { filename: 'main.rs', runCmd: 'rustc main.rs && ./main' }
                    };
                    
                    const runInfo = e2bLangMap[targetLang] || { filename: 'main.txt', runCmd: 'cat main.txt' };
                    
                    await sandbox.filesystem.write(runInfo.filename, code);
                    const cmdExe = await sandbox.commands.run(runInfo.runCmd);
                    
                    outputText = cmdExe.stdout;
                    errorText = cmdExe.stderr || (cmdExe.error ? cmdExe.error.message : "");
                }

                await sandbox.close();

                if (errorText) {
                    outputEl.innerHTML = `<span class="text-red-400">${errorText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
                } else {
                    outputEl.innerHTML = `<span class="text-green-400">${(outputText || '').replace(/</g, "&lt;").replace(/>/g, "&gt;") || '(Tidak ada output/berhasil dieksekusi)'}</span>`;
                }

            } catch (e2bError) {
                console.warn("E2B execution failed, falling back to Piston Sandbox.", e2bError);
                outputEl.innerHTML = '<span class="text-yellow-400 animate-pulse">E2B Sandbox error/timeout. Melanjutkan eksekusi ke Piston Sandbox (Fallback)...</span>';
                
                const langMapPiston = {
                    'python': { language: 'python', version: '*' },
                    'javascript': { language: 'javascript', version: '*' },
                    'js': { language: 'javascript', version: '*' },
                    'java': { language: 'java', version: '*' },
                    'c': { language: 'c', version: '*' },
                    'cpp': { language: 'c++', version: '*' },
                    'php': { language: 'php', version: '*' },
                    'ruby': { language: 'ruby', version: '*' },
                    'go': { language: 'go', version: '*' },
                    'rust': { language: 'rust', version: '*' }
                };
                
                const runInfoPiston = langMapPiston[targetLang] || { language: targetLang, version: '*' };

                try {
                    const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            language: runInfoPiston.language,
                            version: runInfoPiston.version,
                            files: [{ content: code }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.compile && data.compile.code !== 0) {
                        outputEl.innerHTML = `<span class="text-red-400">${(data.compile.stderr || "").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
                    } else if (data.run) {
                        let out = (data.run.output || data.run.stdout || data.run.stderr || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        if (data.run.code !== 0) {
                             outputEl.innerHTML = `<span class="text-red-400">${out || 'Terjadi kesalahan eksekusi.'}</span>`;
                        } else {
                             outputEl.innerHTML = `<span class="text-green-400">${out || '(Tidak ada output/berhasil dieksekusi)'}</span>`;
                        }
                    } else {
                         outputEl.innerHTML = `<span class="text-red-400">Gagal menjalankan kode atau bahasa belum didukung server (versi).</span>`;
                    }
                } catch (err) {
                    outputEl.innerHTML = `<span class="text-red-400">Terjadi kesalahan jaringan pada sistem eksekusi Piston.</span>`;
                }
            }
        }

        chatContainer.addEventListener('touchstart', () => isUserInteracting = true, {passive: true});
        chatContainer.addEventListener('touchend', () => isUserInteracting = false, {passive: true});
        chatContainer.addEventListener('mousedown', () => isUserInteracting = true);
        document.addEventListener('mouseup', () => isUserInteracting = false);
        chatContainer.addEventListener('wheel', () => {
            isUserInteracting = true;
            clearTimeout(chatContainer.wheelTimeout);
            chatContainer.wheelTimeout = setTimeout(() => isUserInteracting = false, 250);
        }, {passive: true});

        chatContainer.addEventListener('scroll', () => {
            const threshold = 15;
            const currentScrollTop = Math.ceil(chatContainer.scrollTop);
            const maxScrollTop = chatContainer.scrollHeight - chatContainer.clientHeight;

            if (maxScrollTop - currentScrollTop > threshold) {
                autoScrollActive = false;
            } else {
                autoScrollActive = true;
            }

            lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        });

        function readAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function readAsText(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsText(file);
            });
        }

        async function loadPDF(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let maxPages = pdf.numPages;
                let text = "";
                for (let i = 1; i <= Math.min(maxPages, 10); i++) { 
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(' ') + "\n";
                }
                return text;
            } catch(err) {
                return "Gagal membaca file PDF.";
            }
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        async function handleFileUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                let data = null;
                let text = null;
                let type = file.type.startsWith('image/') ? 'image' : 'document';
                let extension = file.name.split('.').pop().toLowerCase();

                if (type === 'image') {
                    data = await readAsDataURL(file);
                } else {
                    if (file.type === 'application/pdf') {
                        text = await loadPDF(file);
                    } else {
                        text = await readAsText(file);
                    }
                }

                currentAttachments.push({
                    id: generateId(),
                    file: file,
                    type: type,
                    name: file.name,
                    size: formatSize(file.size),
                    data: data,
                    text: text,
                    extension: extension
                });
            }

            showAttachmentPreview();
            e.target.value = '';
        }

            const extMap = {

                'css': 'ph-file-css text-gray-500',
                'js': 'ph-file-code text-gray-500',
                'json': 'ph-file-code text-gray-500',
                'py': 'ph-file-code text-gray-500',
                'pdf': 'ph-file-pdf text-gray-500',
                'zip': 'ph-file-archive text-gray-500',
                'txt': 'ph-file-text text-gray-500',
                'csv': 'ph-file-csv text-gray-500',
                'png': 'ph-image text-gray-500',
                'jpg': 'ph-image text-gray-500',
                'jpeg': 'ph-image text-gray-500'
            };
            const iconClass = extMap[ext] || 'ph-file-text text-gray-500';
            return `<i class="ph-fill ${iconClass} text-[16px]"></i>`;
        }

        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                window.open(url, '_blank');
            }
        }

                const textEl = document.getElementById(`msg-text-${currentAiMessageId}`);
                const finishedMsg = messages.find(m => m.id === currentAiMessageId);
                if (finishedMsg && finishedMsg.text) {

                        const projectId = urlParams.get('id');
                        if (projectId) {
                            let projects = [];
                            const stored = localStorage.getItem('clincoo_projects');
                            if (stored) projects = JSON.parse(stored);
                            const projIndex = projects.findIndex(p => p.id === projectId);
                            if (projIndex !== -1) {
                                if (!projects[projIndex].aiName) {
                                    const firstLine = finishedMsg.text.split('\n')[0].substring(0, 50);
                                    projects[projIndex].aiName = firstLine;
                                    projects[projIndex].aiDesc = finishedMsg.text.substring(0, 120);
