                }
                if (textEl) textEl.classList.remove('typing-cursor');
                const msg = messages.find(m => m.id === currentAiMessageId);
                if (msg) {
                    if (msg.isProcessing) msg.isProcessing = false;
                    if (msg.isTyping) msg.isTyping = false;
                }
                currentAiMessageId = null;
            }
            renderMessages();
        }

        const GEMINI_PROXY_URL = 'https://clincoo.pages.dev/api/chat';

        // ===== WORKSPACE FILE/FOLDER CRUD (shared store with workspace.html) =====
        const WS_STORAGE_KEY = 'clincoo_workspace_files';

        function wsLoad() {
            try {
                const d = JSON.parse(localStorage.getItem(WS_STORAGE_KEY));
                if (d && typeof d === 'object' && Array.isArray(d.root)) return d;
            } catch (e) {}
            return { 'root': [] };
        }

        function wsSave(data) {
            try {
                localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                return { success: false, error: 'Gagal menyimpan workspace: penyimpanan browser penuh.' };
            }
            return null;
        }

        function wsNormalize(p) {
            let s = String(p || '').trim().replace(/^\/+/, '').replace(/\/+$/, '');
            if (!s || s === 'root') return '';
            if (s.toLowerCase().startsWith('root/')) s = s.substring(5);
            return s.replace(/\/{2,}/g, '/');
        }

        function wsParentInfo(p) {
            const s = wsNormalize(p);
            if (!s) return null;
            const parts = s.split('/').filter(Boolean);
            const name = parts.pop();
            if (!name) return null;
            const folderKey = parts.length > 0 ? parts.join('/') : 'root';
            const itemPath = parts.length > 0 ? folderKey + '/' + name : name;
            return { name, folderKey, itemPath };
        }

        function wsFindItem(data, p) {
            const info = wsParentInfo(p);
            if (!info) return null;
            for (const key of Object.keys(data)) {
                const arr = data[key];
                if (!Array.isArray(arr)) continue;
                for (let i = 0; i < arr.length; i++) {
                    const it = arr[i];
                    if (it && it.path && it.path.toLowerCase() === info.itemPath.toLowerCase()) {
                        return { item: it, index: i, folderKey: key };
                    }
                }
            }
            return null;
        }

        function wsEnsureFolderChain(data, folderKey) {
            if (!Array.isArray(data.root)) data.root = [];
            if (folderKey === 'root') return;
            const parts = folderKey.split('/').filter(Boolean);
            let parent = 'root', cum = '';
            parts.forEach(function(part) {
                cum = cum ? cum + '/' + part : part;
                if (!Array.isArray(data[parent])) data[parent] = [];
                const exists = data[parent].some(function(i) {
                    return i && i.type === 'folder' && i.name.toLowerCase() === part.toLowerCase();
                });
                if (!exists) {
                    data[parent].push({ type: 'folder', name: part, path: cum, fileCount: 0, previewText: 'Folder' });
                }
                if (!Array.isArray(data[cum])) data[cum] = [];
                parent = cum;
            });
        }

        function wsSizeStr(content) {
            const bytes = new Blob([content || '']).size;
            if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            if (bytes > 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return bytes + ' B';
        }

        function wsListItems(args) {
            const data = wsLoad();
            const key = args && args.path ? wsNormalize(args.path) : '';
            const folderKey = key === '' ? 'root' : key;
            const items = data[folderKey];
            if (!Array.isArray(items)) {
                return { success: false, error: 'Folder "' + folderKey + '" tidak ditemukan di workspace.' };
            }
            return {
                success: true,
                folder: folderKey,
                total: items.length,
                items: items.map(function(i) {
                    return { name: i.name, type: i.type, path: i.path, size: i.type === 'file' ? (i.size || '') : (i.previewText || 'Folder') };
                })
            };
        }

        function wsReadFile(args) {
            const path = args && args.path;
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const found = wsFindItem(data, path);
            if (!found) return { success: false, error: 'File "' + path + '" tidak ditemukan.' };
            if (found.item.type !== 'file') return { success: false, error: '"' + path + '" adalah folder, bukan file.' };
            let content = found.item.content || '';
            let truncated = false;
            if (content.length > 60000) { content = content.substring(0, 60000); truncated = true; }
            return {
                success: true,
                name: found.item.name,
                path: found.item.path,
                size: found.item.size || '',
                truncated: truncated,
                content: content,
                note: truncated ? 'Isi file dipotong 60.000 karakter pertama.' : undefined
            };
        }

        function wsWriteFile(args) {
            const path = args && args.path;
            const content = args && typeof args.content === 'string' ? args.content : '';
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const info = wsParentInfo(path);
            if (!info) return { success: false, error: 'Path file tidak valid: ' + path };
            if (info.name.includes('/')) return { success: false, error: 'Nama file tidak boleh mengandung "/".' };
            wsEnsureFolderChain(data, info.folderKey);
            if (!Array.isArray(data[info.folderKey])) data[info.folderKey] = [];
            const sizeStr = wsSizeStr(content);
            const existingIdx = data[info.folderKey].findIndex(function(i) {
                return i && i.type === 'file' && i.name.toLowerCase() === info.name.toLowerCase();
            });
            let created;
            if (existingIdx !== -1) {
                data[info.folderKey][existingIdx].content = content;
                data[info.folderKey][existingIdx].size = sizeStr;
                created = false;
            } else {
                data[info.folderKey].push({ type: 'file', name: info.name, size: sizeStr, path: info.itemPath, content: content });
                created = true;
            }
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: created ? 'created' : 'overwritten', path: info.itemPath, size: sizeStr };
        }

        function wsCreateFolder(args) {
            const path = args && args.path;
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const norm = wsNormalize(path);
            if (!norm) return { success: false, error: 'Path folder tidak valid.' };
            wsEnsureFolderChain(data, norm);
            if (!Array.isArray(data[norm])) data[norm] = [];
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: 'created', path: norm };
        }

        function wsRenameItem(args) {
            const path = args && args.path;
            const newName = args && args.new_name ? String(args.new_name).trim() : '';
            if (!path || !newName) return { success: false, error: 'Parameter path dan new_name wajib.' };
            if (newName.includes('/')) return { success: false, error: 'Nama baru tidak boleh mengandung "/".' };
            const data = wsLoad();
            const found = wsFindItem(data, path);
            if (!found) return { success: false, error: 'Item "' + path + '" tidak ditemukan.' };
            const items = data[found.folderKey] || [];
            const dupe = items.some(function(i) { return i !== found.item && i.name.toLowerCase() === newName.toLowerCase(); });
            if (dupe) return { success: false, error: 'Nama "' + newName + '" sudah digunakan di folder yang sama.' };
            const item = found.item;
            const oldPath = item.path;
            const parentKey = found.folderKey;
            const newPath = parentKey === 'root' ? newName : parentKey + '/' + newName;
            if (item.type === 'folder') {
                Object.keys(data).forEach(function(key) {
                    if (key === oldPath || key.startsWith(oldPath + '/')) {
                        const newKey = newPath + key.substring(oldPath.length);
                        data[newKey] = data[key];
                        delete data[key];
                        if (Array.isArray(data[newKey])) {
                            data[newKey].forEach(function(child) {
                                if (child.path && child.path.startsWith(oldPath + '/')) {
                                    child.path = newPath + child.path.substring(oldPath.length);
                                }
                            });
                        }
                    }
                });
            }
            item.name = newName;
            item.path = newPath;
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: 'renamed', old_path: oldPath, new_path: newPath };
        }

        function wsDeleteItem(args) {
            const path = args && args.path;
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const found = wsFindItem(data, path);
            if (!found) return { success: false, error: 'Item "' + path + '" tidak ditemukan.' };
            const item = found.item;
            const items = data[found.folderKey] || [];
            if (item.type === 'folder') {
                Object.keys(data).forEach(function(key) {
                    if (key === item.path || key.startsWith(item.path + '/')) {
                        delete data[key];
                    }
                });
            }
            items.splice(found.index, 1);
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: 'deleted', path: item.path, type: item.type };
        }

        function wsSearchItems(args) {
            const query = args && args.query ? String(args.query).toLowerCase().trim() : '';
            if (!query) return { success: false, error: 'Parameter query wajib.' };
            const data = wsLoad();
            const matches = [];
            Object.keys(data).forEach(function(key) {
                (data[key] || []).forEach(function(i) {
                    if (i && i.name && i.name.toLowerCase().includes(query)) {
                        matches.push({ name: i.name, type: i.type, path: i.path, size: i.type === 'file' ? (i.size || '') : '' });
                    }
                });
            });
            return { success: true, query: query, total: matches.length, items: matches.slice(0, 100) };
        }

        function executeWorkspaceTool(name, args) {
            try {
                switch (name) {
                    case 'list_items': return wsListItems(args);
                    case 'read_file': return wsReadFile(args);
                    case 'write_file': return wsWriteFile(args);
                    case 'create_folder': return wsCreateFolder(args);
                    case 'rename_item': return wsRenameItem(args);
                    case 'delete_item': return wsDeleteItem(args);
                    case 'search_items': return wsSearchItems(args);
                    default: return { success: false, error: 'Tool tidak dikenal: ' + name };
                }
            } catch (e) {
                return { success: false, error: 'Gagal menjalankan tool: ' + (e && e.message ? e.message : String(e)) };
            }
        }
        // ===== END WORKSPACE CRUD =====
        const PREFERRED_MODELS = [
            "gemini-3.6-flash",
            "gemini-3-flash-preview",
            "gemini-2.5-flash",
            "gemini-2.0-flash",
            "gemini-1.5-flash"
        ];

        window.retryGeneration = function(msgId) {
            const index = messages.findIndex(m => m.id === msgId || m.id.toString() === msgId);
            if (index !== -1) messages.splice(index, 1);
            renderMessages();
            fetchAIResponse();
        };

        function checkRequiresSearch(text) {
            const t = text.toLowerCase();
            const keywords = ['berita terbaru', 'hari ini', 'harga saham', 'cuaca hari ini', 'jadwal pertandingan', 'skor pertandingan', 'update terkini', 'berita terkini', 'cari di internet', 'penemuan terbaru 20', 'kasus terbaru'];
            return keywords.some(k => t.includes(k));
        }

        function checkRequiresImageGeneration(text) {
            const t = text.toLowerCase();
            const keywords = ['buatkan gambar', 'bikin gambar', 'buat gambar', 'generate image', 'tolong gambar', 'lukiskan'];
            return keywords.some(k => t.includes(k));
        }

        function checkIsTimeQuery(text) {
            const t = text.toLowerCase();
            const timeKeywords = ['jam berapa', 'waktu sekarang', 'pukul berapa', 'tanggal berapa', 'hari apa', 'bulan apa', 'tahun berapa', 'sekarang jam'];
            return timeKeywords.some(k => t.includes(k));
        }

        async function fetchAIResponse() {
            toggleActionState(true);
            autoScrollActive = true;
            
            const lastUserMsgObj = [...messages].reverse().find(m => m.role === 'user');
            const lastUserMsg = lastUserMsgObj?.text || "";
            const hasAttachment = lastUserMsgObj?.attachments && lastUserMsgObj.attachments.length > 0;
            
            const urlRegex = /(https?:\/\/[^\s]+)|(\b[a-zA-Z0-9-]+\.(com|id|net|dev|org|ai|io|co|tech|edu|gov)(?:\/[^\s]*)?\b)/gi;
            let extractedUrls = lastUserMsg.match(urlRegex);
            let hasUrl = false;
            
            if (extractedUrls && extractedUrls.length > 0) {
                hasUrl = true;
                if (!extractedUrls[0].startsWith('http')) {
                    extractedUrls[0] = 'https://' + extractedUrls[0];
                }
            }
            
            const isTimeQuery = !hasUrl && checkIsTimeQuery(lastUserMsg);
            const requiresSearch = !hasUrl && !isTimeQuery && checkRequiresSearch(lastUserMsg);
            const requiresImage = !hasUrl && !hasAttachment && checkRequiresImageGeneration(lastUserMsg);

            let processType = 'think';
            if (hasUrl) processType = 'read';
            else if (requiresImage) processType = 'image';
            else if (requiresSearch) processType = 'search';
            else if (hasAttachment) processType = 'file';

            const aiMsgObj = { 
                id: generateId(), 
                role: 'ai', 
                text: '', 
                isProcessing: true,
                isTyping: false,
                processType: processType
            };
            messages.push(aiMsgObj);
            renderMessages();
            
            currentAiMessageId = aiMsgObj.id;
            abortController = new AbortController();

            const thinkingSteps = ["Thinking..."];
            const searchSteps = ["Searching..."];
            const readSteps = ["Menganalisis..."];
            const fileSteps = ["Menganalisis..."];
            const imageSteps = ["Menganalisis..."];

            let currentSteps = thinkingSteps;
            if (processType === 'search') currentSteps = searchSteps;
            else if (processType === 'read') currentSteps = readSteps;
            else if (processType === 'file') currentSteps = fileSteps;
            else if (processType === 'image') currentSteps = imageSteps;

            let stepIndex = 0;
            const statusInterval = setInterval(() => {
                const statusEl = document.getElementById(`status-text-${aiMsgObj.id}`);
                if (statusEl) {
                    if (currentSteps.length > 1) {
                        stepIndex = (stepIndex + 1) % currentSteps.length;
                        statusEl.classList.add('opacity-0');
                        setTimeout(() => {
                            statusEl.innerText = currentSteps[stepIndex];
                            statusEl.classList.remove('opacity-0');
                        }, 250);
                    }
                } else {
                    clearInterval(statusInterval);
                }
            }, 2000);
            currentStatusInterval = statusInterval;

            let streamingBuffer = "";
            let isFetchComplete = false;
            let charIndex = 0;
            let hasReceivedData = false;

            const apiTimeout = setTimeout(() => {
                if (!hasReceivedData) {
                    if (!aiMsgObj._retried) {
                        aiMsgObj._retried = true;
                        stopGeneration();
                        setTimeout(() => retryGeneration(aiMsgObj.id), 500);
                    } else {
                        const index = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (index !== -1) {
                            messages[index].text = `Sedang memuat... <span onclick="retryGeneration('${aiMsgObj.id}')" class="cursor-pointer underline font-medium" style="text-underline-offset: 3px;">ketuk untuk melanjutkan</span>`;
                            messages[index].isError = true;
                        }
                        stopGeneration();
                    }
                }
            }, 90000); 

            if (requiresImage) {
                try {
                    clearTimeout(apiTimeout); 
                    const promptStr = lastUserMsg.replace(/buatkan gambar|bikin gambar|buat gambar|generate image|tolong gambar|lukiskan/gi, '').trim();
                    const finalPrompt = promptStr || lastUserMsg;
                    const safePrompt = encodeURIComponent(finalPrompt);
                    const seed = Math.floor(Math.random() * 1000000);
                    const imageUrl = `https://image.pollinations.ai/prompt/${safePrompt}?seed=${seed}&nologo=true`;
                    
                    imageGenerationTimeout = setTimeout(() => {
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) {
                            messages[msgIndex].text = `<div class="flex justify-center w-full my-2 pointer-events-auto"><img src="${imageUrl}" class="w-full max-w-sm rounded-xl shadow-[0_5px_15px_rgba(0,0,0,0.1)] border border-gray-200" alt="Generated Image" loading="lazy" onload="scrollToBottom(true)"></div>`;
                            messages[msgIndex].isProcessing = false;
                            messages[msgIndex].isTyping = false;
                            messages[msgIndex].isImageResponse = true;
                            messages[msgIndex].imageUrl = imageUrl;
                        }
                        stopGeneration();
                    }, 3500);
                    return; 
                } catch (e) {
                    clearTimeout(apiTimeout);
                    if (e.name !== 'AbortError') {
                        streamingBuffer = "Terjadi kesalahan sistem saat memproses permintaan gambar Anda.";
                        isFetchComplete = true;
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) messages[msgIndex].isError = true;
                        }
                    }
                }
            } 
            else {
                let externalContext = "";
                const JINA_PROXY_URL = 'https://clincoo.pages.dev/api/jina';
                
                if (hasUrl) {
                    try {
                        const targetUrl = extractedUrls[0];
                        const res = await fetch(JINA_PROXY_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'read', query: targetUrl }),
                            signal: abortController.signal
                        });
                        if (res.ok) {
                            const resJson = await res.json();
                            const markdown = resJson.text || '';
                            externalContext = `[DATA REAL-TIME DARI WEB]:\nSumber URL: ${targetUrl}\nIsi Konten URL:\n\n${markdown.substring(0, 15000)}\n\n[PENTING]: Gunakan informasi di atas untuk merespons karena ini adalah data dari situs terbaru yang diminta pengguna.`;
                            
                            const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                            if (msgIndex !== -1) {
                                try {
                                    const u = new URL(targetUrl);
                                    const domain = u.hostname.replace(/^www\./, '');
                                    messages[msgIndex].sources = [{
                                        url: targetUrl,
                                        domain: domain,
                                        favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
                                    }];
                                } catch(e) {}
                            }
                        }
                    } catch (e) {}
                } 
                else if (requiresSearch) {
                    try {
                        const res = await fetch(JINA_PROXY_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'search', query: lastUserMsg }),
                            signal: abortController.signal
                        });
                        
                        if (res.ok) {
                            const resJson = await res.json();
                            const json = resJson.data || {};
                            if (json.data && json.data.length > 0) {
                                let markdownContent = '';
                                const sources = [];
                                const seenDomains = new Set();

                                json.data.forEach(item => {
                                    if(item.title && item.content) {
                                        markdownContent += `### ${item.title}\nURL: ${item.url}\n\n${item.content}\n\n`;
                                    }
                                    try {
                                        if (item.url) {
                                            const u = new URL(item.url);
                                            const domain = u.hostname.replace(/^www\./, '');
                                            if (!seenDomains.has(domain)) {
                                                seenDomains.add(domain);
                                                sources.push({
                                                    url: item.url,
                                                    domain: domain,
                                                    favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
                                                });
                                            }
                                        }
                                    } catch(e) {}
                                });

                                if (markdownContent.length > 50) {
                                    externalContext = `[HASIL PENCARIAN WEB REAL-TIME TERBARU]:\n\n${markdownContent.substring(0, 15000)}\n\n[INSTRUKSI WAJIB]: Kamu WAJIB menyusun jawaban berdasarkan hasil pencarian real-time di atas. Jangan menebak jawaban jika data sudah tersedia.`;
                                    
                                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                                    if (msgIndex !== -1) {
                                        messages[msgIndex].sources = sources;
                                    }
                                }
                            }
                        }
                    } catch (e) {}
                }
                
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' };
                const formattedDate = now.toLocaleDateString('id-ID', options);
                const timeContext = `\n\n[INFO SISTEM (REAL-TIME)]: Saat ini adalah ${formattedDate}. Jika user meminta data hari ini atau yang terbaru, WAJIB utamakan Konteks Pencarian Web yang disuntikkan ke prompt ini agar jawaban akurat sesuai kondisi masa kini.`;
                
                const systemInstructions = 'Kamu adalah Clincoo, Superagent AI yang sangat cerdas, ramah, dan membantu. Jawablah menggunakan bahasa Indonesia yang natural dan mudah dipahami, kecuali diminta lain. Gunakan format Markdown untuk menyusun jawaban agar lebih rapi dan terstruktur. Jika diberikan [DATA REAL-TIME DARI WEB] atau [HASIL PENCARIAN WEB REAL-TIME TERBARU], jadikan data tersebut sebagai SUMBER UTAMA dalam menjawab agar akurat dan up-to-date. Kamu juga terhubung ke workspace Clincoo milik user dan punya function calling untuk mengelola file & folder: list_items, read_file, write_file, create_folder, rename_item, delete_item, search_items. Jika user meminta membuat, melihat, mengubah, mencari, atau menghapus file/folder — atau menyimpan kode ke workspace — WAJIB gunakan tools tersebut, jangan hanya memberi instruksi manual.';
                
                try {
                    const apiMessages = [
                        { role: 'system', content: systemInstructions + timeContext + (externalContext ? `\n\n${externalContext}` : '') }
                    ];

                    const historyMsgs = messages.filter(m => !m.isHidden && m.id !== aiMsgObj.id);
                    historyMsgs.forEach(m => {
                        let content = [];
                        if (m.text) {
                            content.push({ type: "text", text: m.text });
                        }
                        if (m.attachments && m.attachments.length > 0) {
                            m.attachments.forEach(att => {
                                if (att.type === 'document' && att.text) {
                                    content.push({ type: "text", text: `\n\n[Isi Dokumen Lampiran (${att.name})]:\n${att.text.substring(0, 10000)}` });
                                } else if (att.type === 'image') {
                                    content.push({ type: "image_url", image_url: { url: att.data } });
                                }
                            });
                        }
                        
                        const finalContent = content.length === 1 && content[0].type === 'text' ? content[0].text : (content.length > 0 ? content : m.text || ".");
                        apiMessages.push({ role: m.role === 'ai' ? 'assistant' : 'user', content: finalContent });
                    });

                    // Loop function-calling: AI bisa memanggil tools workspace CRUD beberapa kali
                    // sebelum menghasilkan jawaban final.
                    let response = null;
                    let resultJson = null;
                    let hopError = null;
                    const apiMessagesWithTools = apiMessages.slice();
                    const MAX_TOOL_HOPS = 6;

                    for (let hop = 0; hop < MAX_TOOL_HOPS; hop++) {
                        if (!isGenerating) throw new DOMException('Aborted', 'AbortError');
                        try {
                            response = await fetch(GEMINI_PROXY_URL, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    messages: apiMessagesWithTools,
                                    session_id: currentSessionId || undefined,
                                    project_id: currentProjectId || undefined,
                                    workspace_tools: true,
                                    save_user_message: hop === 0
                                }),
                                signal: abortController.signal
                            });
                        } catch (err) {
                            if (err.name === 'AbortError') throw err;
                            response = null;
                        }

                        if (!response || !response.ok) {
                            let errDetail = '';
                            let quotaHit = false;
                            if (response) {
                                try { const errJson = await response.json(); errDetail = errJson.error || ''; quotaHit = !!errJson.quota_exhausted; } catch(e) {}
                            }
                            hopError = new Error(quotaHit ? '__QUOTA__' : (errDetail || `Proxy AI HTTP error! status: ${response ? response.status : 'No response'}`));
                            break;
                        }

                        resultJson = await response.json();
                        if (resultJson.session_id) currentSessionId = resultJson.session_id;

                        // Tidak ada tool call → jawaban final, keluar dari loop
                        if (!resultJson.tool_calls || resultJson.tool_calls.length === 0) break;

                        // Eksekusi tool workspace secara lokal (localStorage browser)
                        const assistantToolParts = resultJson.tool_calls.map(function(tc) {
                            return { type: 'function_call', name: tc.name, args: tc.args || {} };
                        });
                        apiMessagesWithTools.push({ role: 'assistant', content: assistantToolParts });

                        const functionResponses = resultJson.tool_calls.map(function(tc) {
                            const result = (tc.result !== undefined && tc.result !== null)
                                ? tc.result
                                : executeWorkspaceTool(tc.name, tc.args || {});
                            return { type: 'function_response', name: tc.name, result: result };
                        });
                        apiMessagesWithTools.push({ role: 'user', content: functionResponses });
                    }

                    if (hopError) throw hopError;

                    hasReceivedData = true;
                    if (quotaLocked) setQuotaLock(false);
                    clearTimeout(apiTimeout);
                    clearInterval(statusInterval);

                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (msgIndex !== -1 && messages[msgIndex].isProcessing) {
                        messages[msgIndex].isProcessing = false;
                        messages[msgIndex].isTyping = true;
                    }

                    if (resultJson && resultJson.session_id) currentSessionId = resultJson.session_id;
                    streamingBuffer += (resultJson && resultJson.text ? resultJson.text : "");
                    isFetchComplete = true;
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        if (e.message === '__QUOTA__') {
                            streamingBuffer = "Kuota AI Gemini sedang habis untuk saat ini (limit penggunaan harian). Pesanmu sudah dikembalikan ke kolom ketik — klik ikon gembok untuk mencoba kirim ulang, atau tunggu sebentar dan coba lagi.";
                            const lastUserIdx = messages.map(m => m.role).lastIndexOf('user');
                            if (lastUserIdx !== -1 && !chatInput.value.trim()) {
                                chatInput.value = messages[lastUserIdx].text || '';
                                messages.splice(lastUserIdx, 1);
                                renderMessages();
                                adjustInputHeight();
                            }
                            setQuotaLock(true);
                        } else {
                        streamingBuffer = "Maaf, terjadi kesalahan: " + (e.message || "Gagal menghubungi server AI") + ". Silakan coba lagi nanti.";
                        isFetchComplete = true;
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) messages[msgIndex].isError = true;
                    }
                }
            }

            if (!isGenerating || !currentAiMessageId) return;
            if (typingInterval) clearInterval(typingInterval);

            let localText = "";
            typingInterval = setInterval(() => {
                if (charIndex < streamingBuffer.length) {
                    const diff = streamingBuffer.length - charIndex;
                    
                    let charsToProcess = Math.max(2, Math.floor(diff / 2));
                    if (diff > 50) charsToProcess = Math.max(20, Math.floor(diff / 1.5));
                    
                    localText += streamingBuffer.substring(charIndex, charIndex + charsToProcess);
                    charIndex += charsToProcess;
                    
                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (msgIndex !== -1) {
                        messages[msgIndex].text = localText;
                        const textEl = document.getElementById(`msg-text-${aiMsgObj.id}`);
                        if (textEl) {
                            textEl.innerHTML = formatMarkdown(balanceMarkdown(messages[msgIndex].text));
                            textEl.classList.add('typing-cursor');
                        }
                    }
                    scrollToBottom(false);
                } else if (isFetchComplete && charIndex >= streamingBuffer.length) {
                    stopGeneration();
                }
            }, 15);
        }

        function handleSubmit() {
            const val = chatInput.value.trim();
            if ((!val && currentAttachments.length === 0) || isGenerating) return;

            if (isGenerating) stopGeneration();
            
            const attachmentsToKeep = [...currentAttachments];
            currentAttachments = [];
            showAttachmentPreview();

            const userMsg = { id: generateId(), role: 'user', text: val, attachments: attachmentsToKeep };
            messages.push(userMsg);
            
            chatInput.value = '';
            adjustInputHeight();
            
            autoScrollActive = true; 
            renderMessages();
            scrollToBottom(true);
            
            fetchAIResponse();
        }

        window.handlePromptClick = function(text) {
            chatInput.value = text;
            adjustInputHeight();
            handleSubmit();
        };

        btnAction.addEventListener('click', (e) => {
            e.preventDefault();
            if (quotaLocked && !isGenerating) {
                setQuotaLock(false);
                handleSubmit();
                return;
            }
            if (isGenerating) {
                stopGeneration();
                const currentMsg = messages.find(m => m.id === currentAiMessageId);
                if (currentMsg) {
                    currentMsg.isProcessing = false;
                    currentMsg.isTyping = false;
                    renderMessages();
                }
            } else {
                handleSubmit();
            }
        });
        
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (quotaLocked) return;
                handleSubmit();
            }
        });

        renderMessages();
        
        // Safety: reset generation state on fresh load
        if (isGenerating) { toggleActionState(false); }
        if (abortController) { abortController = null; }
        if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
        if (currentStatusInterval) { clearInterval(currentStatusInterval); currentStatusInterval = null; }
        if (currentAiMessageId) { currentAiMessageId = null; }

        // Handoff & riwayat chat: load dari D1, replay prompt hanya untuk percakapan baru
        (function() {
            try {
                var handoffMsg = localStorage.getItem('clincoo_current_chat_msg');
                var handoffProjectId = localStorage.getItem('clincoo_current_project_id');
                var urlProjectId = new URLSearchParams(window.location.search).get('id');
                if (urlProjectId || handoffProjectId) {
                    currentProjectId = urlProjectId || handoffProjectId;
                }

                var submitHandoff = function() {
                    localStorage.removeItem('clincoo_current_chat_msg');
                    setTimeout(function() {
                        try {
                            chatInput.value = handoffMsg;
                            adjustInputHeight();
                            handleSubmit();
                        } catch(e) { console.error('Handoff submit error:', e); }
                    }, 500);
                };

                // render cache lokal dulu biar chat muncul instan
                var cachedData = null;
                try { cachedData = JSON.parse(localStorage.getItem('clincoo_chat_cache') || 'null'); } catch(e) {}
                var cacheSig = '';
                if (cachedData && cachedData.msgs && cachedData.msgs.length) {
                    currentSessionId = cachedData.sessionId || null;
                    cachedData.msgs.forEach(function(m) { messages.push({ id: 'cache_' + messages.length, role: m.role, text: m.text }); });
                    renderMessages();
                    autoScrollActive = true;
                    scrollToBottom(true);
                    cacheSig = (cachedData.sessionId || '') + '|' + cachedData.msgs.length + '|' + (cachedData.msgs[cachedData.msgs.length - 1].text || '').slice(0, 200);
                }

                var historyUrl = currentProjectId
                    ? GEMINI_PROXY_URL + '?project_id=' + encodeURIComponent(currentProjectId)
                    : GEMINI_PROXY_URL;

                fetch(historyUrl, { method: 'GET' })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        var sessions = (data && data.sessions) || [];
                        if (!sessions.length) {
                            if (handoffMsg && handoffMsg.trim()) submitHandoff();
                            return;
                        }
                        return fetch(GEMINI_PROXY_URL + '?session_id=' + encodeURIComponent(sessions[0].id), { method: 'GET' })
                            .then(function(res) { return res.json(); })
                            .then(function(d) {
                                var dbMsgs = (d && d.messages) || [];
                                if (!dbMsgs.length) {
                                    if (handoffMsg && handoffMsg.trim()) submitHandoff();
                                    return;
                                }
                                var freshSig = sessions[0].id + '|' + dbMsgs.length + '|' + ((dbMsgs[dbMsgs.length - 1] && dbMsgs[dbMsgs.length - 1].content) || '').slice(0, 200);
                                if (freshSig === cacheSig) {
                                    if (handoffMsg && handoffMsg.trim()) submitHandoff();
                                    return;
                                }
                                currentSessionId = sessions[0].id;
                                localStorage.removeItem('clincoo_current_chat_msg');
                                localStorage.removeItem('clincoo_current_project_id');
                                messages.length = 0;
                                dbMsgs.forEach(function(m) {
                                    messages.push({ id: 'db_' + m.id, role: m.role === 'assistant' ? 'ai' : 'user', text: m.content });
                                });
                                renderMessages();
                                autoScrollActive = true;
                                scrollToBottom(true);
                            });
                    })
                    .catch(function(e) {
                        console.error('History load error:', e);
                        if (handoffMsg && handoffMsg.trim()) submitHandoff();
                    });
            } catch(e) { console.error('Handoff error:', e); }
        })();
        setTimeout(() => {
            chatInput.focus();
            autoScrollActive = true;
            scrollToBottom(true);
        }, 300);

        const sessionOptionsPopup = document.getElementById('session-options-popup');
        window.openSessionOptions = function(btnElement) {
            const rect = btnElement.getBoundingClientRect();
            sessionOptionsPopup.innerHTML = `
                <button onclick="clearChat(); closeSessionOptions();" class="w-full text-left px-3 py-2 text-sm text-red-500 hover:bg-red-50 rounded-lg flex items-center gap-2">
                    <i class="ph ph-trash text-lg"></i> Hapus Sesi
                </button>
            `;
            sessionOptionsPopup.style.top = `${rect.bottom + 8}px`;
            sessionOptionsPopup.style.left = `${rect.right - 160}px`;
            sessionOptionsPopup.classList.remove('hidden');
        };

        window.closeSessionOptions = function() {
            sessionOptionsPopup.classList.add('hidden');
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#session-options-popup') && !e.target.closest('.ph-dots-three-vertical')) {
                closeSessionOptions();
            }
        });
    </script>
<script>
(function(){
  var path=window.location.pathname.split('/').pop()||'chat.html';
  var links=document.querySelectorAll('.sidebar-nav-link');
  links.forEach(function(link){
    var href=link.getAttribute('href');
    if(href===path){
      link.classList.add('bg-gray-50','text-gray-900');
      link.classList.remove('hover:bg-gray-50','text-gray-700');
      var icon=link.querySelector('i');
      if(icon){
        icon.className=icon.className.replace('ph ph-','ph-fill ph-');
        icon.classList.remove('text-gray-500');
        icon.classList.add('text-gray-900');
      }
      var svg=link.querySelector('svg');
      if(svg){
        svg.classList.remove('text-gray-500');
        svg.classList.add('text-gray-900');
      }
    }
  });
})();
</script>
</body>
