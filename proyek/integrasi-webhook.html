<body class="text-gray-900 antialiased h-screen w-full overflow-hidden relative bg-white">
  <script>(function(){var t=localStorage.getItem("clincoo_theme")||"Sistem (Default)";var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>
  <div class="w-full h-full overflow-y-auto hide-scrollbar flex flex-col items-center">
    <header class="w-full max-w-5xl z-30 p-4 sm:px-6 flex items-center gap-3 flex-shrink-0 border-b border-gray-200/60 dark:border-slate-800">
      <button onclick="history.back()" class="p-2 -ml-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-800 transition-colors flex items-center justify-center text-gray-800 dark:text-gray-100" aria-label="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold text-gray-800 dark:text-white tracking-tight">Integrasi & Webhook</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Kelola integrasi pihak ketiga dan webhook</p>
      </div>
    </header>
    <main class="w-full max-w-5xl px-4 sm:px-6 py-4 pb-24">
      <div class="w-full flex flex-col divide-y divide-gray-200 dark:divide-slate-700/60">
        <div class="py-5">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h4 class="text-base font-semibold text-gray-900 dark:text-white">Webhook Endpoints</h4>
              <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">URL yang menerima notifikasi event</p>
            </div>
            <button onclick="addWebhookRow()" class="px-3 py-1.5 text-xs font-medium text-blue-600 border border-blue-200 dark:border-blue-900/50 hover:bg-blue-50 dark:hover:bg-blue-950/30 rounded-lg transition-colors cursor-pointer flex items-center gap-1.5">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
              Tambah
            </button>
          </div>
          <div id="webhook-list" class="space-y-2">
            <div class="flex gap-2 items-center">
              <input type="text" value="https://hooks.slack.com/services/..." class="flex-1 px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-slate-600 focus:outline-none font-mono" placeholder="URL Webhook">
              <select class="px-2 py-2 text-xs rounded-lg border border-gray-300 dark:border-slate-600 focus:outline-none cursor-pointer"><option>POST</option><option>PUT</option><option>GET</option></select>
              <button onclick="this.parentElement.remove();showActionButtons()" class="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3" /></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <h4 class="text-base font-semibold text-gray-900 dark:text-white">Event Deploy</h4>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Kirim notifikasi saat deploy berhasil atau gagal</p>
          </div>
          <div class="w-full sm:w-80">
            <select class="w-full px-3.5 py-2 text-sm rounded-lg border border-gray-300 dark:border-slate-600 focus:outline-none cursor-pointer"><option value="all" selected>Semua event</option><option value="success">Hanya sukses</option><option value="fail">Hanya gagal</option><option value="none">Nonaktif</option></select>
          </div>
        </div>
        <div class="py-5 flex items-center justify-between gap-4">
          <div class="min-w-0 flex-1">
            <h4 class="text-base font-semibold text-gray-900 dark:text-white">Retry Otomatis</h4>
            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Coba ulang pengiriman webhook yang gagal</p>
          </div>
          <button type="button" onclick="toggleSwitch('retryHook')" class="relative flex-shrink-0 cursor-pointer focus:outline-none">
            <div id="retryHook-bg" class="w-11 h-6 bg-blue-500 rounded-full transition-colors duration-200 ease-in-out"></div>
            <div id="retryHook-knob" class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full shadow transition-transform duration-200 ease-in-out translate-x-5"></div>
          </button>
        </div>
      </div>
      <div id="action-buttons" class="mt-8 pt-6 border-t border-gray-200 dark:border-slate-700/60 hidden justify-end gap-3 opacity-0 transition-opacity duration-300">
        <button type="button" onclick="cancelChanges()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors">Batal</button>
        <button type="button" onclick="saveChanges()" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors focus:outline-none">Simpan Perubahan</button>
      </div>
    </main>
  </div>
  <script>
    let isEdited=false;function showActionButtons(){if(!isEdited){isEdited=true;const c=document.getElementById('action-buttons');c.classList.remove('hidden');c.classList.add('flex');void c.offsetWidth;c.classList.remove('opacity-0');c.classList.add('opacity-100');}}function cancelChanges(){window.location.reload();}function saveChanges(){const btn=document.querySelector('#action-buttons button.bg-blue-600');if(!btn)return;btn.innerText='Menyimpan...';btn.disabled=true;btn.classList.add('opacity-80','cursor-not-allowed');setTimeout(()=>{btn.innerText='Tersimpan!';btn.classList.replace('bg-blue-600','bg-emerald-500');btn.classList.replace('hover:bg-blue-700','hover:bg-emerald-600');setTimeout(()=>window.location.reload(),800);},800);}document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('input,textarea,select').forEach(input=>{input.addEventListener('input',showActionButtons);input.addEventListener('change',showActionButtons);});});function toggleSwitch(idPrefix){showActionButtons();const bg=document.getElementById(idPrefix+'-bg');const knob=document.getElementById(idPrefix+'-knob');if(bg.classList.contains('bg-blue-500')){bg.classList.replace('bg-blue-500','bg-gray-200');bg.classList.add('dark:bg-slate-700');knob.classList.remove('translate-x-5');}else{bg.classList.remove('bg-gray-200','dark:bg-slate-700');bg.classList.add('bg-blue-500');knob.classList.add('translate-x-5');}}
  </script>
</body>
