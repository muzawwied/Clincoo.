                    <a href="pages/laporkan-bug.html" class="w-full flex items-center px-6 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100 group">
                        <i data-lucide="bug" class="w-5 h-5 text-gray-500 mr-4 group-hover:text-gray-900 transition-colors"></i>
                        <span class="text-[15px] font-medium text-gray-800 group-hover:text-gray-900">Laporkan bug</span>
                    </a>
                    <a href="pages/tentang.html" class="w-full flex items-center px-6 py-3.5 hover:bg-gray-50 transition-colors active:bg-gray-100 group">
                        <i data-lucide="info" class="w-5 h-5 text-gray-500 mr-4 group-hover:text-gray-900 transition-colors"></i>
                        <span class="text-[15px] font-medium text-gray-800 group-hover:text-gray-900">Tentang</span>
                    </a>

            </div>
            <div>
                <div class="flex flex-col w-full">
                    <a href="pages/keluar.html" class="w-full flex items-center px-6 py-3.5 hover:bg-red-50 transition-colors active:bg-red-100 group">
                        <i data-lucide="log-out" class="w-5 h-5 text-red-500 mr-4 group-hover:text-red-600 transition-colors"></i>
                        <span class="text-[15px] font-medium text-red-500 group-hover:text-red-600">Keluar</span>
                    </a>
                </div>
            </div>
        </div>
    </main>    <script>
        lucide.createIcons();
        let currentThemeMode = 'Sistem (Default)';
        let currentAccentName = 'Hitam (Default)';
        try {
            currentThemeMode = localStorage.getItem('clincoo_theme') || 'Sistem (Default)';
            currentAccentName = localStorage.getItem('clincoo_accent') || 'Hitam (Default)';
        } catch(e) {}
        function applyTheme() {
            const isDark = (currentThemeMode === 'Gelap') || 
                           (currentThemeMode === 'Sistem (Default)' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }
        function setTheme(themeName) {
            currentThemeMode = themeName;
            try { localStorage.setItem('clincoo_theme', themeName); } catch(e) {}
            const themeStatusText = document.getElementById('theme-status-text');
            const themeMenu = document.getElementById('theme-dropdown-menu');
            if (themeStatusText) {
                themeStatusText.textContent = themeName;
            }
            applyTheme();
            if (themeMenu) themeMenu.classList.add('hidden');
        }
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (currentThemeMode === 'Sistem (Default)') {
                    applyTheme();
                }
            });
        }
        const accentMap = {
            'Hitam (Default)': { main: '#000000', hover: '#1f2937', cls: 'bg-gray-900' },
            'Biru': { main: '#2563eb', hover: '#1d4ed8', cls: 'bg-blue-600' },
            'Hijau': { main: '#059669', hover: '#047857', cls: 'bg-emerald-600' },
            'Ungu': { main: '#9333ea', hover: '#7e22ce', cls: 'bg-purple-600' },
            'Merah': { main: '#dc2626', hover: '#b91c1c', cls: 'bg-red-600' }
        };
        function setAccent(name, bgClass) {
            currentAccentName = name;
            try { localStorage.setItem('clincoo_accent', name); } catch(e) {}
            const accentName = document.getElementById('accent-name');
            const accentDot = document.getElementById('accent-dot');
            const accentMenu = document.getElementById('accent-dropdown-menu');
            if (accentName) accentName.textContent = name;
            if (accentDot) {
                accentDot.className = `w-2 h-2 rounded-full ${bgClass || accentMap[name].cls}`;
            }
            const colors = accentMap[name] || accentMap['Hitam (Default)'];
            document.documentElement.style.setProperty('--accent-color', colors.main);
            document.documentElement.style.setProperty('--accent-hover', colors.hover);
            if (accentMenu) accentMenu.classList.add('hidden');
        }
        const profileInput = document.getElementById('profile-pic-input');
        const profileDisplay = document.getElementById('profile-pic-display');
        try {
            const savedPic = localStorage.getItem('clincoo_profile_pic');
            if(savedPic && profileDisplay) {
                profileDisplay.style.backgroundImage = `url(${savedPic})`;
                profileDisplay.textContent = '';
            }
        } catch(e) {}

        // Sync name and email from localStorage (shared with personal.html)
        try {
            const savedName = localStorage.getItem('clincoo_fullname');
            const savedEmail = localStorage.getItem('clincoo_email');
            const nameEl = document.getElementById('profile-display-name');
            const emailEl = document.getElementById('profile-display-email');
            if (savedName && nameEl) nameEl.textContent = savedName;
            if (savedEmail && emailEl) emailEl.textContent = savedEmail;
            // Update avatar initial if name exists
            if (savedName && profileDisplay && !profileDisplay.style.backgroundImage) {
                profileDisplay.textContent = savedName.charAt(0).toUpperCase();
            }
        } catch(e) {}

        if (profileInput) {
            profileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64 = event.target.result;
                        try { localStorage.setItem('clincoo_profile_pic', base64); } catch(err) {}
                        if (profileDisplay) {
                            profileDisplay.style.backgroundImage = `url(${base64})`;
                            profileDisplay.textContent = '';
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        const themeBtn = document.getElementById('theme-dropdown-btn');
        const themeMenu = document.getElementById('theme-dropdown-menu');
        if (themeBtn && themeMenu) {
            themeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                themeMenu.classList.toggle('hidden');
                const accentMenu = document.getElementById('accent-dropdown-menu');
                if (accentMenu) accentMenu.classList.add('hidden');
            });
        }
        const accentBtn = document.getElementById('accent-dropdown-btn');
        const accentMenu = document.getElementById('accent-dropdown-menu');
        if (accentBtn && accentMenu) {
            accentBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                accentMenu.classList.toggle('hidden');
                if (themeMenu) themeMenu.classList.add('hidden');
            });
        }
        document.addEventListener('click', (e) => {
            if (themeMenu && !themeMenu.contains(e.target) && themeBtn && !themeBtn.contains(e.target)) {
                themeMenu.classList.add('hidden');
            }
            if (accentMenu && !accentMenu.contains(e.target) && accentBtn && !accentBtn.contains(e.target)) {
                accentMenu.classList.add('hidden');
            }
        });
    </script>
</body>
