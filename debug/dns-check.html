<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Debug DNS 2 — Clincoo</title>
</head>
<body style="font-family: monospace; background:#000; color:#0f0; padding:16px; word-break: break-all;">
<pre id="out">memulai...</pre>
<script src="../js/auth-client.js?v=2"></script>
<script>
(async function () {
  const out = [];
  const log = (k, v) => { try { out.push(k + ': ' + (typeof v === 'string' ? v : JSON.stringify(v))); } catch (e) { out.push(k + ': <unserializable>'); } };
  const base = 'https://clincoo-be2.pages.dev/api';
  const pid = localStorage.getItem('clincoo_current_project_id') || '';
  const tok = localStorage.getItem('clincoo_auth_token') || '';

  async function timedFetch(label, url, headers) {
    const t0 = performance.now();
    try {
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 6000);
      const res = await fetch(url, { headers, signal: ctl.signal }).finally(() => clearTimeout(tm));
      log(label + '_status', res.status + ' (' + Math.round(performance.now() - t0) + 'ms)');
    } catch (e) { log(label + '_error', (e && e.name) + ' (' + Math.round(performance.now() - t0) + 'ms)'); }
  }

  // 1. Info service worker
  try {
    const ctl = navigator.serviceWorker.controller;
    log('sw_url', ctl ? ctl.scriptURL : 'tidak ada controller');
    const regs = await navigator.serviceWorker.getRegistrations();
    log('sw_regs', (regs || []).map(r => r.scope + ' aktif=' + !!(r.active)));
  } catch (e) { log('sw_info_err', e && e.message); }

  // 2. Tanpa header auth (tanpa preflight)
  await timedFetch('noauth', base + '/deploy?project_id=' + encodeURIComponent(pid) + '&fast=1', {});

  // 3. Dengan auth (preflight)
  await timedFetch('auth', base + '/deploy?project_id=' + encodeURIComponent(pid) + '&fast=1', { Authorization: 'Bearer ' + tok });

  // 4. Unregister semua service worker
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) { await r.unregister(); log('sw_unregistered', r.scope); }
  } catch (e) { log('sw_unreg_err', e && e.message); }

  // 5. Tes lagi SETELAH unregister (controller masih aktif sampai reload, jadi ini masih via SW lama)
  await timedFetch('auth_after_unreg', base + '/deploy?project_id=' + encodeURIComponent(pid) + '&fast=1', { Authorization: 'Bearer ' + tok });

  log('selesai', 'RELOAD halaman ini untuk tes tanpa SW sama sekali');
  document.getElementById('out').textContent = out.join('\n');
})();
</script>
</body>
</html>
