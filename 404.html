<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clincoo - Halaman tidak ditemukan</title>
<meta name="robots" content="noindex">
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;color:#111;">
<div style="padding:24px;">
    <div style="font-size:44px;margin-bottom:10px;">🔍</div>
    <h1 style="font-size:20px;margin:0 0 8px;font-weight:700;">Halaman tidak ditemukan</h1>
    <p style="color:#555;font-size:14px;margin:0 0 20px;">Alamat yang kamu buka tidak tersedia. Mengalihkan ke halaman utama…</p>
    <a id="home" href="/">Kembali ke Beranda</a>
</div>
<script>
// GitHub Pages tidak mendukung rewrite server. Halaman ini memulihkan URL lama/virtual
// yang dikenal, dan selain itu OTOMATIS mengalihkan ke halaman utama (ala repo Wallet).
(function () {
    var base = location.hostname.indexOf('github.io') !== -1 ? '/Clincoo.' : '';
    document.getElementById('home').href = base + '/';
    var p = decodeURIComponent(location.pathname), m, q = location.search, h = location.hash;
    // pola lama: /Clincoo./<seg>.html -> /Clincoo./<seg>/
    m = p.match(/^(.*?)([A-Za-z0-9_-]+)\.html$/);
    if (m) { location.replace(m[1] + m[2] + '/' + q + h); return; }
    // selain pola yang dikenal -> halaman utama (location.replace: tanpa entri history baru)
    setTimeout(function () { location.replace(base + '/'); }, 800);
})();
</script>
</body>
</html>
